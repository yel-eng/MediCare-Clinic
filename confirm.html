<!DOCTYPE html>
<html lang="ar">
<head>
<meta charset="UTF-8">
<title>تم الحجز</title>
<link rel="stylesheet" href="style.css">
</head>

<body>

<div class="confirm-box">

<h2>🎉 تم تأكيد الحجز</h2>

<p>الاسم: <span id="n"></span></p>
<p>الهاتف: <span id="p"></span></p>
<p>التاريخ: <span id="d"></span></p>
<p>الوقت: <span id="t"></span></p>

</div>

<script>
document.getElementById("n").innerText = localStorage.getItem("name");
document.getElementById("p").innerText = localStorage.getItem("phone");
document.getElementById("d").innerText = localStorage.getItem("date");
document.getElementById("t").innerText = localStorage.getItem("time");
</script>

</body>
</html>
