<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>تسجيل الدخول - ميديكال كلينك</title>
<style>
body { margin: 0; padding: 0; font-family: 'Segoe UI', sans-serif; background: linear-gradient(135deg, #1a237e, #3949ab); height: 100vh; display: flex; justify-content: center; align-items: center; }
.login-box { background: #fff; padding: 30px; border-radius: 15px; width: 320px; box-shadow: 0 10px 25px rgba(0,0,0,0.2); text-align: center; }
.login-box h2 { margin-bottom: 20px; color: #1a237e; }
input { width: 100%; padding: 12px; margin: 10px 0; border: 1px solid #ccc; border-radius: 8px; outline: none; transition: 0.3s; box-sizing: border-box; }
input:focus { border-color: #1a237e; box-shadow: 0 0 5px rgba(26,35,126,0.3); }
button { width: 100%; padding: 12px; background: #1a237e; color: #fff; border: none; border-radius: 8px; cursor: pointer; font-size: 16px; transition: 0.3s; }
button:hover { background: #3949ab; }
::placeholder { color: #999; }
.error-msg { color: #d32f2f; font-size: 13px; margin-top: 5px; display: none; }
.hint { color: #22c55e; font-size: 12px; margin-top: 15px; background: #f0fdf4; padding: 8px; border-radius: 8px; }
</style>
</head>
<body>

<div class="login-box">
  <h2>🔐 تسجيل الدخول</h2>
  
  <input type="email" id="email" placeholder="البريد الإلكتروني (اختياري)">
  <input type="password" id="password" placeholder="كلمة المرور (اختياري)">
  <p id="errorMsg" class="error-msg"></p>
  
  <button onclick="handleLogin()">دخول</button>
  
  <div class="hint">💡 أي إيميل وأي كلمة سر هتفتح</div>
</div>

<!-- ✅ كود بسيط - بدون Firebase -->
<script>
// ⚠️ إيميل الأدمن (لو حطيتيه، هيدخلك على صفحة الأدمن)
const ADMIN_EMAIL = "admin@clinic.com"; 

/* ================= دالة الدخول ================= */
function handleLogin() {
  const email = document.getElementById("email").value.trim();
  const password = document.getElementById("password").value;
  const errorMsg = document.getElementById("errorMsg");
  
  // إخفاء الخطأ السابق
  errorMsg.style.display = "none";
  errorMsg.textContent = "";
  
  // ✅ أي كلمة سر تفتح - حتى لو فاضية
  // التوجيه حسب الإيميل فقط
  if (email.toLowerCase() === ADMIN_EMAIL.toLowerCase()) {
    // ✅ أدمن → يروح لصفحة الأدمن
    window.location.href = "admin.html";
  } else {
    // 👤 مستخدم عادي → يروح لصفحة الحجز
    window.location.href = "booking.html";
  }
}

// ✅ دخول بزر Enter
document.addEventListener("keypress", function(e) {
  if (e.key === "Enter") {
    handleLogin();
  }
});

/* ================= تسجيل الخروج ================= */
function handleLogout() {
  window.location.href = "login.html";
}

console.log("✅ Login Page Loaded - Simple Mode (Any Password Works)");
</script>

</body>
</html>
