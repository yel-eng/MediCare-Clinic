<style>
body {
  margin: 0;
  padding: 0;
  font-family: 'Segoe UI', sans-serif;
  background: linear-gradient(135deg, #1a237e, #3949ab);
  height: 100vh;
  display: flex;
  justify-content: center;
  align-items: center;
}

.login-box {
  background: #fff;
  padding: 30px;
  border-radius: 15px;
  width: 320px;
  box-shadow: 0 10px 25px rgba(0,0,0,0.2);
  text-align: center;
}

.login-box h2 {
  margin-bottom: 20px;
  color: #1a237e;
}

input {
  width: 100%;
  padding: 12px;
  margin: 10px 0;
  border: 1px solid #ccc;
  border-radius: 8px;
  outline: none;
  transition: 0.3s;
}

input:focus {
  border-color: #1a237e;
  box-shadow: 0 0 5px rgba(26,35,126,0.3);
}

button {
  width: 100%;
  padding: 12px;
  background: #1a237e;
  color: #fff;
  border: none;
  border-radius: 8px;
  cursor: pointer;
  font-size: 16px;
  transition: 0.3s;
}

button:hover {
  background: #3949ab;
}

::placeholder {
  color: #999;
}
</style>


<div class="login-box">
  <h2>تسجيل الدخول</h2>

  <input type="email" id="email" placeholder="Email">
  <input type="password" id="password" placeholder="Password">
  <button onclick="login()">Login</button>
</div>



<script type="module" src="auth.js">
/* =========================
   FIREBASE INIT
========================= */

import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-app.js";
import { 
  getFirestore, doc, getDoc 
} from "https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore.js";

import {
  getAuth,
  signInWithEmailAndPassword,
  signOut,
  onAuthStateChanged
} from "https://www.gstatic.com/firebasejs/10.12.2/firebase-auth.js";

/* =========================
   CONFIG
========================= */

const firebaseConfig = {
  apiKey: "AIzaSyA8FEgNeXAMZ1Sbg12zFCzwwxUD3sVl99o",
  authDomain: "mydoctor-clinic.firebaseapp.com",
  projectId: "mydoctor-clinic",
};

const app = initializeApp(firebaseConfig);

const db = getFirestore(app);
const auth = getAuth(app);

/* =========================
   AUTH STATE
========================= */

let currentUser = null;

/* =========================
   LOGIN FUNCTION
========================= */

window.login = async function () {

  const email = document.getElementById("email").value;
  const password = document.getElementById("password").value;

  try {

    const userCred = await signInWithEmailAndPassword(auth, email, password);

    const uid = userCred.user.uid;

    const roleSnap = await getDoc(doc(db, "users", uid));

    let role = "user";

    if (roleSnap.exists()) {
      role = roleSnap.data().role || "user";
    }

    currentUser = {
      uid,
      email: userCred.user.email,
      role
    };

    alert("Login successful ✔️");

    window.location.href = "booking.html";

  } catch (err) {
    alert("Login failed: " + err.message);
  }
};

/* =========================
   LOGOUT FUNCTION
========================= */

window.logout = async function () {
  await signOut(auth);
  currentUser = null;
  window.location.href = "login.html";
};

/* =========================
   AUTH GUARD (PROTECTION)
========================= */

onAuthStateChanged(auth, async (user) => {

  if (!user) {
    currentUser = null;
    return;
  }

  const roleSnap = await getDoc(doc(db, "users", user.uid));

  let role = "user";

  if (roleSnap.exists()) {
    role = roleSnap.data().role || "user";
  }

  currentUser = {
    uid: user.uid,
    email: user.email,
    role
  };

  console.log("Logged in as:", currentUser.role);
});

/* =========================
   GLOBAL ACCESS
========================= */

window.currentUser = currentUser;

/* =========================
   ROLE CHECK HELPERS
========================= */

window.isAdmin = function () {
  return currentUser?.role === "admin";
};

window.isUser = function () {
  return currentUser?.role === "user";
};  


  import { login } from "./auth.js";
import { getDoc, doc } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore.js";
import { db } from "./firebase.js";

window.loginUser = async function () {

  const email = document.getElementById("email").value;
  const password = document.getElementById("password").value;

  try {

    const cred = await login(email, password);
    const uid = cred.user.uid;

    const snap = await getDoc(doc(db, "users", uid));

    let role = "user";

    if (snap.exists()) {
      role = snap.data().role;
    }

    // 👉 التوجيه حسب الدور
    if (role === "admin") {
      window.location.href = "admin.html";
    } else {
      alert("Not allowed for admin panel");
      window.location.href = "booking.html";
    }

  } catch (err) {
    alert(err.message);
  }
};
  </script>
