<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>تسجيل الدخول - ميديكال كلينك</title>
<style>
body { margin: 0; padding: 0; font-family: 'Segoe UI', sans-serif; background: linear-gradient(135deg, #1a237e, #3949ab); height: 100vh; display: flex; justify-content: center; align-items: center; }
.login-box { background: #fff; padding: 30px; border-radius: 15px; width: 320px; box-shadow: 0 10px 25px rgba(0,0,0,0.2); text-align: center; }
.login-box h2 { margin-bottom: 20px; color: #1a237e; }
input { width: 100%; padding: 12px; margin: 10px 0; border: 1px solid #ccc; border-radius: 8px; outline: none; transition: 0.3s; box-sizing: border-box; }
input:focus { border-color: #1a237e; box-shadow: 0 0 5px rgba(26,35,126,0.3); }
button { width: 100%; padding: 12px; background: #1a237e; color: #fff; border: none; border-radius: 8px; cursor: pointer; font-size: 16px; transition: 0.3s; }
button:hover { background: #3949ab; }
::placeholder { color: #999; }
.error-msg { color: #d32f2f; font-size: 13px; margin-top: 5px; display: none; }
</style>
</head>
<body>

<div class="login-box">
  <h2>🔐 تسجيل الدخول</h2>
  
  <input type="email" id="email" placeholder="البريد الإلكتروني">
  <input type="password" id="password" placeholder="كلمة المرور">
  <p id="errorMsg" class="error-msg"></p>
  
  <button onclick="handleLogin()">دخول</button>
</div>

<!-- ✅ كود الجافاسكريبت مدمج في نفس الملف (بدون ملفات خارجية) -->
<script type="module">
import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-app.js";
import { getAuth, signInWithEmailAndPassword } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-auth.js";
import { getFirestore, doc, getDoc } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore.js";

/* ================= FIREBASE CONFIG ================= */
const firebaseConfig = {
  apiKey: "AIzaSyA8FEgNeXAMZ1Sbg12zFCzwwxUD3sVl99o",
  authDomain: "mydoctor-clinic.firebaseapp.com",
  projectId: "mydoctor-clinic",
};

const app = initializeApp(firebaseConfig);
const auth = getAuth(app);
const db = getFirestore(app);

// ⚠️ ضعي الإيميل بتاع الأدمن هنا
const ADMIN_EMAIL = "admin@clinic.com"; 

/* ================= دالة الدخول (مربوطة بـ window عشان onclick يشتغل) ================= */
window.handleLogin = async function() {
  const email = document.getElementById("email").value.trim();
  const password = document.getElementById("password").value;
  const errorMsg = document.getElementById("errorMsg");
  const btn = document.querySelector("button");
  
  // إخفاء الخطأ السابق
  errorMsg.style.display = "none";
  errorMsg.textContent = "";
  
  // تحقق بسيط من المدخلات
  if (!email || !password) {
    showError("12345678");
    return;
  }
  
  // تعطيل الزر أثناء التحميل
  btn.disabled = true;
  btn.textContent = "جاري الدخول...";
  
  try {
    // 1. تسجيل الدخول عبر فايربيس
    const userCred = await signInWithEmailAndPassword(auth, email, password);
    const user = userCred.user;
    
    // 2. فحص الدور من قاعدة البيانات (users collection)
    const userDoc = await getDoc(doc(db, "users", user.uid));
    const role = userDoc.exists() ? userDoc.data().role : "user";
    
    // 3. التوجيه حسب الدور
    if (email.toLowerCase() === ADMIN_EMAIL.toLowerCase() || role === "admin") {
      // ✅ أدمن → يروح لصفحة الأدمن
      window.location.href = "admin.html";
    } else {
      // 👤 مستخدم عادي → يروح لصفحة الحجز
      window.location.href = "booking.html";
    }
    
  } catch (err) {
    console.error("Login Error:", err);
    
    // ترجمة أخطاء فايربيس الشائعة
    let msg = "❌ فشل تسجيل الدخول";
    if (err.code === "auth/invalid-email") msg = "⚠️ صيغة البريد غير صحيحة";
    else if (err.code === "auth/user-disabled") msg = "⚠️ هذا الحساب معطل";
    else if (err.code === "auth/user-not-found") msg = "⚠️ لا يوجد حساب بهذا البريد";
    else if (err.code === "auth/wrong-password") msg = "⚠️ كلمة المرور غير صحيحة";
    else if (err.code === "auth/too-many-requests") msg = "⚠️ محاولات كثيرة، حاولي لاحقاً";
    
    showError(msg);
    
    // إعادة تفعيل الزر
    btn.disabled = false;
    btn.textContent = "دخول";
  }
};

/* ================= دالة مساعدة لعرض الأخطاء ================= */
function showError(msg) {
  const el = document.getElementById("errorMsg");
  el.textContent = msg;
  el.style.display = "block";
  
  // إخفاء الرسالة تلقائياً بعد 5 ثواني
  setTimeout(() => { el.style.display = "none"; }, 5000);
}

/* ================= تسجيل الخروج (لو محتاجة تستخدميها من صفحات تانية) ================= */
window.handleLogout = async function() {
  try {
    await auth.signOut();
    window.location.href = "login.html";
  } catch (err) {
    console.error("Logout Error:", err);
  }
};

console.log("✅ Login Page Loaded - Auth Ready");
</script>

</body>
</html>
