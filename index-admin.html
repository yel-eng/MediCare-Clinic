<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<title>لوحة التحكم</title>

<style>

body{
  margin:0;
  font-family:Tajawal;
  background:#f1f5f9;
  display:flex;
}

/* SIDEBAR */
.side-nav{
  position:fixed;
  top:0;
  right:0;
  width:220px;
  height:100vh;
  background:linear-gradient(180deg,#1e3a8a,#1d4ed8);
  padding:25px 15px;
  display:flex;
  flex-direction:column;
  gap:12px;
  color:#fff;
  box-shadow:-10px 0 30px rgba(0,0,0,0.1);
}

.side-nav .logo{
  text-align:center;
  font-size:20px;
  margin-bottom:20px;
}

.side-nav a{
  color:#fff;
  text-decoration:none;
  padding:12px;
  border-radius:10px;
  transition:0.3s;
  font-size:15px;
}

.side-nav a:hover{
  background:rgba(255,255,255,0.15);
}
  

  
/* MAIN */
.main-content{
  margin-right:227px;
  padding:25px;
  width:100%;
}

/* FORM */
input,textarea,select{
  width:100%;
  padding:12px;
  margin:8px 0;
  border-radius:10px;
  border:1px solid #e2e8f0;
  outline:none;
  font-size:14px;
}

button{
  background:#1d4ed8;
  padding:12px 18px;
  c#1d4ed8;
  border:none;
  border-radius:10px;
  cursor:pointer;
  transition:0.3s;
}

button:hover{
  transform:translateY(-2px);
  background:#2563eb;
}

/* GRID */
#list{
  display:grid;
  grid-template-columns:repeat(auto-fill,minmax(260px,1fr));
  gap:15px;
  margin-top:15px;
}

/* CARD */
.card{
  background:#fff;
  padding:15px;
  border-radius:15px;
  box-shadow:0 10px 25px rgba(0,0,0,0.06);
  transition:0.3s;
  position:relative;
}

.card:hover{
  transform:translateY(-5px);
}

/* TYPE BADGE */
.badge{
  display:inline-block;
  padding:4px 10px;
  font-size:12px;
  border-radius:20px;
  background:#e0f2fe;
  color:#0369a1;
  margin-bottom:8px;
}

/* DELETE */
.del-btn{
  position:absolute;
  top:10px;
  left:10px;
  background:#ef4444;
  border:none;
  color:#fff;
  border-radius:8px;
  padding:5px 8px;
  cursor:pointer;
}
      
</style>




  
</head>

<body>
 
  

  <div class="side-nav">

  <h2 class="logo">Admin</h2>

  <a href="https://yel-eng.github.io/MediCare-Clinic/admin.html">
    🏠 لوحة التحكم
  </a>

  <a href="https://yel-eng.github.io/MediCare-Clinic/index-admin.html">
    📂 إدارة المحتوى
  </a>

  <a href="#" class="disabled">
    🚧 قريباً
  </a>

</div>



   <div class="main-content">

<h2 style="background:linear-gradient(180deg,#1e3a8a,#1d4ed8);">
  
إضافة محتوى</h2>

<select id="type">
  <option value="article">مقال</option>
  <option value="video">فيديو</option>
  <option value="image">صورة</option>
</select>

<input id="title" placeholder="العنوان">
<input id="link" placeholder="لينك الصورة أو الفيديو">
<textarea id="desc" placeholder="الوصف (اختياري)"></textarea>

<button onclick="addItem()">إضافة</button>

<h2 style="background:linear-gradient(180deg,#1e3a8a,#1d4ed8);">
  المحتوى الحالي
</h2>
  <div id="list">  

 </div>   
</div>
  <script type="module">
import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-app.js";
import { getFirestore, collection, addDoc, getDocs, deleteDoc, doc, updateDoc } 
from "https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore.js";

const firebaseConfig = {
  apiKey: "AIzaSyA8FEgNeXAMZ1Sbg12zFCzwwxUD3sVl99o",
  authDomain: "mydoctor-clinic.firebaseapp.com",
  projectId: "mydoctor-clinic"
};

const app = initializeApp(firebaseConfig);
const db = getFirestore(app);
<script>
let editingId = null;
let data = JSON.parse(localStorage.getItem("clinicData")) || [];

function save(){
  localStorage.setItem("clinicData", JSON.stringify(data));
  render();
}

function addItem(){

  if(editingId){
    // ✏️ تعديل
    data = data.map(item => {
      if(item.id === editingId){
        return {
          ...item,
          type: document.getElementById("type").value,
          title: document.getElementById("title").value,
          link: document.getElementById("link").value,
          desc: document.getElementById("desc").value
        };
      }
      return item;
    });

    editingId = null;

  }else{
    // ➕ إضافة جديدة
    const item = {
      id: Date.now(),
      type: document.getElementById("type").value,
      title: document.getElementById("title").value,
      link: document.getElementById("link").value,
      desc: document.getElementById("desc").value
    };

    data.push(item);
  }

  save();
}

function deleteItem(id){
  data = data.filter(i => i.id !== id);
  save();
}

function render(){
  const list = document.getElementById("list");
  list.innerHTML = "";

  data.forEach(item=>{
    list.innerHTML += `
      <div class="card">
      
        <button class="del-btn" onclick="deleteItem(${item.id})">×</button>

        <button onclick="editItem(${item.id})"
          style="position:absolute;top:10px;right:10px;background:#0ea5e9;">
          ✏️
        </button>

        <div class="badge">${item.type}</div>

        <h3>${item.title}</h3>

        ${
          item.type === "image"
          ? `<img src="${item.link}" style="width:100%;border-radius:10px;margin-top:10px">`
          : ""
        }

        ${
          item.type === "video"
          ? `<video controls style="width:100%;border-radius:10px;margin-top:10px">
               <source src="${item.link}">
             </video>`
          : ""
        }

        ${
          item.desc
          ? `<p style="color:#64748b;margin-top:10px">${item.desc}</p>`
          : ""
        }

      </div>
    `;
  });
}
 function editItem(id){
  const item = data.find(i => i.id === id);

  type.value = item.type;
  title.value = item.title;
  link.value = item.link;
  desc.value = item.desc;

  editingId = id;
}
  render();
    async function addItem(){

  const item = {
    type: type.value,
    title: title.value,
    link: link.value,
    desc: desc.value
  };

  if(editingId){
    // تعديل
    await updateDoc(doc(db, "content", editingId), item);
    editingId = null;
  }else{
    // إضافة
    await addDoc(collection(db, "content"), item);
  }

  loadData();
}

    async function addItem(){

  const item = {
    type: type.value,
    title: title.value,
    link: link.value,
    desc: desc.value
  };

  if(editingId){
    // تعديل
    await updateDoc(doc(db, "content", editingId), item);
    editingId = null;
  }else{
    // إضافة
    await addDoc(collection(db, "content"), item);
  }

  loadData();
}

    async function loadData(){
  const querySnapshot = await getDocs(collection(db, "content"));

  data = [];

  querySnapshot.forEach(docSnap=>{
    data.push({ id: docSnap.id, ...docSnap.data() });
  });

  render();
}
    loadData();
</script>

</body>
</html>
