<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<title>لوحة التحكم</title>

<style>

body{
  margin:0;
  font-family:Tajawal;
  background:#f1f5f9;
  display:flex;
}

/* SIDEBAR */
.side-nav{
  position:fixed;
  top:0;
  right:0;
  width:240px;
  height:100vh;
  background:linear-gradient(180deg,#1e3a8a,#1d4ed8);
  padding:25px 15px;
  display:flex;
  flex-direction:column;
  gap:12px;
  color:#fff;
  box-shadow:-10px 0 30px rgba(0,0,0,0.1);
}

.side-nav .logo{
  text-align:center;
  font-size:20px;
  margin-bottom:20px;
}

.side-nav a{
  color:#fff;
  text-decoration:none;
  padding:12px;
  border-radius:10px;
  transition:0.3s;
  font-size:15px;
}

.side-nav a:hover{
  background:rgba(255,255,255,0.15);
}
  
h2{ background: #c8e6c9 ;}
  
/* MAIN */
.main-content{
  margin-right:250px;
  padding:25px;
  width:100%;
}

/* FORM */
input,textarea,select{
  width:100%;
  padding:12px;
  margin:8px 0;
  border-radius:10px;
  border:1px solid #e2e8f0;
  outline:none;
  font-size:14px;
}

button{
  background:#1d4ed8;
  padding:12px 18px;
  c#1d4ed8;
  border:none;
  border-radius:10px;
  cursor:pointer;
  transition:0.3s;
}

button:hover{
  transform:translateY(-2px);
  background:#2563eb;
}

/* GRID */
#list{
  display:grid;
  grid-template-columns:repeat(auto-fill,minmax(260px,1fr));
  gap:15px;
  margin-top:15px;
}

/* CARD */
.card{
  background:#fff;
  padding:15px;
  border-radius:15px;
  box-shadow:0 10px 25px rgba(0,0,0,0.06);
  transition:0.3s;
  position:relative;
}

.card:hover{
  transform:translateY(-5px);
}

/* TYPE BADGE */
.badge{
  display:inline-block;
  padding:4px 10px;
  font-size:12px;
  border-radius:20px;
  background:#e0f2fe;
  color:#0369a1;
  margin-bottom:8px;
}

/* DELETE */
.del-btn{
  position:absolute;
  top:10px;
  left:10px;
  background:#ef4444;
  border:none;
  color:#fff;
  border-radius:8px;
  padding:5px 8px;
  cursor:pointer;
}
      
</style>




  
</head>

<body>
 
  

  <div class="side-nav">

  <h2 class="logo">Admin</h2>

  <a href="https://yel-eng.github.io/MediCare-Clinic/admin.html">
    🏠 لوحة التحكم
  </a>

  <a href="https://yel-eng.github.io/MediCare-Clinic/index-admin.html">
    📂 إدارة المحتوى
  </a>

  <a href="#" class="disabled">
    🚧 قريباً
  </a>

</div>



   <div class="main-content">

<h2 style="background:#c8e6c9;">
  
إضافة محتوى</h2>

<select id="type">
  <option value="article">مقال</option>
  <option value="video">فيديو</option>
  <option value="image">صورة</option>
</select>

<input id="title" placeholder="العنوان">
<input id="link" placeholder="لينك الصورة أو الفيديو">
<textarea id="desc" placeholder="الوصف (اختياري)"></textarea>

<button onclick="addItem()">إضافة</button>

<h2 style="background:#c8e6c9;">
  المحتوى الحالي
</h2>
  <div id="list">  

 </div>   
</div>
<script>
let data = JSON.parse(localStorage.getItem("clinicData")) || [];

function save(){
  localStorage.setItem("clinicData", JSON.stringify(data));
  render();
}

function addItem(){
  const item = {
    id: Date.now(),
    type: document.getElementById("type").value,
    title: document.getElementById("title").value,
    link: document.getElementById("link").value,
    desc: document.getElementById("desc").value
  };

  data.push(item);
  save();
}

function deleteItem(id){
  data = data.filter(i => i.id !== id);
  save();
}

function render(){
  const list = document.getElementById("list");
  list.innerHTML = "";

  data.forEach(item=>{
    list.innerHTML += `
      <div class="card">
      
        <button class="del-btn" onclick="deleteItem(${item.id})">×</button>

        <div class="badge">${item.type}</div>

        <h3>${item.title}</h3>

        ${
          item.type === "image"
          ? `<img src="${item.link}" style="width:100%;border-radius:10px;margin-top:10px">`
          : ""
        }

        ${
          item.type === "video"
          ? `<video controls style="width:100%;border-radius:10px;margin-top:10px">
               <source src="${item.link}">
             </video>`
          : ""
        }

        ${
          item.desc
          ? `<p style="color:#64748b;margin-top:10px">${item.desc}</p>`
          : ""
        }

      </div>
    `;
  });
}
</script>

</body>
</html>
