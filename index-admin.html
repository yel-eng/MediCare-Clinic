<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>إدارة المحتوى - عيادة الدكتور</title>
<style>
:root{--main:#1a237e;--main-light:#3949ab;--bg:#f4f7f6;--white:#fff;--text:#333;--danger:#ef4444;--success:#22c55e;--warning:#f59e0b;--radius:14px;--shadow:0 4px 16px rgba(0,0,0,0.06)}
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:'Segoe UI',Tahoma,Arial,sans-serif;background:var(--bg);color:var(--text);padding:20px;margin-right:235px;line-height:1.6}
.side-nav{position:fixed;top:0;right:0;width:220px;height:100vh;background:linear-gradient(180deg,var(--main),var(--main-light));padding:25px 15px;display:flex;flex-direction:column;gap:15px;z-index:999;box-shadow:-5px 0 20px rgba(0,0,0,0.2)}
.side-nav .logo{color:#fff;text-align:center;margin-bottom:20px;font-size:18px;font-weight:bold}
.side-nav a.active{background:var(--white);color:var(--main);font-weight:bold}
.side-nav a.disabled{opacity:0.5;pointer-events:none}
.side-nav a{text-decoration:none;color:#fff;padding:12px;border-radius:10px;transition:0.3s;font-size:15px;white-space:nowrap}
.side-nav a:hover{background:rgba(255,255,255,0.15);transform:translateX(-3px)}
.main-content{padding:25px;width:100%}
.page-header{background:linear-gradient(180deg,#1e3a8a,#1d4ed8);color:#fff;padding:20px 25px;border-radius:var(--radius);margin-bottom:25px;display:flex;justify-content:space-between;align-items:center}
.page-header h2{font-size:18px}
.form-group{margin-bottom:15px}
.form-group label{display:block;font-size:13px;color:#64748b;margin-bottom:6px;font-weight:500}
input,textarea,select{width:100%;padding:14px 16px;border-radius:12px;border:1px solid #e5e7eb;background:#fff;font-size:14px;transition:0.25s}
input:hover,textarea:hover,select:hover{border-color:#cbd5f5}
input:focus,textarea:focus,select:focus{border-color:#1d4ed8;box-shadow:0 0 0 4px rgba(29,78,216,0.12);outline:none}
select{appearance:none;background-image:url("data:image/svg+xml,%3Csvg fill='%2364748b' height='20' viewBox='0 0 24 24' width='20' xmlns='http://www.w3.org/2000/svg'%3E%3Cpath d='M7 10l5 5 5-5z'/%3E%3C/svg%3E");background-repeat:no-repeat;background-position:left 12px center;background-size:18px;padding-left:40px}
textarea{min-height:100px;resize:vertical}
.btn{background:var(--main);color:#fff;border:none;padding:12px 20px;border-radius:10px;cursor:pointer;font-size:14px;font-weight:500;transition:0.2s;display:inline-flex;align-items:center;gap:6px}
.btn:hover{background:var(--main-light);transform:translateY(-2px)}
.btn:disabled{opacity:0.6;cursor:not-allowed;transform:none}
.btn-success{background:var(--success)}
.btn-success:hover{background:#16a34a}
.btn-danger{background:var(--danger)}
.btn-danger:hover{background:#dc2626}
.btn-warning{background:var(--warning);color:#000}
.btn-warning:hover{background:#d97706}
.btn-sm{padding:6px 12px;font-size:12px;border-radius:8px}
#list{display:grid;grid-template-columns:repeat(auto-fill,minmax(280px,1fr));gap:20px;margin-top:20px}
.card{background:linear-gradient(180deg,#fff,#f8fafc);padding:20px;border-radius:var(--radius);border:1px solid #eef2f7;box-shadow:var(--shadow);transition:0.3s;position:relative;overflow:hidden}
.card::before{content:"";position:absolute;top:0;right:0;width:100%;height:4px;background:linear-gradient(90deg,#1d4ed8,#38bdf8);opacity:0;transition:0.3s}
.card:hover{transform:translateY(-8px);box-shadow:0 10px 30px rgba(0,0,0,0.12)}
.card:hover::before{opacity:1}
.card h3{font-size:16px;margin:12px 0;color:#0f172a;font-weight:600}
.card p{color:#64748b;font-size:13px;line-height:1.7}
.card img,.card video{width:100%;border-radius:12px;margin-top:12px;transition:0.3s}
.card:hover img,.card:hover video{transform:scale(1.02)}
.badge{display:inline-block;padding:5px 12px;font-size:11px;border-radius:20px;font-weight:500;margin-bottom:10px}
.badge-article{background:#dbeafe;color:#1e40af}
.badge-video{background:#dcfce7;color:#166534}
.badge-image{background:#fef3c7;color:#92400e}
.card-actions{position:absolute;top:12px;left:12px;display:flex;gap:6px}
.card-actions button{border:none;border-radius:8px;padding:6px 10px;cursor:pointer;font-size:11px;transition:0.2s}
.card-actions .del-btn{background:var(--danger);color:#fff}
.card-actions .del-btn:hover{background:#dc2626}
.card-actions .edit-btn{background:#0ea5e9;color:#fff}
.card-actions .edit-btn:hover{background:#0284c7}
.empty-state{text-align:center;padding:40px;color:#64748b}
.loading-state{text-align:center;padding:20px;color:var(--main);font-weight:500}
.toast{position:fixed;bottom:20px;left:50%;transform:translateX(-50%);background:var(--success);color:#fff;padding:14px 24px;border-radius:12px;font-weight:500;box-shadow:0 10px 30px rgba(0,0,0,0.2);z-index:10000;animation:slideIn 0.3s ease, fadeOut 0.3s ease 3.7s forwards}
.toast.error{background:var(--danger)}
@keyframes slideIn{from{transform:translateX(-50%) translateY(100px);opacity:0}to{transform:translateX(-50%) translateY(0);opacity:1}}
@keyframes fadeOut{from{opacity:1}to{opacity:0}}
@media(max-width:900px){body{margin-right:0;padding:15px}.side-nav{right:-220px;transition:right 0.3s}.side-nav.open{right:0}.main-content{margin-right:0}.menu-toggle{display:flex!important}}
.menu-toggle{display:none;position:fixed;top:15px;right:15px;z-index:1000;background:var(--main);color:#fff;border:none;width:44px;height:44px;border-radius:10px;font-size:20px;cursor:pointer}
</style>
</head>
<body>
<button class="menu-toggle" onclick="toggleMenu()">☰</button>
<div class="side-nav" id="sideNav">
  <h2 class="logo">🏥 عيادة الدكتور</h2>
  <a href="admin.html">🏠 لوحة المواعيد</a>
  <a href="index-admin.html" class="active">📂 إدارة المحتوى</a>
  <a href="patients.html">📋 ملفات المرضى</a>
  <button onclick="logout()" class="btn" style="margin-top:auto;background:#ef4444">🚪 خروج</button>
</div>
<div class="main-content">
  <div class="page-header"><h2>📚 إدارة محتوى الموقع</h2><span id="itemsCount" style="background:rgba(255,255,255,0.2);padding:6px 14px;border-radius:20px;font-size:13px">0 عنصر</span></div>
  <div class="card" style="margin-bottom:25px">
    <h3 style="margin:0 0 15px;color:var(--main)" id="formTitle">➕ إضافة عنصر جديد</h3>
    <div class="form-group"><label>نوع المحتوى</label><select id="type"><option value="article">📄 مقال</option><option value="video">🎥 فيديو</option><option value="image">🖼️ صورة</option></select></div>
    <div class="form-group"><label>العنوان *</label><input id="title" placeholder="اكتب عنوان المحتوى"></div>
    <div class="form-group"><label>الرابط *</label><input id="link" placeholder="رابط الصورة/الفيديو/المقال"></div>
    <div class="form-group"><label>الوصف (اختياري)</label><textarea id="desc" placeholder="وصف مختصر للمحتوى"></textarea></div>
    <div style="display:flex;gap:10px;flex-wrap:wrap"><button class="btn" onclick="addItem()" id="saveBtn">💾 حفظ</button><button class="btn btn-warning" onclick="cancelEdit()" id="cancelBtn" style="display:none">❌ إلغاء</button></div>
  </div>
  <h3 style="color:var(--main);margin-bottom:15px">📋 المحتوى الحالي</h3>
  <div id="list"><div class="loading-state">⏳ جاري تحميل المحتوى...</div></div>
</div>
<script type="module">
import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-app.js";
import { getFirestore, collection, addDoc, getDocs, deleteDoc, doc, updateDoc, serverTimestamp } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore.js";
import { getAuth, onAuthStateChanged, signOut } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-auth.js";

const firebaseConfig = {
  apiKey: "AIzaSyA8FEgNeXAMZ1Sbg12zFCzwwxUD3sVl99o",
  authDomain: "mydoctor-clinic.firebaseapp.com",
  projectId: "mydoctor-clinic",
  storageBucket: "mydoctor-clinic.appspot.com",
  messagingSenderId: "123456789",
  appId: "1:123456789:web:abcdef123456"
};
const ADMIN_EMAIL = "admin@clinic.com";
const app = initializeApp(firebaseConfig);
const db = getFirestore(app);
const auth = getAuth(app);
const contentRef = collection(db, "content");
let data = [], editingId = null;
const $ = (id) => document.getElementById(id);

onAuthStateChanged(auth, (user) => {
  if (!user || user.email !== ADMIN_EMAIL) { alert("⚠️ يرجى تسجيل الدخول بحساب الأدمن"); window.location.href = "login.html"; }
});
window.toggleMenu = () => $("sideNav").classList.toggle("open");
window.logout = () => signOut(auth).then(() => location.href = "login.html");

async function loadData() {
  try {
    $("list").innerHTML = '<div class="loading-state">⏳ جاري التحميل...</div>';
    const snapshot = await getDocs(contentRef);
    data = []; snapshot.forEach(docSnap => data.push({ id: docSnap.id, ...docSnap.data() }));
    render(); $("itemsCount").textContent = `${data.length} عنصر`;
  } catch (err) { console.error("❌ Load Error:", err); $("list").innerHTML = `<div class="empty-state" style="color:var(--danger)">❌ فشل تحميل المحتوى:<br><small>${err.message}</small></div>`; showToast("❌ فشل تحميل المحتوى", "error"); }
}
window.addItem = async function() {
  const type = $("type")?.value, title = $("title")?.value.trim(), link = $("link")?.value.trim(), desc = $("desc")?.value.trim();
  if (!title || !link) return showToast("⚠️ العنوان والرابط مطلوبان", "error");
  const saveBtn = $("saveBtn"); saveBtn.disabled = true; saveBtn.textContent = "جاري الحفظ...";
  try {
    const item = { type, title, link, desc, updatedAt: serverTimestamp() };
    if (editingId) { await updateDoc(doc(db, "content", editingId), item); showToast("✅ تم تعديل العنصر بنجاح"); cancelEdit(); }
    else { item.createdAt = serverTimestamp(); await addDoc(contentRef, item); showToast("✅ تم إضافة العنصر بنجاح"); resetForm(); }
    loadData();
  } catch (err) { console.error("❌ Save Error:", err); showToast("❌ فشل الحفظ: " + err.message, "error"); }
  finally { saveBtn.disabled = false; saveBtn.textContent = "💾 حفظ"; }
};
window.deleteItem = async function(id) { if (!confirm("⚠️ هل أنت متأكد من حذف هذا العنصر؟")) return; try { await deleteDoc(doc(db, "content", id)); showToast("✅ تم الحذف بنجاح"); loadData(); } catch (err) { console.error("❌ Delete Error:", err); showToast("❌ فشل الحذف", "error"); } };
window.editItem = function(id) {
  const item = data.find(i => i.id === id); if (!item) return;
  editingId = id; $("type").value = item.type; $("title").value = item.title; $("link").value = item.link; $("desc").value = item.desc || "";
  $("formTitle").textContent = "✏️ تعديل العنصر"; $("saveBtn").textContent = "💾 تحديث"; $("cancelBtn").style.display = "inline-flex";
  window.scrollTo({ top: 0, behavior: "smooth" });
};
window.cancelEdit = function() { editingId = null; resetForm(); };
function resetForm() { $("type").value = "article"; $("title").value = ""; $("link").value = ""; $("desc").value = ""; $("formTitle").textContent = "➕ إضافة عنصر جديد"; $("saveBtn").textContent = "💾 حفظ"; $("cancelBtn").style.display = "none"; }
function render() {
  const list = $("list");
  if (data.length === 0) { list.innerHTML = '<div class="empty-state">📭 لا يوجد محتوى بعد.<br>أضف أول عنصر الآن!</div>'; return; }
  list.innerHTML = data.map(item => {
    const badgeClass = `badge-${item.type}`;
    const typeLabel = item.type === "article" ? "📄 مقال" : item.type === "video" ? "🎥 فيديو" : "🖼️ صورة";
    let media = "";
    if (item.type === "image") media = `<img src="${item.link}" alt="${item.title}" onerror="this.src='data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 width=%22280%22 height=%22160%22><rect fill=%22%23eee%22 width=%22100%%22 height=%22100%%22/><text x=%2250%%22 y=%2250%%22 fill=%22%23999%22 font-size=%2214%22 text-anchor=%22middle%22>صورة غير متاحة</text></svg>'">`;
    else if (item.type === "video") media = `<video controls><source src="${item.link}">متصفحك لا يدعم الفيديو</video>`;
    return `<div class="card"><div class="card-actions"><button class="del-btn" onclick="deleteItem('${item.id}')">🗑️</button><button class="edit-btn" onclick="editItem('${item.id}')">✏️</button></div><span class="badge ${badgeClass}">${typeLabel}</span><h3>${item.title}</h3>${item.desc ? `<p>${item.desc}</p>` : ""}${media}${item.type === "article" && item.link ? `<a href="${item.link}" target="_blank" class="btn btn-sm" style="margin-top:10px">🔗 فتح الرابط</a>` : ""}</div>`;
  }).join("");
}
function showToast(msg, type = "success") {
  const toast = document.createElement("div"); toast.className = `toast ${type === "error" ? "error" : ""}`; toast.textContent = msg; document.body.appendChild(toast); setTimeout(() => toast.remove(), 4000);
}
loadData(); console.log("✅ Content Admin Page Loaded - Firebase Connected");
</script>
</body>
</html>
