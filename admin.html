<!DOCTYPE html>
<html lang="ar">
<head>
<meta charset="UTF-8">
<title>Admin Dashboard</title>

<style>
body{font-family:Arial;direction:rtl;background:#f5f5f5;padding:20px}
.box{background:#fff;padding:15px;margin:15px 0;border-radius:10px}
.card{background:#fff;padding:15px;margin:10px 0;border-radius:10px}
input,button{width:100%;padding:8px;margin:5px}
button{background:#0d47a1;color:#fff;border:none;border-radius:6px}
</style>
</head>

<body>

<h1>🏥 Admin Dashboard</h1>

<!-- SLOTS -->
<div class="box">
<h2>إنشاء المواعيد</h2>

<input type="date" id="slotDate">
<input type="time" id="startTime">
<input type="time" id="endTime">
<input type="number" id="duration" placeholder="مدة الجلسة">

<button onclick="generateSlots()">إنشاء مواعيد</button>

<div id="slots"></div>
</div>

<!-- PATIENTS -->
<div class="box">
<h2>المرضى / الحجوزات</h2>
<div id="patients"></div>
</div>

<script src="https://www.gstatic.com/firebasejs/9.22.2/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/9.22.2/firebase-firestore-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/9.22.2/firebase-storage-compat.js"></script>

<script src="script.js"></script>

</body>
</html>
