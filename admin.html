<script type="module">
import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-app.js";
import { getAuth, signOut } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-auth.js";
import {
  getFirestore,
  collection,
  onSnapshot,
  doc,
  getDoc,
  updateDoc,
  addDoc,
  deleteDoc,
  query,
  where,
  getDocs,
  writeBatch
} from "https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore.js";

/* ================= Firebase ================= */
const firebaseConfig = {
  apiKey: "AIzaSyA8FEgNeXAMZ1Sbg12zFCzwwxUD3sVl99o",
  authDomain: "mydoctor-clinic.firebaseapp.com",
  projectId: "mydoctor-clinic",
  storageBucket: "mydoctor-clinic.firebasestorage.app",
  messagingSenderId: "996532645974",
  appId: "1:996532645974:web:bfc3e6a61bdc7f04a24bf7",
  measurementId: "G-33CQLHP3WP"
};

const app = initializeApp(firebaseConfig);
const auth = getAuth(app);
const db = getFirestore(app);

window.db = db;
window.auth = auth;

/* ================= Helpers ================= */
const $ = (id) => document.getElementById(id);

let cache = [];
let activeId = null;

const slotsRef = collection(db, "slots");

/* ================= Logout ================= */
window.logout = () => {
  signOut(auth).then(() => (location.href = "login.html"));
};

/* ================= Realtime ================= */
onSnapshot(slotsRef, (snap) => {
  cache = [];

  snap.forEach((d) => {
    const data = d.data();
    if (!data) return;

    cache.push({
      id: d.id,
      ...data,
      status: data.status || "حجز"
    });
  });

  try {
    renderSlots();
  } catch (e) {
    console.error("Render Error:", e);
  }
});

/* ================= Select Slot ================= */
window.selectSlot = async (id) => {
  activeId = id;

  const snap = await getDoc(doc(db, "slots", id));
  if (!snap.exists()) return;

  const d = snap.data();

  $("pName").value = d.patient?.name || "";
  $("pPhone").value = d.patient?.phone || "";
  $("pNotes").value = d.patient?.notes || "";
  $("pPaid").value = d.paid || 0;
  $("pStatus").value = d.status || "حجز";

  $("targetTime").innerText = `${d.date} - ${d.time}`;
};

/* ================= Update Slot ================= */
window.updateSlot = async () => {
  if (!activeId) return alert("اختاري ميعاد أولاً");

  await updateDoc(doc(db, "slots", activeId), {
    booked: $("pName").value.trim() !== "",
    status: $("pStatus").value,
    paid: Number($("pPaid").value || 0),
    patient: {
      name: $("pName").value,
      phone: $("pPhone").value,
      notes: $("pNotes").value
    }
  });

  activeId = null;
  alert("تم التعديل ✔️");
};

/* ================= Check Slot ================= */
function isSlotTaken(date, time) {
  return cache.some(s =>
    s.date === date &&
    s.time === time &&
    s.booked === true &&
    s.id !== activeId
  );
}

/* ================= Generate Slots ================= */
window.setAvailability = async () => {
  const date = $("slotDate").value;
  const start = $("startTime").value;
  const end = $("endTime").value;
  const duration = Number($("slotDuration").value);

  if (!date || !start || !end) {
    alert("اكمل البيانات");
    return;
  }

  let s = new Date(`${date}T${start}`);
  const e = new Date(`${date}T${end}`);

  while (s < e) {
    await addDoc(slotsRef, {
      date,
      time: s.toTimeString().slice(0, 5),
      booked: false,
      status: "حجز",
      paid: 0,
      patient: {}
    });

    s.setMinutes(s.getMinutes() + duration);
  }

  alert("تم التوليد ✔️");
};

/* ================= Delete Day ================= */
window.deleteDay = async (date) => {
  if (!confirm("حذف اليوم؟")) return;

  const q = query(slotsRef, where("date", "==", date));
  const snap = await getDocs(q);

  const batch = writeBatch(db);
  snap.forEach((d) => batch.delete(d.ref));

  await batch.commit();
};

/* ================= Render ================= */
function renderSlots() {
  const grid = $("daysGrid");
  const totalBox = $("globalTotal");

  if (!grid || !totalBox) return;

  let days = {};
  let totalGlobal = 0;

  cache.forEach(d => {
    if (!d.date) return;
    if (!days[d.date]) days[d.date] = [];
    days[d.date].push(d);
  });

  grid.innerHTML = "";

  Object.keys(days).sort().forEach(date => {

    let total = 0;

    days[date].forEach(x => {
      if (x.status === "كشف") {
        total += Number(x.paid || 0);
        totalGlobal += Number(x.paid || 0);
      }
    });

    const col = document.createElement("div");
    col.className = "day-col";

    col.innerHTML = `
      <div class="day-head">
        ${date}
        <span class="del-btn" onclick="deleteDay('${date}')">×</span>
      </div>

      <div class="day-money">💰 ${total} جنيه</div>

      ${days[date]
        .sort((a,b) => (a.time || "").localeCompare(b.time || ""))
        .map(x => `
          <div class="slot-item ${x.booked ? "booked" : ""}"
            onclick="selectSlot('${x.id}')">

            <b>${x.time}</b> - ${x.patient?.name || "بدون اسم"} (${x.status})
          </div>
        `).join("")}
    `;

    grid.appendChild(col);
  });

  totalBox.innerText = "💰 إجمالي العيادة: " + totalGlobal + " جنيه";
}


window.assignRequest = async () => {

  if (!activeId) {
    alert("اختاري ميعاد أو طلب أولاً");
    return;
  }

  const newDate = $("assignDate").value;
  const newTime = $("assignTime").value;

  if (!newDate || !newTime) {
    alert("اختار التاريخ والوقت");
    return;
  }

  const currentRef = doc(db, "slots", activeId);
  const currentSnap = await getDoc(currentRef);

  if (!currentSnap.exists()) {
    alert("العنصر غير موجود");
    return;
  }

  const currentData = currentSnap.data();

  // لو نفس الميعاد
  if (currentData.date === newDate && currentData.time === newTime) {
    alert("هذا هو نفس الميعاد الحالي");
    return;
  }

  // البحث عن ميعاد موجود
  const q = query(
    slotsRef,
    where("date", "==", newDate),
    where("time", "==", newTime)
  );

  const res = await getDocs(q);

  let freeSlot = null;

  res.forEach((d) => {
    if (!d.data().booked) {
      freeSlot = d;
    }
  });

  // لو فيه ميعاد فاضي
  if (freeSlot) {

    await updateDoc(doc(db, "slots", freeSlot.id), {
      booked: true,
      status: "حجز",
      patient: currentData.patient || {},
      paid: currentData.paid || 0
    });

    await updateDoc(currentRef, {
      booked: false,
      status: "حجز",
      patient: {},
      paid: 0
    });

    alert("تم نقل الميعاد ✔️");
    return;
  }

  // لو مفيش ميعاد فاضي → إنشاء جديد
  await addDoc(slotsRef, {
    date: newDate,
    time: newTime,
    booked: true,
    status: "حجز",
    paid: currentData.paid || 0,
    patient: currentData.patient || {}
  });

  await updateDoc(currentRef, {
    booked: false,
    status: "حجز",
    patient: {},
    paid: 0
  });

  alert("تم إنشاء ميعاد جديد ✔️");
};


window.assignRequest = async () => {

  if (freeSlot) {

    await updateDoc(doc(db, "slots", freeSlot.id), {

    await updateDoc(currentRef, {
      booked: false,

      paid: 0
    });

    alert("تم نقل الميعاد ✔️");

  }

  // لو مفيش ميعاد فاضي → إنشاء جديد
  await addDoc(slotsRef, {

  await updateDoc(currentRef, {

    status: "حجز",
    patient: {},
    paid: 0
  });

  alert("تم إنشاء ميعاد جديد ✔️");
};

        
</script>
