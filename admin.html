<!DOCTYPE html>
<html lang="ar">
<head>
<meta charset="UTF-8">
<title>Admin Dashboard</title>

<style>
body{font-family:Arial;background:#f5f5f5;padding:20px}
.box{background:#fff;padding:15px;margin:10px 0;border-radius:10px}
button{padding:8px 12px;margin:5px}
input,textarea{width:100%;padding:8px;margin:5px 0}
h2{color:#333}
</style>

</head>

<body>

<h1>Admin Dashboard 🏥</h1>

<!-- VIDEOS -->
<div class="box">
<h2>Videos</h2>
<input id="videoUrl" placeholder="Video URL">
<input id="videoText" placeholder="Description">
<button onclick="addVideo()">Add Video</button>
<div id="videos"></div>
</div>

<!-- BLOGS -->
<div class="box">
<h2>Articles</h2>
<input id="blogTitle" placeholder="Title">
<textarea id="blogText" placeholder="Text"></textarea>
<input id="blogImage" placeholder="Image URL">
<button onclick="addBlog()">Add Article</button>
<div id="blogs"></div>
</div>

<!-- BOOKINGS -->
<div class="box">
<h2>Bookings</h2>
<div id="bookings"></div>
<h3 id="income"></h3>
</div>

<!-- Firebase (compat فقط) -->
<script src="https://www.gstatic.com/firebasejs/9.22.2/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/9.22.2/firebase-firestore-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/9.22.2/firebase-auth-compat.js"></script>

<!-- JS بتاعك -->
<script src="script.js"></script>

</body>
</html>
