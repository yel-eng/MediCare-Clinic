<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>نظام العيادة المستقر</title>
<style>
:root {
  --main: #1a237e; --main-light: #3949ab; --bg: #f4f7f6; --white: #ffffff;
  --text: #333333; --text-light: #666666; --success: #2e7d32; --warning: #ff9800;
  --danger: #f44336; --whatsapp: #25d366;
  --shadow: 0 4px 16px rgba(0,0,0,0.06); --shadow-hover: 0 8px 24px rgba(0,0,0,0.1);
  --radius: 14px; --transition: 0.3s cubic-bezier(0.4, 0, 0.2, 1);
}
* { box-sizing: border-box; }
body { font-family: 'Segoe UI', Tahoma, Arial, sans-serif; background: var(--bg); margin: 0; padding: 20px; overflow-x:hidden; margin-right: 220px; color: var(--text); }
.side-nav { position: fixed; top: 0; right: 0; width: 220px; height: 100vh; background: linear-gradient(180deg, var(--main), var(--main-light)); padding: 25px 15px; display: flex; flex-direction: column; gap: 15px; z-index: 999; }
.side-nav .logo { color: #fff; text-align: center; margin-bottom: 20px; }
.side-nav a.active { background: var(--white); color: var(--main); font-weight: bold; }
.side-nav a.disabled { opacity: 0.5; pointer-events: none; }
.side-nav a { text-decoration: none; color: #fff; padding: 12px; border-radius: 10px; transition: var(--transition); font-size: 15px; }
.side-nav a:hover { background: rgba(255,255,255,0.15); transform: translateX(-5px); }
.admin-grid { display: grid; grid-template-columns: 350px 1fr; gap: 20px; }
.card { background: var(--white); padding: 20px; border-radius: var(--radius); box-shadow: var(--shadow); margin-bottom: 20px; }
.days-row { display: grid; grid-template-columns: repeat(auto-fill, minmax(290px, 1fr)); gap: 16px; padding: 10px 0; align-items: start; }

/* Day Card Premium */
.day-col { background: var(--white); border-radius: var(--radius); box-shadow: var(--shadow); overflow: hidden; transition: all var(--transition); display: flex; flex-direction: column; }
.day-col:hover { box-shadow: var(--shadow-hover); transform: translateY(-3px); }
.day-col.collapsed { box-shadow: none; transform: none; background: transparent; }

/* Header */
.day-head { background: linear-gradient(135deg, var(--main), var(--main-light)); color: white; padding: 14px 16px; display: flex; justify-content: space-between; align-items: center; font-weight: 600; font-size: 15px; position: relative; user-select: none; }
.head-actions { display: flex; gap: 8px; align-items: center; }
.head-btn { cursor: pointer; background: rgba(255,255,255,0.2); width: 28px; height: 28px; border-radius: 50%; display: flex; align-items: center; justify-content: center; transition: 0.2s; font-size: 14px; }
.head-btn:hover { background: rgba(255,255,255,0.35); transform: scale(1.05); }
.head-btn.del:hover { background: var(--danger); }
.head-btn.add:hover { background: #43a047; }

/* Body & Animation */
.day-body { padding: 14px; background: var(--white); transition: max-height 0.35s cubic-bezier(0.4,0,0.2,1), padding 0.3s ease, opacity 0.3s ease; max-height: 1500px; opacity: 1; }
.day-col.collapsed .day-body { max-height: 0; padding: 0 14px; opacity: 0; overflow: hidden; }

/* Money Badge */
.day-money { background: #fff8e1; color: var(--warning); padding: 10px; text-align: center; font-weight: 600; border-radius: 10px; margin-bottom: 14px; font-size: 14px; border: 1px solid #ffe082; }

/* Slots */
.slot-item { padding: 11px 12px; margin-bottom: 8px; background: #f8f9fa; border-radius: 10px; cursor: pointer; border-right: 4px solid transparent; transition: 0.2s; display: flex; justify-content: space-between; align-items: center; flex-wrap: wrap; }
.slot-item:hover { background: #e8eaf6; transform: translateX(-4px); }
.slot-item.booked { border-right-color: var(--success); background: #f1f8e9; }
.slot-item.cancel { border-right-color: var(--danger); background: #ffebee; opacity: 0.8; }
.slot-time { font-weight: 600; color: var(--main); font-size: 15px; }
.slot-name { flex: 1; margin: 0 8px; font-size: 14px; color: var(--text); min-width: 100px; }
.status-badge { font-size: 11px; padding: 3px 7px; border-radius: 6px; font-weight: 500; background: #e3f2fd; color: #1976d2; }
.status-booked { background: #e8f5e9; color: var(--success); }
.status-cancel { background: #ffebee; color: var(--danger); }

/* Action Buttons */
.action-buttons { display: flex; gap: 6px; flex-wrap: wrap; margin-top: 6px; width: 100%; justify-content: flex-end; }
.action-buttons button { background: var(--whatsapp); color: white; border: none; padding: 5px 9px; border-radius: 6px; font-size: 11px; cursor: pointer; transition: 0.2s; font-weight: 500; }
.action-buttons button:nth-child(2) { background: var(--warning); }
.action-buttons button:nth-child(3) { background: var(--danger); }
.action-buttons button:hover { filter: brightness(1.1); transform: scale(1.05); }

.total-box { background: #c8e6c9; padding: 10px; margin-bottom: 15px; text-align: center; font-weight: bold; border-radius: 10px; color: var(--success); border: 1px solid #a5d6a7; }
input, textarea, select { width: 100%; padding: 10px; margin: 8px 0; border: 1px solid #ccc; border-radius: 8px; box-sizing: border-box; }
.btn { background: var(--main); color: white; border: none; padding: 12px; width: 100%; border-radius: 8px; cursor: pointer; margin-top:5px; transition: 0.2s; }
.btn:hover { background: var(--main-light); }

/* Modal & Notif */
.modal-overlay { position:fixed; top:0; left:0; width:100%; height:100%; background:rgba(26,35,126,0.85); z-index:10000; display:flex; justify-content:center; align-items:center; cursor:pointer; }
.modal-content { background: var(--white); width:95%; max-width:450px; max-height:90vh; border-radius:16px; padding:20px 25px; overflow:auto; box-shadow:0 20px 60px rgba(0,0,0,0.3); position: relative; cursor: default; border-top: 4px solid var(--main); }
.modal-close { position: absolute; top: 12px; left: 12px; width: 32px; height: 32px; border-radius: 50%; background: var(--danger); color: #fff; border: none; font-size: 18px; cursor: pointer; display: flex; align-items: center; justify-content: center; transition: 0.2s; }
.modal-title { color: var(--main); text-align: center; margin: 0 0 15px; font-size: 18px; font-weight: 600; }
.modal-slot { padding: 12px; margin: 6px 0; background: var(--bg); border-radius: 8px; cursor: pointer; border: 2px solid transparent; transition: 0.2s; display: flex; justify-content: space-between; align-items: center; }
.modal-slot.selected { border-color: var(--main); background: #e8eaf6; }
.manual-section { background: #fff3e0; padding: 12px; border-radius: 10px; margin: 15px 0; border: 2px solid var(--warning); }
.modal-actions { display: flex; gap: 10px; margin-top: 20px; }
.modal-btn { flex: 1; padding: 12px; border: none; border-radius: 10px; cursor: pointer; font-weight: 600; font-size: 14px; transition: 0.2s; }
.modal-btn-primary { background: var(--main); color: #fff; }
.modal-btn-cancel { background: var(--danger); color: #fff; }
.admin-notif { position:fixed; top:20px; left:50%; transform:translateX(-50%); background:linear-gradient(135deg,var(--success),#43a047); color:#fff; padding:14px 24px; border-radius:12px; font-weight:500; box-shadow:0 10px 30px rgba(0,0,0,0.2); z-index:10001; animation:slideIn 0.3s ease, fadeOut 0.3s ease 4.7s forwards; }
@keyframes slideIn { from { transform:translateX(-50%) translateY(-30px); opacity:0; } to { transform:translateX(-50%) translateY(0); opacity:1; } }
@keyframes fadeOut { from { opacity:1; } to { opacity:0; } }
</style>
</head>
<body>

<div class="side-nav">
  <h2 class="logo">Admin</h2>
  <a href="admin.html" class="active">🏠 لوحة التحكم</a>
  <a href="index-admin.html">📂 إدارة المحتوى</a>
  <a href="#" class="disabled">🚧 قريباً</a>
  <button onclick="logout()" class="btn" style="margin-top:auto;">🚪 خروج</button>
</div>

<a href="admin.html" style="position:fixed;top:20px;left:20px;text-decoration:none;color:#fff;background:linear-gradient(135deg,var(--main),var(--main-light));padding:12px 18px;border-radius:10px;font-size:15px;z-index:9999;box-shadow:0 8px 20px rgba(0,0,0,0.2);">🏠 الرئيسية</a>

<div class="total-box" id="globalTotal">💰 إجمالي العيادة: 0</div>

<div class="admin-grid">
  <div class="side-panel">
    <div class="card">
      <h3>👤 بيانات الحجز</h3>
      <p id="targetTime">اختر ميعاداً</p>
      <input id="pName" placeholder="الاسم">
      <div id="historyBox" style="background:#e3f2fd;padding:8px;border-radius:8px;margin-top:5px;font-size:13px;display:none;"></div>
      <select id="availableSlots"><option value="">اختر ميعاد متاح</option></select>
      <input type="date" id="requestDate" onchange="loadAvailableSlots(this.value)">
      <input id="pPhone" placeholder="الهاتف">
      <textarea id="pNotes" placeholder="ملاحظات"></textarea>
      <input id="pPaid" type="number" placeholder="المبلغ">
      <select id="pStatus"><option value="حجز">حجز</option><option value="كشف">كشف</option><option value="ملغي">ملغي</option></select>
      <button class="btn" onclick="updateSlot()">حفظ</button>
      <button class="btn" style="background:#00897b" onclick="generateQR()">QR</button>
      <img id="qrImg" width="120" style="display:none;margin-top:10px;">
      <button class="btn" onclick="assignRequest()">تحديد ميعاد للطلب</button>
      <input id="search" placeholder="بحث..." onkeyup="safeLoad()">
      <select id="filter" onchange="safeLoad()"><option value="all">الكل</option><option value="booked">محجوز</option><option value="free">متاح</option></select>
    </div>
  </div>
  <div class="main-panel">
    <div class="card">
      <h3>📅 إضافة يوم</h3>
      <input type="date" id="slotDate">
      <input type="time" id="startTime" value="17:00">
      <input type="time" id="endTime" value="22:00">
      <label>مدة كل ميعاد (بالدقايق)</label>
      <input type="number" id="slotDuration" value="30">
      <button class="btn" onclick="createDaySlots()">توليد</button>
      <button class="btn" style="background:#6a1b9a;margin-top:10px;" onclick="diagnoseBookingCompatibility()">🔍 فحص التوافق</button>
    </div>
    <div id="daysGrid" class="days-row"></div>
  </div>
</div>

<script type="module">
import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-app.js";
import { getFirestore, collection, onSnapshot, doc, getDoc, updateDoc, addDoc, deleteDoc, query, where, getDocs, writeBatch, serverTimestamp, orderBy } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore.js";
import { getAuth, signOut } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-auth.js";

const firebaseConfig = { apiKey: "AIzaSyA8FEgNeXAMZ1Sbg12zFCzwwxUD3sVl99o", authDomain: "mydoctor-clinic.firebaseapp.com", projectId: "mydoctor-clinic", storageBucket: "mydoctor-clinic.firebasestorage.app", messagingSenderId: "996532645974", appId: "1:996532645974:web:bfc3e6a61bdc7f04a24bf7", measurementId: "G-33CQLHP3WP" };
const app = initializeApp(firebaseConfig); const db = getFirestore(app); const auth = getAuth(app); window.db = db;
const $ = (id) => document.getElementById(id); let cache = [], activeId = null, editSession = {}, collapsedDays = {};
const slotsRef = collection(db, "slots"); const requestsRef = collection(db, "requests");

window.logout = () => signOut(auth).then(() => location.href = "login.html");
onSnapshot(slotsRef, (snap) => { cache = []; snap.forEach(d => cache.push({ id: d.id, ...d.data() })); checkAndMigrateManualSlots(snap); renderSlots(); });

window.selectSlot = async (id) => { activeId = id; const snap = await getDoc(doc(db, "slots", id)); if (!snap.exists()) return; const d = snap.data(); $("pName").value = d.patient?.name || ""; $("pPhone").value = d.patient?.phone || ""; $("pNotes").value = d.patient?.notes || ""; $("pPaid").value = d.paid || 0; $("pStatus").value = d.status || "حجز"; $("targetTime").innerText = d.date + " - " + d.time; };
window.updateSlot = async () => { if (!activeId) return alert("اختاري ميعاد أولاً"); await updateDoc(doc(db, "slots", activeId), { booked: $("pName").value.trim() !== "", status: $("pStatus").value, paid: Number($("pPaid").value || 0), patient: { name: $("pName").value, phone: $("pPhone").value, notes: $("pNotes").value }, updatedAt: serverTimestamp() }); activeId = null; alert("تم التعديل ✔️"); };
window.createDaySlots = async () => { const date = $("slotDate").value, start = $("startTime").value, end = $("endTime").value; const duration = Number($("slotDuration").value); if (!date || !start || !end) return alert("اكمل البيانات"); let time = new Date(date + "T" + start), endTime = new Date(date + "T" + end), count = 0; while (time < endTime) { await addDoc(slotsRef, { date: String(date), time: time.toTimeString().slice(0,5), booked: false, status: "available", patient: null, paid: 0, notes: "", createdAt: serverTimestamp() }); time.setMinutes(time.getMinutes() + duration); count++; } alert("✅ تم إنشاء " + count + " ميعاد ليوم " + date); };
window.createRequest = async () => { const name = $("pName").value, phone = $("pPhone").value, date = $("requestDate").value; if (!name || !phone || !date) return alert("اكمل البيانات"); await addDoc(requestsRef, { name, phone, date, status: "pending", createdAt: serverTimestamp() }); alert("تم إرسال الطلب ✔️"); };
window.convertRequest = async (requestId, date, time) => { const reqRef = doc(db, "requests", requestId); const reqSnap = await getDoc(reqRef); if (!reqSnap.exists()) return; const req = reqSnap.data(); await addDoc(slotsRef, { date, time, booked: true, status: "booked", patient: { name: req.name, phone: req.phone }, createdAt: serverTimestamp() }); await updateDoc(reqRef, { status: "converted" }); alert("تم التحويل ✔️"); };
window.deleteDay = async (date) => { if (!confirm("حذف اليوم؟")) return; const q = query(slotsRef, where("date", "==", date)); const snap = await getDocs(q); const batch = writeBatch(db); snap.forEach(d => batch.delete(d.ref)); await batch.commit(); };
window.generateQR = () => { const qrImg = $("qrImg"); if (!activeId) return alert("⚠️ اختر ميعاداً أولاً"); const name = $("pName").value || "بدون اسم", phone = $("pPhone").value || ""; const timeInfo = $("targetTime").innerText; qrImg.src = "https://api.qrserver.com/v1/create-qr-code/?size=150x150&data=" + encodeURIComponent("عيادة ميديكال\nمريض: " + name + "\nتليفون: " + phone + "\nموعد: " + timeInfo); qrImg.style.display = "block"; };
window.assignRequest = async () => { if (!activeId) return alert("⚠️ اختر ميعاداً أولاً"); const phone = $("pPhone").value.trim(); if (!phone) return alert("⚠️ اكتب رقم الهاتف"); try { const q = query(collection(db, "requests"), where("phone", "==", phone), where("status", "==", "pending")); const snap = await getDocs(q); if (snap.empty) return alert("❌ لا يوجد طلب معلق بهذا الرقم"); const reqDoc = snap.docs[0], reqData = reqDoc.data(); await updateDoc(doc(db, "slots", activeId), { booked: true, status: "booked", patient: { name: reqData.name, phone: reqData.phone, notes: reqData.notes || "" }, paid: 0, updatedAt: serverTimestamp() }); await updateDoc(doc(db, "requests", reqDoc.id), { status: "assigned", slotId: activeId, assignedAt: serverTimestamp() }); alert("✅ تم ربط طلب " + reqData.name); activeId = null; $("pName").value = ""; $("pPhone").value = ""; } catch (err) { console.error(err); alert(err.message?.includes("index") ? "⚠️ يحتاج فهرس جديد" : "❌ خطأ: " + err.message); } };
window.safeLoad = () => { const searchTerm = $("search").value.toLowerCase(), filterValue = $("filter").value; const filtered = cache.filter(slot => { const matchSearch = !searchTerm || slot.patient?.name?.toLowerCase().includes(searchTerm) || slot.time.includes(searchTerm); let matchFilter = true; if (filterValue === "booked") matchFilter = slot.booked === true; else if (filterValue === "free") matchFilter = slot.booked === false; return matchSearch && matchFilter; }); const grid = $("daysGrid"); grid.innerHTML = ""; let days = {}; filtered.forEach(d => { if (!d.date) return; if (!days[d.date]) days[d.date] = []; days[d.date].push(d); }); Object.keys(days).sort().forEach(date => { const col = document.createElement("div"); col.className = "day-col"; col.innerHTML = "<div class='day-head'>" + date + "</div><div class='day-money'>💰 0 جنيه</div>" + days[date].map(x => "<div class='slot-item " + (x.booked?"booked":"") + "' onclick='selectSlot(\"" + x.id + "\")'><b>" + x.time + "</b> - " + (x.patient?.name||"متاح") + " (" + x.status + ")</div>").join(""); grid.appendChild(col); }); };
window.openWhatsApp = (phone) => { if (!phone) return alert("⚠️ لا يوجد رقم مسجل"); let wa = phone.replace(/^0+/,"").replace(/\s+/g,""); if (!wa.startsWith("20")) wa = "20" + wa; window.open("https://wa.me/" + wa + "?text=" + encodeURIComponent("مرحباً د/ حسني، بخصوص موعد المريض..."), "_blank"); };

// ✏️ تعديل الميعاد
window.startEditSlot = async (slotId) => { const slot = cache.find(s => s.id === slotId); if (!slot || !slot.booked) return alert("⚠️ اختر ميعاداً محجوزاً"); const patient = slot.patient; if (!patient?.name) return alert("⚠️ لا توجد بيانات مريض"); editSession = { originalSlotId: slotId, originalDate: slot.date, originalTime: slot.time, patient: {...patient}, paid: slot.paid||0, notes: slot.notes||"" }; showEditModal(slot); };

function showEditModal(originalSlot) {
  const old = document.getElementById("editModal"); if (old) old.remove();
  const modal = document.createElement("div"); modal.id = "editModal"; modal.className = "modal-overlay";
  modal.innerHTML = "<div class='modal-content'><button class='modal-close' title='إغلاق'>✕</button><h3 class='modal-title'>✏️ تعديل ميعاد: " + editSession.patient.name + "</h3><div style='background:var(--bg);padding:12px;border-radius:10px;margin-bottom:10px;font-size:14px'><b>الميعاد الحالي:</b><br>📅 " + originalSlot.date + " | 🕒 " + originalSlot.time + "</div><label style='display:block;margin-bottom:6px;font-weight:500'>تاريخ النقل:</label><input type='date' id='editDateInput' value='" + originalSlot.date + "' style='width:100%;padding:10px;margin-bottom:10px;border:2px solid #ddd;border-radius:8px'><div style='display:flex;gap:8px;margin:12px 0;background:#f8f9fa;padding:8px;border-radius:8px'><label style='flex:1;cursor:pointer;display:flex;align-items:center;gap:5px;font-size:14px'><input type='radio' name='editMode' value='schedule' checked onchange='window.toggleEditMode(\"schedule\")'> 📋 اختيار من الجدول</label><label style='flex:1;cursor:pointer;display:flex;align-items:center;gap:5px;font-size:14px'><input type='radio' name='editMode' value='manual' onchange='window.toggleEditMode(\"manual\")'> ⏰ إدخال وقت يدوي</label></div><div id='editSlotsContainer' style='min-height:100px;max-height:200px;overflow-y:auto;margin-bottom:10px;padding:5px;background:#fafafa;border-radius:8px'><p style='color:var(--text-light);text-align:center'>اختر تاريخاً لعرض المواعيد</p></div><div id='manualTimeSection' class='manual-section' style='display:none'><label>الوقت المطلوب (دقيق/ساعة):</label><input type='time' id='manualTimeInput' value='" + originalSlot.time + "' style='width:100%;padding:8px;margin-top:5px;border-radius:6px'><small style='color:var(--text-light)'>سيُحجز كميعاد مرن ويُرحّل تلقائياً لو تطلب الأمر</small></div><div class='modal-actions'><button class='modal-btn modal-btn-primary' onclick='saveEditSlot()'>💾 حفظ التعديل</button><button class='modal-btn modal-btn-cancel' onclick='closeEditModal()'>❌ إلغاء</button></div></div>";
  document.body.appendChild(modal);
  modal.onclick = function(e) { if (e.target === modal) closeEditModal(); };
  modal.querySelector(".modal-close").onclick = closeEditModal;
  document.getElementById("editDateInput").addEventListener("change", (e) => loadEditSlotsForDate(e.target.value));
  const onKey = function(e) { if (e.key === "Escape") { closeEditModal(); document.removeEventListener("keydown", onKey); } };
  document.addEventListener("keydown", onKey);
  window.toggleEditMode("schedule");
  loadEditSlotsForDate(originalSlot.date);
}

async function loadEditSlotsForDate(date) {
  const container = document.getElementById("editSlotsContainer"), manualSection = document.getElementById("manualTimeSection");
  if (!date) return;
  container.innerHTML = "<p style='text-align:center;color:var(--text-light)'>جاري التحميل...</p>";
  manualSection.style.display = "none";
  try {
    const daySlots = cache.filter(function(s) { return s.date === date; });
    const available = daySlots.filter(function(s) { return !s.booked && s.status !== "cancelled"; });
    if (available.length > 0) {
      available.sort(function(a,b) { return a.time.localeCompare(b.time); });
      container.innerHTML = "<p style='font-weight:500;margin-bottom:10px;color:var(--main)'>المواعيد المتاحة:</p>";
      available.forEach(function(slot) {
        const div = document.createElement("div"); div.className = "modal-slot";
        div.innerHTML = "<span>🕒 " + slot.time + "</span><span style='font-size:12px;color:var(--success)'>متاح</span>";
        div.onclick = function() { container.querySelectorAll(".modal-slot.selected").forEach(function(el) { el.classList.remove("selected"); }); div.classList.add("selected"); editSession.newSlotId = slot.id; editSession.isManual = false; };
        container.appendChild(div);
      });
    } else {
      container.innerHTML = "<p style='color:var(--warning);text-align:center'>لا توجد مواعيد مُضافة</p>";
      manualSection.style.display = "block"; editSession.isManual = true; editSession.newSlotId = null;
      const manualInput = document.getElementById("manualTimeInput");
      editSession.manualTime = manualInput ? manualInput.value : "17:00";
      if (manualInput) manualInput.onchange = function(e) { editSession.manualTime = e.target.value; };
    }
  } catch (err) { console.error(err); container.innerHTML = "<p style='color:var(--danger);text-align:center'>❌ فشل التحميل</p>"; }
}

window.toggleEditMode = function(mode) {
  const slotsBox = document.getElementById("editSlotsContainer");
  const manualBox = document.getElementById("manualTimeSection");
  if (!slotsBox || !manualBox) return;
  if (mode === "manual") { slotsBox.style.display = "none"; manualBox.style.display = "block"; editSession.isManual = true; editSession.newSlotId = null; }
  else { slotsBox.style.display = "block"; manualBox.style.display = "none"; editSession.isManual = false; slotsBox.querySelectorAll(".modal-slot.selected").forEach(el => el.classList.remove("selected")); }
};

window.saveEditSlot = async () => {
  if (!editSession.originalSlotId) return alert("⚠️ خطأ في الجلسة");
  const newDate = document.getElementById("editDateInput").value;
  if (!newDate) return alert("⚠️ اختر تاريخاً");
  const isManual = editSession.isManual || document.querySelector('input[name="editMode"][value="manual"]')?.checked;
  let targetSlotId = editSession.newSlotId;
  let targetTime = document.getElementById("manualTimeInput")?.value || editSession.manualTime;
  if (!isManual && !targetSlotId) return alert("⚠️ اختر ميعاداً متاحاً من القائمة");
  if (isManual && !targetTime) return alert("⚠️ حددي الوقت المطلوب");
  const newTimeDisplay = isManual ? targetTime : (cache.find(s => s.id === targetSlotId)?.time || "");
  const confirmMsg = "🔄 من: " + editSession.originalDate + " " + editSession.originalTime + "\n✅ إلى: " + newDate + " " + newTimeDisplay + "\n\nالمريض: " + editSession.patient.name;
  if (!confirm(confirmMsg)) return;
  try {
    await updateDoc(doc(db, "slots", editSession.originalSlotId), { booked: false, status: "available", patient: null, updatedAt: serverTimestamp() });
    if (isManual) {
      await addDoc(collection(db, "slots"), { date: newDate, time: targetTime, booked: true, status: "booked_manual", patient: editSession.patient, paid: editSession.paid, notes: editSession.notes, isManual: true, originalSlotId: editSession.originalSlotId, createdAt: serverTimestamp(), updatedAt: serverTimestamp() });
      alert("✅ تم التعديل (وقت يدوي)! سيُرحّل تلقائياً لو أُضيف جدول لاحقاً.");
    } else {
      await updateDoc(doc(db, "slots", targetSlotId), { booked: true, status: "booked", patient: editSession.patient, paid: editSession.paid, notes: editSession.notes, isManual: false, updatedAt: serverTimestamp() });
      alert("✅ تم التعديل بنجاح!");
    }
    closeEditModal();
  } catch (err) { alert("❌ خطأ: " + err.message); }
};

window.closeEditModal = () => { const modal = document.getElementById("editModal"); if (modal) modal.remove(); editSession = {}; };

window.cancelSlot = async (slotId) => { const slot = cache.find(s => s.id === slotId); if (!slot || !slot.booked) return alert("⚠️ اختر ميعاداً محجوزاً"); const patient = slot.patient; if (!confirm("⚠️ تأكيد الإلغاء:\n" + slot.date + " " + slot.time + "\n" + (patient?.name||"") + "\n" + (patient?.phone||"") + "\n\nمتأكد؟")) return; try { await updateDoc(doc(db, "slots", slotId), { booked: false, status: "cancelled", patient: null, paid: 0, cancelledAt: serverTimestamp() }); alert("✅ تم الإلغاء"); } catch (err) { alert("❌ خطأ: " + err.message); } };

// ✅ إضافة ميعاد يدوي سريع لرأس اليوم
window.addSlotToDate = async (date) => {
  const time = prompt("📅 أدخل وقت الميعاد الجديد ليوم " + date + "\n(الصيغة: ساعة:دقيقة مثل 14:30)");
  if (!time) return;
  if (!/^\d{2}:\d{2}$/.test(time)) return alert("⚠️ الصيغة غير صحيحة. استخدم HH:MM مثل 15:30");
  const exists = cache.some(s => s.date === date && s.time === time);
  if (exists) return alert("⚠️ هذا الوقت موجود بالفعل في هذا اليوم");
  try {
    await addDoc(slotsRef, { date, time, booked: false, status: "available", patient: null, paid: 0, notes: "تمت إضافته يدوياً", isManual: true, createdAt: serverTimestamp(), updatedAt: serverTimestamp() });
    showAdminNotification("✅ تم إضافة الميعاد " + time + " ليوم " + date);
  } catch (err) { alert("❌ فشل الإضافة: " + err.message); }
};

// ✅ RENDER & TOGGLE
window.renderSlots = function() {
  const grid = $("daysGrid"), totalBox = $("globalTotal");
  let days = {}, total = 0;
  cache.forEach(d => { if (!d.date) return; if (!days[d.date]) days[d.date] = []; days[d.date].push(d); });
  grid.innerHTML = "";
  grid.style.alignItems = "start";

  Object.keys(days).sort().forEach(date => {
    let dayTotal = 0;
    days[date].forEach(s => { if (s.status === "كشف") { dayTotal += Number(s.paid||0); total += Number(s.paid||0); } });
    const col = document.createElement("div");
    col.className = "day-col"; col.id = "day-" + date;
    if (collapsedDays[date]) col.classList.add("collapsed");

    const slotsHTML = days[date].sort((a,b)=>a.time.localeCompare(b.time)).map(x => {
      const isBooked = x.booked && x.status !== "cancelled";
      const pname = x.patient?.name || "بدون اسم", phone = x.patient?.phone || "";
      const statusLabel = x.status==="cancelled"?"❌ ملغي":(isBooked?"✅ محجوز":"⭕ متاح");
      const badgeClass = x.status==="cancelled"?"status-cancel":(isBooked?"status-booked":"status-available");
      const actions = isBooked ? "<div class='action-buttons'><button onclick='event.stopPropagation();openWhatsApp(\"" + phone + "\")'>💬 واتساب</button><button onclick='event.stopPropagation();startEditSlot(\"" + x.id + "\")'>✏️ تعديل</button><button onclick='event.stopPropagation();cancelSlot(\"" + x.id + "\")'>🗑️ إلغاء</button></div>" : "";
      return "<div class='slot-item " + (isBooked?'booked':(x.status==='cancelled'?'cancel':'')) + "' onclick='selectSlot(\"" + x.id + "\")'><span class='slot-time'>" + x.time + "</span><span class='slot-name'>" + pname + "</span><span class='status-badge " + badgeClass + "'>" + statusLabel + "</span>" + actions + "</div>";
    }).join("");

    col.innerHTML = "<div class='day-head'><span>📅 " + date + "</span><div class='head-actions'><span class='head-btn add' onclick='event.stopPropagation(); addSlotToDate(\"" + date + "\")' title='إضافة ميعاد يدوي'>+</span><span class='head-btn' onclick='event.stopPropagation(); toggleDay(\"" + date + "\")' title='طي/فرد'>" + (collapsedDays[date] ? "▲" : "▼") + "</span><span class='head-btn del' onclick='event.stopPropagation(); deleteDay(\"" + date + "\")' title='حذف اليوم'>✕</span></div></div><div class='day-body' id='body-" + date + "'><div class='day-money'>💰 " + dayTotal + " جنيه</div>" + slotsHTML + "</div>";
    grid.appendChild(col);
  });
  totalBox.innerText = "💰 إجمالي العيادة: " + total + " جنيه";
};

window.toggleDay = function(date) {
  const col = document.getElementById("day-" + date);
  if (collapsedDays[date]) { collapsedDays[date] = false; col.classList.remove("collapsed"); }
  else { collapsedDays[date] = true; col.classList.add("collapsed"); }
  renderSlots();
};

// Migration & Telegram & UI Init
async function checkAndMigrateManualSlots(snap) { const newSlotsByDate = {}; snap.docChanges().forEach(change => { if (change.type === "added") { const data = change.doc.data(); if (data.date && !data.isManual) { if (!newSlotsByDate[data.date]) newSlotsByDate[data.date] = []; newSlotsByDate[data.date].push({ id: change.doc.id, ...data }); } } }); for (const [date, slots] of Object.entries(newSlotsByDate)) { const manualSlots = cache.filter(s => s.date === date && s.isManual === true && s.booked === true); if (manualSlots.length > 0) { for (const manual of manualSlots) await migrateManualSlot(manual, slots); showAdminNotification("🔄 تم ترحيل " + manualSlots.length + " ميعاد مرن ليوم " + date); } } }
async function migrateManualSlot(manualSlot, availableSlots) { const manualTime = manualSlot.time; const sorted = [...availableSlots].filter(s => !s.booked).sort((a,b) => Math.abs(timeToMinutes(a.time) - timeToMinutes(manualTime)) - Math.abs(timeToMinutes(b.time) - timeToMinutes(manualTime))); if (sorted.length === 0) return; const targetSlot = sorted[0]; try { await updateDoc(doc(db, "slots", manualSlot.id), { booked: false, status: "migrated", patient: null, migratedTo: targetSlot.id, updatedAt: serverTimestamp() }); await updateDoc(doc(db, "slots", targetSlot.id), { booked: true, status: "booked", patient: manualSlot.patient, paid: manualSlot.paid, notes: manualSlot.notes, migratedFrom: manualSlot.id, updatedAt: serverTimestamp() }); } catch (err) { console.error("Migration Error:", err); } }
function timeToMinutes(timeStr) { const [h, m] = timeStr.split(":").map(Number); return h * 60 + m; }
function showAdminNotification(message) { const notif = document.createElement("div"); notif.className = "admin-notif"; notif.innerHTML = "🔔 " + message; document.body.appendChild(notif); setTimeout(() => notif.remove(), 5000); }

// Dropdown Booking
window.loadAvailableSlots = function(date) {
  const select = $("availableSlots"); if (!select || !date) return;
  select.innerHTML = "<option value=''>⏳ جاري التحميل...</option>"; select.disabled = true;
  const oldManual = document.getElementById("manualTimeWrapper"); if (oldManual) oldManual.remove();
  const daySlots = cache.filter(function(s) { return s.date === date; });
  const available = daySlots.filter(function(s) { return !s.booked && s.status !== "cancelled"; });
  if (available.length > 0) {
    available.sort(function(a,b) { return a.time.localeCompare(b.time); });
    select.innerHTML = "<option value=''>-- اختر ميعاد متاح --</option>";
    available.forEach(function(slot) { const opt = document.createElement("option"); opt.value = slot.id; opt.textContent = "🕒 " + slot.time + " - متاح"; select.appendChild(opt); });
    select.disabled = false;
  } else {
    select.innerHTML = "<option value='__MANUAL__' selected>⏰ أدخل وقت يدوي</option>"; select.disabled = false;
    const manualWrapper = document.createElement("div"); manualWrapper.id = "manualTimeWrapper"; manualWrapper.className = "manual-section";
    manualWrapper.innerHTML = "<p style='margin:0 0 10px;font-weight:600;color:#e65100;font-size:14px'>⚠️ لا توجد مواعيد مُضافة لهذا اليوم</p><label style='display:block;margin-bottom:6px;font-weight:500;font-size:13px'>🕐 حدد الوقت المطلوب:</label><input type='time' id='manualTimeInput' value='17:00' style='width:100%;padding:10px;border:2px solid #ddd;border-radius:8px;font-size:15px'><p style='margin:8px 0 0;font-size:12px;color:var(--text-light)'>💡 سيتم حجز هذا الوقت كـ ميعاد مرن، وسيُرحّل تلقائياً لأقرب ميعاد متاح لو تم إنشاء جدول لهذا اليوم لاحقاً</p>";
    select.parentNode.insertBefore(manualWrapper, select.nextSibling);
  }
};
function ensureUseSlotButton() { if (document.getElementById("useSlotBtn")) return; const select = $("availableSlots"); if (!select) return; const btn = document.createElement("button"); btn.id = "useSlotBtn"; btn.textContent = "✅ استخدام هذا الميعاد"; btn.className = "btn"; btn.style.cssText = "background:linear-gradient(135deg,var(--success),#43a047);margin-top:12px;font-weight:600"; btn.onclick = function() { useSelectedSlot(); }; const manualWrapper = document.getElementById("manualTimeWrapper"); if (manualWrapper) { manualWrapper.parentNode.insertBefore(btn, manualWrapper.nextSibling); } else { select.parentNode.insertBefore(btn, select.nextSibling); } }
window.useSelectedSlot = function() {
  const select = $("availableSlots"), slotId = select?.value, date = $("requestDate")?.value;
  if (!slotId || !date) return alert("⚠️ اختاري تاريخاً وميعاداً أولاً");
  const name = $("pName").value.trim(), phone = $("pPhone").value.trim(), notes = $("pNotes").value, paid = Number($("pPaid").value || 0), status = $("pStatus").value;
  if (!name || !phone) return alert("⚠️ اكملِ البيانات: الاسم والهاتف مطلوبان");
  if (slotId === "__MANUAL__") {
    const manualTime = document.getElementById("manualTimeInput")?.value; if (!manualTime) return alert("⚠️ حددي الوقت المطلوب");
    addDoc(collection(db, "slots"), { date: date, time: manualTime, booked: true, status: "booked_manual", patient: { name: name, phone: phone, notes: notes }, paid: paid, isManual: true, bookedBy: auth.currentUser?.uid || "admin", createdAt: serverTimestamp(), updatedAt: serverTimestamp() }).then(function() { alert("✅ تم الحجز في ميعاد مرن:\n📅 " + date + " | 🕒 " + manualTime + "\n\nسيُرحّل تلقائياً لو أُضيف جدول لهذا اليوم"); resetBookingForm(); }).catch(function(err) { console.error("❌ Manual Booking Error:", err); alert("❌ حدث خطأ أثناء الحجز: " + err.message); });
  } else {
    const slot = cache.find(function(s) { return s.id === slotId; }); if (!slot) return alert("❌ الميعاد غير موجود، حاولي مرة أخرى");
    updateDoc(doc(db, "slots", slotId), { booked: true, status: status, patient: { name: name, phone: phone, notes: notes }, paid: paid, isManual: false, bookedBy: auth.currentUser?.uid || "admin", updatedAt: serverTimestamp() }).then(function() { alert("✅ تم الحجز بنجاح:\n📅 " + date + " | 🕒 " + slot.time); resetBookingForm(); }).catch(function(err) { console.error("❌ Slot Booking Error:", err); alert("❌ حدث خطأ أثناء الحجز: " + err.message); });
  }
};
function resetBookingForm() { $("pName").value = ""; $("pPhone").value = ""; $("pNotes").value = ""; $("pPaid").value = ""; const select = $("availableSlots"); select.innerHTML = "<option value=''>اختر ميعاد متاح</option>"; const manualWrapper = document.getElementById("manualTimeWrapper"); if (manualWrapper) manualWrapper.remove(); const useBtn = document.getElementById("useSlotBtn"); if (useBtn) useBtn.remove(); renderSlots(); }
document.addEventListener("DOMContentLoaded", function() { ensureUseSlotButton(); });
const originalDateChange = $("requestDate")?.onchange; $("requestDate")?.addEventListener("change", function(e) { if (originalDateChange) originalDateChange(e); setTimeout(function() { ensureUseSlotButton(); }, 150); });

// Telegram Scheduler
const TG_CONFIG = { botToken: "ضعي_التوكن_هنا", chatId: "ضعي_الـChat_ID_هنا", sendHour: 10 };
async function sendToTelegram(text) { return fetch("https://api.telegram.org/bot" + TG_CONFIG.botToken + "/sendMessage", { method: "POST", headers: { "Content-Type": "application/json" }, body: JSON.stringify({ chat_id: TG_CONFIG.chatId, text, parse_mode: "Markdown" }) }); }
async function autoCheckAndSendSchedule() { const now = new Date(); const today = now.toISOString().split("T")[0]; const lastSent = localStorage.getItem("tg_schedule_sent_date"); if (now.getHours() >= TG_CONFIG.sendHour && lastSent !== today) { const tomorrow = new Date(now); tomorrow.setDate(tomorrow.getDate() + 1); const tomorrowStr = tomorrow.toISOString().split("T")[0]; const booked = cache.filter(s => s.date === tomorrowStr && s.booked && s.status !== "cancelled").sort((a, b) => a.time.localeCompare(b.time)); if (booked.length === 0) return; let msg = "📋 *جدول مواعيد يوم " + tomorrowStr + "*\n\n"; let total = 0; booked.forEach((s, i) => { msg += (i+1) + ". 🕒 " + s.time + " - " + (s.patient?.name || "بدون اسم") + "\n"; if (s.status === "كشف") total += Number(s.paid || 0); }); msg += "\n💰 إجمالي الكشف المتوقع: " + total + " جنيه"; try { await sendToTelegram(msg); localStorage.setItem("tg_schedule_sent_date", today); showAdminNotification("📤 تم إرسال جدول الغد للدكتور عبر تيليجرام"); } catch (err) { console.error("❌ خطأ تيليجرام:", err); } } }
autoCheckAndSendSchedule();
window.diagnoseBookingCompatibility = async () => { try { const q = query(slotsRef, orderBy("createdAt", "desc")); const snap = await getDocs(q); const docs = snap.docs; if (docs.length === 0) return alert("⚠️ مفيش مواعيد"); const slot = docs[0].data(); const checks = { "date string": typeof slot.date==="string", "time string": typeof slot.time==="string", "booked boolean": typeof slot.booked==="boolean", "date format": /^\d{4}-\d{2}-\d{2}$/.test(slot.date), "time format": /^\d{2}:\d{2}$/.test(slot.time) }; console.table(checks); alert(Object.values(checks).every(v=>v) ? "✅ متوافق مع booking.html" : "⚠️ فيه مشكلة - راجع الكونسول"); } catch (err) { alert(err.message?.includes("index") ? "⚠️ محتاج إنديكس" : "❌ خطأ: " + err.message); } };
console.log("✅ Admin Loaded - Premium UI + Add Slot + Auto Schedule");
</script>
