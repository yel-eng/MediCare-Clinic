<!DOCTYPE html>
<html lang="ar">
<head>
<meta charset="UTF-8">
<title>Admin Dashboard</title>

<style>
body{
  font-family:Arial;
  background:#f5f5f5;
  padding:20px;
  direction:rtl;
}
.card{
  background:#fff;
  padding:15px;
  margin:10px 0;
  border-radius:10px;
}
input{
  width:100%;
  padding:10px;
  margin:5px 0;
}
button{
  padding:8px 12px;
  margin:5px 0;
  background:#0d47a1;
  color:white;
  border:none;
}
</style>

</head>
<body>

<h1>🏥 Admin Dashboard</h1>

<h2>إنشاء المواعيد</h2>

<input type="date" id="slotDate">
<input type="time" id="startTime">
<input type="time" id="endTime">
<input type="number" id="duration" placeholder="مدة الجلسة بالدقائق">

<button onclick="generateSlots()">إنشاء المواعيد</button>

<div id="slots"></div>

<!-- Firebase -->
<script src="https://www.gstatic.com/firebasejs/9.22.2/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/9.22.2/firebase-firestore-compat.js"></script>

<!-- Script -->
<script src="script.js"></script>

</body>
</html>
