<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>نظام إدارة العيادة المتكامل</title>
    <link rel="stylesheet" href="style.css">
    <style>
        :root { --main: #1a237e; --accent: #00bcd4; --bg: #f0f2f5; }
        body { background: var(--bg); font-family: 'Segoe UI', sans-serif; margin: 0; }
        .dashboard { display: grid; grid-template-columns: 300px 1fr; min-height: 100vh; }
        .sidebar { background: white; padding: 20px; border-left: 2px solid #ddd; }
        .content { padding: 25px; overflow-y: auto; }
        .card { background: white; padding: 20px; border-radius: 15px; box-shadow: 0 4px 15px rgba(0,0,0,0.1); margin-bottom: 20px; }
        
        /* جدول الأيام السبعة */
        .week-config { display: grid; grid-template-columns: repeat(auto-fill, minmax(150px, 1fr)); gap: 10px; margin-top: 15px; }
        .day-box { border: 1px solid #ddd; padding: 10px; border-radius: 10px; text-align: center; background: #fafafa; }
        .day-box.active { border-color: var(--main); background: #e8eaf6; }

        /* الجدول التشغيلي */
        .slots-grid { display: flex; overflow-x: auto; gap: 20px; padding-bottom: 20px; }
        .day-column { min-width: 320px; background: white; border-radius: 12px; border: 1px solid #e0e0e0; }
        .day-header { background: var(--main); color: white; padding: 15px; border-radius: 12px 12px 0 0; position: sticky; top: 0; }
        .slot-item { border-bottom: 1px solid #eee; padding: 12px; display: flex; justify-content: space-between; align-items: center; }
        .slot-item.booked { border-right: 5px solid var(--accent); background: #f1f8e9; }

        .btn { padding: 10px 15px; border: none; border-radius: 8px; cursor: pointer; font-weight: bold; transition: 0.3s; }
        .btn-main { background: var(--main); color: white; }
        .btn-outline { border: 1px solid var(--main); color: var(--main); background: none; }
        
        #qrcode-container { text-align: center; margin-top: 15px; padding: 10px; background: #eee; border-radius: 10px; }
        canvas { max-width: 100%; height: auto; }
    </style>
</head>
<body>

<div class="dashboard">
    <!-- الجانب الأيمن: أدوات الإدارة -->
    <div class="sidebar">
        <h2 style="color: var(--main);">Clinic Admin</h2>
        <hr>
        <h3>🛠️ أدوات التحكم</h3>
        <button class="btn btn-main" style="width: 100%; margin-bottom: 10px;" onclick="generateSmartSlots()">توليد مواعيد الأسبوع 🚀</button>
        
        <div class="card">
            <h4>📍 تحديد البداية</h4>
            <input type="date" id="startDatePicker" onchange="refreshWeekUI()">
            <small>تلقائياً يبدأ من اليوم</small>
        </div>

        <div class="card">
            <h4>📝 إضافة يدوية / تعديل</h4>
            <input type="text" id="mName" placeholder="اسم المريض">
            <input type="time" id="mTime">
            <input type="date" id="mDate">
            <button class="btn btn-outline" style="width: 100%;" onclick="addManualSlot()">إضافة مريض للجدول</button>
        </div>

        <div class="card">
            <h4>🎥 المحتوى</h4>
            <input id="vUrl" placeholder="رابط فيديو">
            <button class="btn btn-outline" onclick="addVideo()" style="width: 100%;">نشر فيديو</button>
        </div>
    </div>

    <!-- الجانب الأيسر: عرض البيانات -->
    <div class="content">
        <div class="card">
            <h3>📅 إعدادات مواعيد الأسبوع (اختر ساعات العمل)</h3>
            <div id="weekSetupGrid" class="week-config"></div>
        </div>

        <div id="slotsContainer" class="slots-grid">
            <!-- سيتم تحميل الأعمدة هنا -->
        </div>
    </div>
</div>

<!-- Modal التعديل المتطور -->
<div id="editModal" style="display:none; position:fixed; top:50%; left:50%; transform:translate(-50%,-50%); background:white; padding:30px; z-index:1000; border-radius:20px; width:500px; box-shadow:0 0 100px rgba(0,0,0,0.5);">
    <div id="modalBody"></div>
    <div id="qrcode-container">
        <p>QR الحجز:</p>
        <div id="qrcode"></div>
    </div>
    <button class="btn btn-main" style="width:100%; margin-top:15px;" onclick="closeEditModal()">إغلاق</button>
</div>
<div id="overlay" style="display:none; position:fixed; top:0; left:0; width:100%; height:100%; background:rgba(0,0,0,0.7); z-index:999;" onclick="closeEditModal()"></div>

<script src="https://www.gstatic.com/firebasejs/9.22.2/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/9.22.2/firebase-firestore-compat.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js"></script>
<script src="script.js"></script>
</body>
</html>
