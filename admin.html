.admin-grid { 
            display: grid;

            gap: 20px;
            }

.card {

       }

           display: grid; 
           grid-template-columns: 
           repeat(auto-fill,

.day-money {

.total-box{
background:#c8e6c9;
padding:10px;

}

.booked { border-right: 5px solid #2e7d32; }
  
.cancel { border-right: 5px solid red; }

.del-btn { 
         position:absolute; 
         left:10px; 
         top:10px;

         color:red;
          }

input, textarea, select {
         width: 100%; 
         padding: 10px; 
         margin: 8px 0; 
         border: 1px solid #ccc; 
         border-radius: 8px; 
}

.btn { background: var(--main); 
       color: white;
       border: none; 
       padding: 12px;
       width: 100%; 
       border-radius: 8px;
       cursor: pointer; 
     }

.whatsapp { background:#25d366;
            color:white; 
             padding:6px 10px; 
             border-radius:6px; 
             display:inline-block; 
             margin-top:5px;
             text-decoration:none;}

.now-slot{
          background:#fff9c4 !important;
          border-right:5px solid #fbc02d !important;
}

.patient-history{
          background:#e3f2fd;
          padding:8px;
          border-radius:8px;
          margin-top:5px;
          font-size:13px;
          display:none;
          }

.pending-slot{
            background:#ffe0b2 !important;
            border-right:5px solid #ff9800 !important;
}


</style>
</head>
        
<body>

</div>
 <button onclick="logout()" style="
  margin-top:auto;

  color:#fff;
  border:none;
  padding:12px;
  border-radius:10px;
  cursor:pointer;
   margin-top:auto;
">
  🚪 تسجيل خروج
</button>
  
  <a href="https://yel-eng.github.io/MediCare-Clinic/admin.html"
   style="
     position: fixed;

   ">

</div>
<div class="total-box" id="globalTotal">💰 إجمالي العيادة: 0</div>

<div class="admin-grid">

<div class="side-panel">

<div class="card">
<h3>👤 بيانات الحجز</h3>

<p id="targetTime">اختر ميعاداً</p>

<input id="pName" placeholder="الاسم">
<div id="historyBox" class="patient-history"></div>
        <select id="availableSlots">
<option value="">اختر ميعاد متاح</option>
</select
  <input type="date" id="requestDate"
onchange="loadAvailableSlots(this.value)">
<input id="pPhone" placeholder="الهاتف">
<textarea id="pNotes" placeholder="ملاحظات"></textarea>

<option value="حجز">حجز</option>

<div class="main-panel">

<div class="card">
<h3>📅 إضافة يوم</h3>

<input type="date" id="slotDate">
<input type="time" id="startTime" value="17:00">
<input type="time" id="endTime" value="22:00">
<label>مدة كل ميعاد (بالدقايق)</label>
<input type="number" id="slotDuration" value="30">

        
<button class="btn" onclick="createDaySlots()">توليد</button>
</div>

<div id="daysGrid" class="days-row"></div>

</div>

</div>


    
<script type="module">
import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-app.js";
import {
  getFirestore,
  collection,
  onSnapshot,
  doc,
  getDoc,
  updateDoc,
  addDoc,
  deleteDoc,
  query,
  where,
  getDocs,
  writeBatch,
  serverTimestamp
} from "https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore.js";

import { getAuth, signOut } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-auth.js";

/* ================= FIREBASE ================= */
const firebaseConfig = {
  apiKey: "AIzaSyA8FEgNeXAMZ1Sbg12zFCzwwxUD3sVl99o",
  authDomain: "mydoctor-clinic.firebaseapp.com",
  projectId: "mydoctor-clinic",
  storageBucket: "mydoctor-clinic.firebasestorage.app",
  messagingSenderId: "996532645974",
  appId: "1:996532645974:web:bfc3e6a61bdc7f04a24bf7",
  measurementId: "G-33CQLHP3WP"
};

const app = initializeApp(firebaseConfig);
const db = getFirestore(app);
const auth = getAuth(app);

window.db = db;

/* ================= STATE ================= */
const $ = (id) => document.getElementById(id);

let cache = [];
let activeId = null;

const slotsRef = collection(db, "slots");
const requestsRef = collection(db, "requests");

/* ================= LOGOUT ================= */
window.logout = () => {
  signOut(auth).then(() => location.href = "login.html");
};

/* ================= REALTIME ================= */
onSnapshot(slotsRef, (snap) => {

  cache = [];

  snap.forEach(d => {
    cache.push({
      id: d.id,
      ...d.data()
    });
  });

  renderSlots();
});

/* ================= SELECT SLOT ================= */
window.selectSlot = async (id) => {

  activeId = id;

  const snap = await getDoc(doc(db, "slots", id));
  if (!snap.exists()) return;

  const d = snap.data();

  $("pName").value = d.patient?.name || "";
  $("pPhone").value = d.patient?.phone || "";
  $("pNotes").value = d.patient?.notes || "";
  $("pPaid").value = d.paid || 0;
  $("pStatus").value = d.status || "حجز";

  $("targetTime").innerText = `${d.date} - ${d.time}`;
};

/* ================= UPDATE SLOT ================= */
window.updateSlot = async () => {

  if (!activeId) return alert("اختاري ميعاد أولاً");

  await updateDoc(doc(db, "slots", activeId), {
    booked: $("pName").value.trim() !== "",
    status: $("pStatus").value,
    paid: Number($("pPaid").value || 0),
    patient: {
      name: $("pName").value,
      phone: $("pPhone").value,
      notes: $("pNotes").value
    },
    updatedAt: serverTimestamp()
  });

  activeId = null;
  alert("تم التعديل ✔️");
};

/* ================= CREATE DAY SLOTS ================= */
window.createDaySlots = async () => {

  const date = $("slotDate").value;
  const start = $("startTime").value;
  const end = $("endTime").value;
  const duration = Number($("slotDuration").value);

  if (!date || !start || !end) {
    alert("اكمل البيانات");
    return;
  }

  let time = new Date(`${date}T${start}`);
  const endTime = new Date(`${date}T${end}`);

  while (time < endTime) {

    await addDoc(slotsRef, {
      date,
      time: time.toTimeString().slice(0,5),
      booked: false,
      status: "available",
      patient: null,
      createdAt: serverTimestamp()
    });

    time.setMinutes(time.getMinutes() + duration);
  }

  alert("تم إنشاء اليوم ✔️");
};

/* ================= CREATE REQUEST ================= */
window.createRequest = async () => {

  const name = $("pName").value;
  const phone = $("pPhone").value;
  const date = $("requestDate").value;

  if (!name || !phone || !date) {
    alert("اكمل البيانات");
    return;
  }

  await addDoc(requestsRef, {
    name,
    phone,
    date,
    status: "pending",
    createdAt: serverTimestamp()
  });

  alert("تم إرسال الطلب ✔️");
};

/* ================= CONVERT REQUEST ================= */
window.convertRequest = async (requestId, date, time) => {

  const reqRef = doc(db, "requests", requestId);
  const reqSnap = await getDoc(reqRef);

  if (!reqSnap.exists()) return;

  const req = reqSnap.data();

  await addDoc(slotsRef, {
    date,
    time,
    booked: true,
    status: "booked",
    patient: {
      name: req.name,
      phone: req.phone
    },
    createdAt: serverTimestamp()
  });

  await updateDoc(reqRef, {
    status: "converted"
  });

  alert("تم التحويل ✔️");
};

/* ================= DELETE DAY ================= */
window.deleteDay = async (date) => {

  if (!confirm("حذف اليوم؟")) return;

  const q = query(slotsRef, where("date", "==", date));
  const snap = await getDocs(q);

  const batch = writeBatch(db);

  snap.forEach(d => batch.delete(d.ref));

  await batch.commit();
};

/* ================= RENDER ================= */
function renderSlots() {

  const grid = $("daysGrid");
  const totalBox = $("globalTotal");

  let days = {};
  let total = 0;

  cache.forEach(d => {

    if (!d.date) return;

    if (!days[d.date]) days[d.date] = [];
    days[d.date].push(d);
  });

  grid.innerHTML = "";

  Object.keys(days).sort().forEach(date => {

    let dayTotal = 0;

    days[date].forEach(s => {
      if (s.status === "كشف") {
        dayTotal += Number(s.paid || 0);
        total += Number(s.paid || 0);
      }
    });

    const col = document.createElement("div");
    col.className = "day-col";

    col.innerHTML = `
      <div class="day-head">
        ${date}
        <span class="del-btn" onclick="deleteDay('${date}')">×</span>
      </div>

      <div class="day-money">💰 ${dayTotal} جنيه</div>

      ${days[date]
        .sort((a,b)=>a.time.localeCompare(b.time))
        .map(x => `
          <div class="slot-item ${x.booked ? "booked" : ""}"
            onclick="selectSlot('${x.id}')">

            <b>${x.time}</b> - ${x.patient?.name || "بدون اسم"} (${x.status})
          </div>
        `).join("")}
    `;

    grid.appendChild(col);
  });

  totalBox.innerText = "💰 إجمالي العيادة: " + total + " جنيه";
}
/* =======================================================
   🔧 FIX: ضمان توافق بيانات المواعيد مع صفحة الحجز
   (ضع هذا الكود في نهاية السكربت في admin.html فقط)
   ======================================================= */

// 1. استبدال دالة createDaySlots بنسخة تضمن التوافق 100%
window.createDaySlots = async () => {
  const dateInput = $("slotDate").value;
  const start = $("startTime").value;
  const end = $("endTime").value;
  const duration = Number($("slotDuration").value);

  if (!dateInput || !start || !end) {
    alert("⚠️ أكمل جميع البيانات");
    return;
  }

  // ✅ ضمان أن التاريخ بصيغة YYYY-MM-DD (نص)
  const date = dateInput; // كما هو من input type="date"

  let currentTime = new Date(`${date}T${start}`);
  const endTime = new Date(`${date}T${end}`);
  let createdCount = 0;

  while (currentTime < endTime) {
    // ✅ ضمان أن الوقت بصيغة HH:MM (نص)
    const timeString = currentTime.toTimeString().slice(0, 5);

    // ✅ إنشاء كائن الميعاد بالضبط كما تتوقعه booking.html
    const slotData = {
      date: String(date),           // نص: "2024-06-01"
      time: String(timeString),     // نص: "17:00"
      booked: false,                // بوليان: ليس نص!
      status: "available",          // نص
      patient: null,                // null صريح
      paid: 0,                      // رقم افتراضي
      notes: "",                    // نص فارغ
      createdAt: serverTimestamp()  // طابع زمني
    };

    try {
      await addDoc(slotsRef, slotData);
      createdCount++;
      console.log("✅ Slot created:", slotData);
    } catch (err) {
      console.error("❌ Failed to create slot:", err);
    }

    currentTime.setMinutes(currentTime.getMinutes() + duration);
  }

  alert(`✅ تم إنشاء ${createdCount} ميعاد ليوم ${date} بنجاح`);
  console.log(`📊 Total slots created: ${createdCount}`);
};

// 2. دالة تشخيص: اختبر إن صفحة الحجز هتشوف المواعيد دي
window.diagnoseBookingCompatibility = async () => {
  console.log("🔍 Running booking.html compatibility check...");
  
  try {
    // نجرب نجيب آخر ميعاد اتخلق
    const q = query(slotsRef, orderBy("createdAt", "desc"), limit(1));
    const snap = await getDocs(q);
    
    if (snap.empty) {
      console.warn("⚠️ No slots found in Firestore");
      alert("⚠️ مفيش مواعيد في قاعدة البيانات أصلاً");
      return;
    }
    
    const lastSlot = snap.docs[0].data();
    console.log("📋 Last slot structure:", lastSlot);
    
    // نتأكد من الحقول الأساسية
    const checks = {
      "date is string": typeof lastSlot.date === "string",
      "time is string": typeof lastSlot.time === "string", 
      "booked is boolean": typeof lastSlot.booked === "boolean",
      "date format YYYY-MM-DD": /^\d{4}-\d{2}-\d{2}$/.test(lastSlot.date),
      "time format HH:MM": /^\d{2}:\d{2}$/.test(lastSlot.time)
    };
    
    console.table(checks);
    
    const allPassed = Object.values(checks).every(v => v === true);
    
    if (allPassed) {
      console.log("✅ All checks passed! booking.html should see these slots.");
      alert("✅ جميع المواعيد مُنشأة بشكل صحيح متوافق مع صفحة الحجز");
    } else {
      console.error("❌ Some checks failed:", checks);
      alert("⚠️ يوجد مشكلة في فورمات البيانات. راجع الكونسول للتفاصيل.");
    }
    
  } catch (err) {
    console.error("❌ Diagnosis failed:", err);
    
    // لو الخطأ متعلق بإنديكس
    if (err.message?.includes("index")) {
      alert("⚠️ فايربيس محتاج Composite Index.\n" + 
            "افتح الكونسول (F12) وانسخ الرابط الأحمر لإنشائه.");
    } else {
      alert("❌ خطأ في قراءة البيانات: " + err.message);
    }
  }
};

// 3. إضافة زر تشخيص في الواجهة (يظهر فقط للأدمن)
document.addEventListener("DOMContentLoaded", () => {
  const diagBtn = document.createElement("button");
  diagBtn.textContent = "🔍 فحص توافق المواعيد";
  diagBtn.className = "btn";
  diagBtn.style.background = "#6a1b9a";
  diagBtn.style.marginTop = "10px";
  diagBtn.onclick = () => window.diagnoseBookingCompatibility();
  
  // نضيفه بجانب زر "توليد"
  const generateBtn = document.querySelector('button[onclick="createDaySlots()"]');
  if (generateBtn?.parentElement) {
    generateBtn.parentElement.appendChild(diagBtn);
  }
});

console.log("🔧 Admin compatibility patch loaded");
</script>
</body>
