<div class="box">
    <h2>📅 إعداد جدول المواعيد الذكي</h2>
    <input type="date" id="slotDate">
    <div style="display:flex; gap:10px;">
        <input type="time" id="startTime" title="بداية العمل">
        <input type="time" id="endTime" title="نهاية العمل">
    </div>
    <input type="number" id="duration" placeholder="مدة الجلسة (بالدقائق) مثلاً 30">
    <button onclick="generateSmartSlots()">توليد مواعيد الأسبوع</button>
</div>

<div class="box">
    <h2>👥 إدارة المرضى والملفات الطبية</h2>
    <div id="patientsList" class="grid"></div>
</div>

<!-- Modal بسيط لعرض بيانات المريض وتعديلها -->
<div id="patientModal" style="display:none; position:fixed; top:10%; left:10%; right:10%; background:white; padding:20px; z-index:2000; border-radius:15px; box-shadow:0 0 20px rgba(0,0,0,0.5);">
    <div id="modalContent"></div>
    <button onclick="closeModal()" style="background:red;">إغلاق</button>
</div>

<!-- مكتبة الـ QR Code -->
<script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js"></script>
