<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <title>لوحة تحكم العيادة الاحترافية</title>
    <style>
        :root { --primary: #1a237e; --secondary: #00bcd4; --bg: #f8f9fa; --success: #2e7d32; }
        body { font-family: 'Segoe UI', sans-serif; background: var(--bg); margin: 0; padding: 20px; }
        .grid-container { display: grid; grid-template-columns: 400px 1fr; gap: 20px; }
        .card { background: white; padding: 20px; border-radius: 15px; box-shadow: 0 4px 10px rgba(0,0,0,0.1); margin-bottom: 20px; }
        
        /* الحصالة */
        .safe-box { background: linear-gradient(135deg, var(--primary), var(--secondary)); color: white; padding: 15px; border-radius: 12px; text-align: center; }
        .safe-box h2 { margin: 5px 0; font-size: 28px; }

        /* الفورم */
        label { display: block; margin-top: 10px; font-weight: bold; }
        input, textarea, select { width: 100%; padding: 10px; margin-top: 5px; border: 1px solid #ddd; border-radius: 8px; box-sizing: border-box; }
        .btn { cursor: pointer; border: none; padding: 12px; border-radius: 8px; font-weight: bold; transition: 0.3s; }
        .btn-main { background: var(--primary); color: white; width: 100%; }
        .btn-success { background: var(--success); color: white; }

        /* الجدول */
        .days-wrapper { display: flex; overflow-x: auto; gap: 15px; padding-bottom: 10px; }
        .day-col { min-width: 300px; background: white; border: 1px solid #eee; border-radius: 12px; }
        .day-head { background: var(--primary); color: white; padding: 10px; position: relative; border-radius: 12px 12px 0 0; }
        .del-day { position: absolute; left: 10px; top: 10px; color: #ff5252; cursor: pointer; background: white; border-radius: 50%; width: 22px; height: 22px; text-align: center; line-height: 22px; }
        
        .slot-item { padding: 10px; border-bottom: 1px solid #f0f0f0; cursor: pointer; }
        .slot-item:hover { background: #f1f8e9; }
        .booked { border-right: 5px solid var(--success); background: #f9fdf9; }
        .patient-card { font-size: 12px; background: #e8eaf6; padding: 8px; border-radius: 5px; margin-top: 5px; }
        .wa-link { color: #25d366; text-decoration: none; font-weight: bold; }
    </style>
</head>
<body>

<div class="grid-container">
    <!-- الجانب الأيمن: الإدخال -->
    <div class="sidebar">
        <div class="safe-box">
            <span>إجمالي الحصالة (المحقق اليوم) 💰</span>
            <h2 id="grandTotal">0 ج.م</h2>
        </div>

        <div class="card">
            <h3>📝 إدارة المحتوى</h3>
            <label>المقال وصورته:</label>
            <input type="text" id="artTitle" placeholder="عنوان المقال">
            <textarea id="artText" placeholder="نص المقال..."></textarea>
            <input type="file" id="artImg" accept="image/*">
            <hr>
            <label>الفيديو والوصف:</label>
            <input type="text" id="vidUrl" placeholder="رابط يوتيوب">
            <input type="text" id="vidDesc" placeholder="وصف الفيديو">
            <button class="btn btn-main" onclick="uploadContent()">نشر المحتوى</button>
        </div>

        <div class="card">
            <h3>👤 تسجيل/تعديل مريض</h3>
            <input type="text" id="pName" placeholder="الاسم (إلزامي)">
            <input type="text" id="pPhone" placeholder="رقم التليفون (إلزامي)">
            <input type="number" id="pPaid" placeholder="المبلغ المدفوع">
            <textarea id="pNotes" placeholder="ملاحظات أو ملفات..."></textarea>
            <select id="pStatus">
                <option value="حجز">حجز فقط</option>
                <option value="كشف">تم الكشف (يضاف للحصالة)</option>
                <option value="ملغي">إلغاء الحجز</option>
            </select>
            <p style="font-size: 11px; color: red;">* اختر ميعاداً من الجدول أولاً</p>
            <button class="btn btn-success" style="width: 100%" onclick="saveBooking()">تثبيت / تحديث الحجز</button>
        </div>
    </div>

    <!-- الجانب الأيسر: الجدولة والعرض -->
    <div class="main-content">
        <div class="card">
            <h3>📅 جدولة الأيام (حرية اختيار اليوم)</h3>
            <div style="display: flex; gap: 10px; align-items: flex-end;">
                <div>
                    <label>اختر اليوم:</label>
                    <input type="date" id="targetDate">
                </div>
                <div>
                    <label>من:</label>
                    <input type="time" id="startTime" value="17:00">
                </div>
                <div>
                    <label>إلى:</label>
                    <input type="time" id="endTime" value="21:00">
                </div>
                <div>
                    <label>مدة الجلسة (دقيقة):</label>
                    <input type="number" id="duration" value="30" style="width: 80px;">
                </div>
                <button class="btn btn-main" onclick="generateSlots()">توليد الجلسات</button>
            </div>
        </div>

        <div class="card">
            <h3>📊 جدول المواعيد والحصالة اليومية</h3>
            <div id="daysGrid" class="days-wrapper">
                <!-- المواعيد تظهر هنا -->
            </div>
        </div>
    </div>
</div>

<script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-app.js"></script>
<script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-firestore.js"></script>
<script src="script.js"></script>
</body>
</html>
