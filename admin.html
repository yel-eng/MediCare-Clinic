<!DOCTYPE html>
<html lang="ar">
<head>
<meta charset="UTF-8">
<title>CRM Admin</title>

<style>
body{
  font-family:Arial;
  background:#f5f5f5;
  padding:20px;
  direction:rtl;
}

.card{
  background:#fff;
  padding:15px;
  margin:10px 0;
  border-radius:10px;
}

input{
  width:100%;
  padding:8px;
  margin:5px 0;
}

button{
  padding:6px 10px;
  margin:3px;
}
</style>

</head>

<body>

<h1>لوحة التحكم</h1>

<h2>إنشاء مواعيد</h2>

<input type="date" id="slotDate">
<input type="time" id="startTime">
<input type="time" id="endTime">
<input type="number" id="duration" placeholder="مدة الجلسة (دقائق)">

<button onclick="generateSlots()">إنشاء</button>

<h2>المواعيد</h2>
<div id="slots"></div>

<!-- Firebase -->
<script src="https://www.gstatic.com/firebasejs/9.22.2/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/9.22.2/firebase-firestore-compat.js"></script>

<script src="script.js"></script>

</body>
</html>
