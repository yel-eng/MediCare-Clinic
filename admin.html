<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<title>Admin Dashboard</title>

<style>
body{
  font-family: 'Segoe UI', sans-serif;
  background:#f4f7ff;
  margin:0;
  padding:20px;
}

.container{
  max-width:900px;
  margin:auto;
}

.card{
  background:#fff;
  padding:20px;
  margin-bottom:20px;
  border-radius:12px;
  box-shadow:0 5px 15px rgba(0,0,0,0.08);
}

h2{
  color:#1a237e;
}

input, select{
  width:100%;
  padding:10px;
  margin:8px 0;
  border-radius:8px;
  border:1px solid #ddd;
}

button{
  padding:10px 15px;
  background:#1a237e;
  color:#fff;
  border:none;
  border-radius:8px;
  cursor:pointer;
  margin-top:8px;
}

.req{
  padding:10px;
  background:#f1f5f9;
  margin:8px 0;
  border-radius:8px;
}
</style>
</head>

<body>

<div class="container">

<h2>🟣 Admin Dashboard</h2>

<!-- CREATE SLOTS -->
<div class="card">
<h3>➕ Create Slots</h3>

<input type="date" id="slotDate">
<input type="text" id="slotTimes" placeholder="10:00,10:30,11:00">

<button onclick="createSlots()">Create Slots</button>
</div>

<!-- REQUESTS -->
<div class="card">
<h3>📩 Requests</h3>
<div id="requestsBox"></div>
</div>

<!-- DIRECT BOOKING -->
<div class="card">
<h3>🎯 Direct Booking</h3>

<input type="date" id="directDate">
<input type="text" id="directTime" placeholder="10:00">
<input type="text" id="patientName" placeholder="Patient Name">
<input type="text" id="patientPhone" placeholder="Phone">

<button onclick="directBook()">Book Now</button>
</div>

</div>

<script type="module">

import { db } from "./firebase.js";

import {
  collection,
  addDoc,
  getDocs,
  query,
  where,
  doc,
  updateDoc,
  getDoc,
  serverTimestamp
} from "https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore.js";

/* =========================
   AUTH GUARD
========================= */

window.addEventListener("load", () => {

  const user = window.currentUser;

  if (!user || user.role !== "admin") {
    alert("Access Denied");
    window.location.href = "booking.html";
  }

  loadRequests();
});

/* =========================
   CREATE SLOTS
========================= */

window.createSlots = async function () {

  const date = document.getElementById("slotDate").value;
  const times = document.getElementById("slotTimes").value.split(",");

  if (!date || times.length === 0) return;

  for (let t of times) {

    await addDoc(collection(db, "slots"), {
      date,
      time: t.trim(),
      booked: false,
      status: "free",
      createdAt: serverTimestamp()
    });
  }

  alert("Slots created ✔️");
};

/* =========================
   LOAD REQUESTS
========================= */

async function loadRequests() {

  const q = query(collection(db, "requests"), where("status", "==", "pending"));
  const snap = await getDocs(q);

  const box = document.getElementById("requestsBox");
  box.innerHTML = "";

  snap.forEach(r => {

    const data = r.data();

    const phone = data.phone || "";

    box.innerHTML += `
      <div class="req">
        <b>${data.name}</b><br>
        📅 ${data.date}<br>

        <!-- WhatsApp Button -->
        <a href="https://wa.me/${phone}" target="_blank">
          <button>📲 WhatsApp</button>
        </a>

        <button onclick="approveRequest('${r.id}')">
          Approve
        </button>
      </div>
    `;
  });
}

/* =========================
   APPROVE REQUEST
========================= */

window.approveRequest = async function (id) {

  const ref = doc(db, "requests", id);
  const snap = await getDoc(ref);

  if (!snap.exists()) return;

  const data = snap.data();

  await updateDoc(ref, {
    status: "approved"
  });

  alert("Request approved ✔️");

  loadRequests();
};

/* =========================
   DIRECT BOOKING (SAFE VERSION)
========================= */

window.directBook = async function () {

  const date = document.getElementById("directDate").value;
  const time = document.getElementById("directTime").value;
  const name = document.getElementById("patientName").value;
  const phone = document.getElementById("patientPhone").value;

  if (!date || !time || !name || !phone) return;

  // check if slot exists already
  const q = query(
    collection(db, "slots"),
    where("date", "==", date),
    where("time", "==", time)
  );

  const snap = await getDocs(q);

  if (!snap.empty) {
    alert("Slot already exists!");
    return;
  }

  await addDoc(collection(db, "slots"), {
    date,
    time,
    booked: true,
    status: "booked",
    patient: {
      name,
      phone
    },
    createdAt: serverTimestamp()
  });

  alert("Booked directly ✔️");
};

</script>

</body>
</html>
