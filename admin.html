<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<title>CRM Admin Full</title>

<style>
body{font-family:Arial;background:#f4f4f4;padding:20px}
.box{background:#fff;padding:15px;margin:10px 0;border-radius:10px}
input,textarea,select{width:100%;padding:10px;margin:5px 0}
button{padding:10px;background:#1a237e;color:#fff;border:0;border-radius:8px;cursor:pointer}
.card{padding:10px;border-bottom:1px solid #eee}
.slot{padding:10px;border:1px solid #ddd;margin:5px 0;border-radius:8px;cursor:pointer}
.booked{background:#e8f5e9}
.follow{background:#fff3cd}
</style>
</head>

<body>

<h2>🏥 Admin Dashboard</h2>

<!-- ============ CREATE SLOTS ============ -->
<div class="box">
<h3>📅 إنشاء مواعيد</h3>

<input type="date" id="slotDate">
<input type="time" id="startTime">
<input type="time" id="endTime">
<input type="number" id="duration" placeholder="مدة الجلسة بالدقائق">

<button onclick="generateSlots()">إنشاء المواعيد</button>
</div>

<!-- ============ CONTENT ============ -->
<div class="box">
<h3>🎥 فيديو + 📰 مقال</h3>

<input id="videoUrl" placeholder="رابط الفيديو">
<input id="videoDesc" placeholder="وصف الفيديو">

<input id="articleTitle" placeholder="عنوان المقال">
<textarea id="articleText" placeholder="المقال"></textarea>
<input id="articleImage" placeholder="رابط صورة">

<button onclick="saveContent()">حفظ المحتوى</button>
</div>

<!-- ============ SLOTS ============ -->
<div class="box">
<h3>📋 المواعيد</h3>
<div id="slots"></div>
</div>

<!-- ============ PATIENT EDIT ============ -->
<div class="box">
<h3>👤 بيانات العميل</h3>

<input id="pName" placeholder="اسم">
<input id="pPhone" placeholder="هاتف">
<input id="pPaid" placeholder="مدفوع">
<input id="pNotes" placeholder="ملاحظة">

<select id="pStatus">
<option value="حجز">حجز</option>
<option value="كشف">كشف</option>
<option value="ملغي">ملغي</option>
</select>

<button onclick="save()">حفظ التعديل</button>
</div>

<script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-app.js"></script>
<script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-firestore.js"></script>

<script>
const firebaseConfig = {
  apiKey:"xxx",
  projectId:"mydoctor-clinic"
};

firebase.initializeApp(firebaseConfig);
const db = firebase.firestore();

let activeId = null;

---

## 📅 إنشاء مواعيد
function generateSlots(){
let d = slotDate.value;
let s = startTime.value;
let e = endTime.value;
let dur = parseInt(duration.value);

let start = new Date(`${d}T${s}`);
let end = new Date(`${d}T${e}`);

while(start < end){

db.collection("slots").add({
date:d,
time:start.toTimeString().slice(0,5),
booked:false,
status:"حجز",
patient:{},
notes:"",
timestamp:firebase.firestore.Timestamp.fromDate(start)
});

start.setMinutes(start.getMinutes()+dur);
}

loadSlots();
}

---

## 📋 عرض المواعيد
function loadSlots(){
db.collection("slots").orderBy("timestamp").onSnapshot(snap=>{
let html="";
snap.forEach(doc=>{
let s = doc.data();

let cls = "slot";
if(s.booked) cls += " booked";
if(s.notes?.includes("تواصل")) cls += " follow";

html += `
<div class="${cls}" onclick="edit('${doc.id}', ${JSON.stringify(s).replace(/"/g,'&quot;')})">
<b>${s.time}</b> - ${s.patient?.name || "متاح"}

${s.patient?.phone ?
`<br><a href="https://wa.me/2${s.patient.phone}" target="_blank">📱 واتساب</a>` : ""}
</div>
`;
});

slots.innerHTML = html;
});
}

---

## ✏️ اختيار
function edit(id,data){
activeId=id;

pName.value=data.patient?.name||"";
pPhone.value=data.patient?.phone||"";
pPaid.value=data.paid||0;
pNotes.value=data.notes||"";
pStatus.value=data.status||"حجز";
}

---

## 💾 حفظ تعديل
function save(){
if(!activeId) return;

db.collection("slots").doc(activeId).update({
booked:true,
status:pStatus.value,
paid:Number(pPaid.value),
notes:pNotes.value,
patient:{
name:pName.value,
phone:pPhone.value
}
});

loadSlots();
}

---

## 🎥 محتوى
function saveContent(){
db.collection("content").doc("main").set({
video:{url:videoUrl.value,desc:videoDesc.value},
article:{
title:articleTitle.value,
text:articleText.value,
image:articleImage.value
}
});
alert("تم الحفظ");
}

window.onload=loadSlots;
</script>

</body>
</html>
