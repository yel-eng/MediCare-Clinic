<!DOCTYPE html>
<html lang="ar">
<head>
<meta charset="UTF-8">
<title>Admin</title>
<link rel="stylesheet" href="style.css">
</head>

<body>

<header class="header">
  <div class="logo">🧠 Admin Panel</div>
</header>
<h1>Admin Dashboard</h1>

<h2>الحجوزات</h2>
<div id="bookings"></div>

<h2 id="income"></h2>

<script type="module">
import { db } from "./script.js";
import { collection, getDocs } from "firebase/firestore";
import { getDailyIncome } from "./script.js";

async function loadBookings() {
  const snap = await getDocs(collection(db, "bookings"));

  let html = "";

  snap.forEach(doc => {
    let d = doc.data();

    html += `
      <div>
        <p>${d.name}</p>
        <p>${d.phone}</p>
        <p>${d.date} - ${d.time}</p>
      </div>
    `;
  });

  document.getElementById("bookings").innerHTML = html;
}

loadBookings();
getDailyIncome();
</script>
<section class="section">
  <h2>إضافة فيديو</h2>
  <input id="videoUrl" placeholder="رابط الفيديو">
  <input id="videoText" placeholder="الوصف">
  <button onclick="addVideo()">إضافة</button>

  <h2>إضافة مقال</h2>
  <input id="blogTitle" placeholder="العنوان">
  <textarea id="blogText"></textarea>
  <button onclick="addBlog()">إضافة</button>
</section>

<footer class="footer">
  <p>Admin Dashboard</p>
</footer>

<script src="script.js"></script>
</body>
</html>
