<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>النظام الشامل لإدارة العيادة</title>
    <style>
        :root { --main: #1a237e; --accent: #00bcd4; --bg: #f0f2f5; }
        body { font-family: 'Segoe UI', sans-serif; background: var(--bg); margin: 0; padding: 20px; }
        .admin-grid { display: grid; grid-template-columns: 350px 1fr; gap: 20px; }
        .card { background: white; padding: 20px; border-radius: 15px; box-shadow: 0 4px 15px rgba(0,0,0,0.1); margin-bottom: 20px; }
        
        /* الحصالة الذكية */
        .day-wallet { background: linear-gradient(135deg, #1a237e, #00bcd4); color: white; padding: 15px; border-radius: 12px; margin-bottom: 10px; }
        .wallet-row { display: flex; justify-content: space-between; font-size: 14px; margin-top: 5px; }

        /* إدارة الأيام والمواعيد */
        .slots-container { display: flex; overflow-x: auto; gap: 15px; padding-bottom: 15px; }
        .day-column { min-width: 300px; background: #fff; border: 1px solid #ddd; border-radius: 12px; }
        .day-header { background: var(--main); color: white; padding: 10px; border-radius: 12px 12px 0 0; position: relative; }
        .delete-day { position: absolute; left: 10px; top: 10px; cursor: pointer; color: #ff5252; background: white; border-radius: 50%; width: 20px; height: 20px; text-align: center; line-height: 20px; font-size: 12px; }

        /* بيانات المريض والملفات */
        .patient-info { font-size: 12px; background: #f9f9f9; padding: 8px; border-radius: 5px; margin-top: 5px; }
        .btn-action { padding: 5px 10px; border: none; border-radius: 4px; cursor: pointer; font-size: 11px; margin: 2px; }
        
        input, textarea, select { width: 100%; padding: 8px; margin: 5px 0; border: 1px solid #ddd; border-radius: 6px; box-sizing: border-box; }
        .modal { display:none; position:fixed; z-index:100; left:0; top:0; width:100%; height:100%; background:rgba(0,0,0,0.5); }
        .modal-content { background:white; margin:5% auto; padding:20px; width:50%; border-radius:15px; }
    </style>
</head>
<body>

    <div class="admin-grid">
        <!-- القائمة الجانبية: تسجيل مريض جديد + إعداد يوم -->
        <div class="sidebar">
            <div class="card">
                <h3>👤 تسجيل / تعديل مريض</h3>
                <input type="text" id="pName" placeholder="اسم المريض">
                <input type="text" id="pPhone" placeholder="رقم الهاتف">
                <textarea id="pNotes" placeholder="ملاحظات طبية"></textarea>
                <input type="file" id="pFile" style="font-size: 10px;">
                <button class="btn-main" onclick="savePatientData()" style="width:100%; background:var(--main); color:white; padding:10px; border-radius:8px; border:none; cursor:pointer;">حفظ بيانات المريض</button>
            </div>

            <div class="card">
                <h3>📅 إضافة يوم للجدول</h3>
                <input type="date" id="singleDate">
                <div style="display:flex; gap:5px;">
                    <input type="time" id="sTime" value="17:00">
                    <input type="time" id="eTime" value="21:00">
                </div>
                <input type="number" id="interval" value="30" placeholder="مدة الجلسة">
                <button onclick="addSingleDay()" style="width:100%; background:var(--accent); border:none; padding:10px; border-radius:8px; cursor:pointer;">إضافة هذا اليوم فقط ➕</button>
            </div>
        </div>

        <!-- المحتوى الرئيسي: الجداول والحصالة -->
        <div class="main-content">
            <div id="daysGrid" class="slots-container">
                <!-- الأيام ستظهر هنا برأس كل يوم حصالته الخاصة -->
            </div>
        </div>
    </div>

    <!-- نافذة QR وتعديل الموعد -->
    <div id="editModal" class="modal">
        <div class="modal-content" id="modalBody"></div>
    </div>

    <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-app.js"></script>
    <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-firestore.js"></script>
    <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-storage.js"></script>
    <!-- مكتبة QR Code -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js"></script>
    <script src="script.js"></script>
</body>
</html>
