<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <title>حجز موعد | MyDoctor</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
<header class="header"><div class="logo">🏥 حجز العيادة</div></header>

<div class="section">
    <div class="box" style="max-width: 500px; margin: 0 auto;">
        <h2>🗓️ احجز موعدك</h2>
        <input type="text" id="name" placeholder="الاسم بالكامل">
        <input type="tel" id="phone" placeholder="رقم الهاتف">
        
        <label>1. اختر اليوم:</label>
        <select id="daySelect" onchange="filterTimesByDay()">
            <option value="">-- اختر اليوم --</option>
        </select>

        <label style="margin-top:15px; display:block;">2. اختر الوقت المتاح:</label>
        <select id="slotsSelect">
            <option value="">اختر اليوم أولاً</option>
        </select>
        
        <button onclick="book()" style="margin-top:20px; width:100%; background:#4caf50; color:white; padding:15px; border:none; border-radius:8px;">تأكيد الحجز ⚡</button>
    </div>
</div>

<script src="https://www.gstatic.com/firebasejs/9.22.2/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/9.22.2/firebase-firestore-compat.js"></script>
<script src="script.js"></script>
</body>
</html>
