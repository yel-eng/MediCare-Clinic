<!DOCTYPE html>
<html lang="ar">
<head>
<meta charset="UTF-8">
<title>MyDoctor Clinic</title>

<link rel="stylesheet" href="style.css">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">

<style>
body{
  margin:0;
  font-family:Arial;
  background:#f5f7fb;
}

.nav{
  display:flex;
  justify-content:center;
  gap:20px;
  background:#1976d2;
  padding:15px;
}

.nav a{
  color:white;
  text-decoration:none;
  font-weight:bold;
}

.hero{
  height:65vh;
  background:url("https://images.unsplash.com/photo-1580281657527-47f249e8f0a0") center/cover;
  display:flex;
  align-items:center;
  justify-content:center;
  color:white;
  text-align:center;
  position:relative;
}

.hero::after{
  content:"";
  position:absolute;
  width:100%;
  height:100%;
  background:rgba(0,0,0,0.5);
}

.hero h1{
  position:relative;
  font-size:45px;
}

.section{
  padding:50px 20px;
  text-align:center;
}

.grid{
  display:grid;
  grid-template-columns:repeat(auto-fit,minmax(250px,1fr));
  gap:20px;
}

.card{
  background:white;
  border-radius:15px;
  overflow:hidden;
  box-shadow:0 10px 25px rgba(0,0,0,0.1);
  transition:0.3s;
}

.card:hover{
  transform:translateY(-5px);
}

.card img{
  width:100%;
  height:180px;
  object-fit:cover;
}

.card h3{
  padding:10px;
}

.video iframe{
  width:100%;
  height:180px;
}

footer{
  background:#1976d2;
  color:white;
  text-align:center;
  padding:15px;
}
</style>

</head>

<body>

<!-- NAV -->
<div class="nav">
  <a href="booking.html">الحجز</a>
  <a href="login.html">تسجيل الدخول</a>
</div>

<!-- HERO -->
<div class="hero">
  <h1>MyDoctor Clinic</h1>
</div>

<!-- SERVICES -->
<div class="section">
  <h2>خدماتنا</h2>

  <div class="grid">

    <div class="card">
      <img src="https://images.unsplash.com/photo-1580281657527-47f249e8f0a0">
      <h3>كشف طبي</h3>
    </div>

    <div class="card">
      <img src="https://images.unsplash.com/photo-1581595219317-8fdbf0b7f0f5">
      <h3>تحاليل</h3>
    </div>

    <div class="card">
      <img src="https://images.unsplash.com/photo-1579154204601-01588f351e67">
      <h3>متابعة</h3>
    </div>

  </div>
</div>

<!-- VIDEOS -->
<div class="section">
  <h2>فيديوهات طبية</h2>
  <div id="videos" class="grid"></div>
</div>

<!-- BLOG -->
<div class="section">
  <h2>مقالات طبية</h2>
  <div id="blogs" class="grid"></div>
</div>

<footer>
© MyDoctor Clinic
</footer>

<script src="script.js"></script>

</body>
</html>
