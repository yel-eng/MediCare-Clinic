<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<title>نظام حجز احترافي</title>

<style>
body{
  font-family: 'Segoe UI', Tahoma, Arial, sans-serif;
  background: linear-gradient(135deg, #e9f0ff, #f5f7fb);
  margin: 0;
  padding: 30px;
  display: flex;
  justify-content: center;
  align-items: center;
  min-height: 100vh;
}

.box{
  width: 100%;
  max-width: 520px;
  background: #fff;
  padding: 30px;
  border-radius: 18px;
  box-shadow: 0 10px 30px rgba(0,0,0,0.08);
}

h2{
  text-align:center;
  color:#1a237e;
}

input{
  width:100%;
  padding:12px;
  margin:10px 0;
  border-radius:10px;
  border:1px solid #ddd;
}

button{
  width:100%;
  padding:12px;
  background:#1b5e20;
  color:#fff;
  border:none;
  border-radius:10px;
  cursor:pointer;
}

#slotsContainer{
  margin-top:15px;
}
</style>
</head>

<body>

<div class="box">

<h2>📅 احجز موعدك</h2>

<input id="name" placeholder="الاسم">
<input id="phone" placeholder="رقم الهاتف">

<input type="date" id="dateInput">

<div id="slotsContainer"></div>

<button onclick="book()">تأكيد الحجز</button>

</div>

<script type="module">

import { db } from "./firebase.js";

import {
  collection,
  query,
  where,
  getDocs,
  doc,
  getDoc,
  updateDoc,
  addDoc,
  serverTimestamp
} from "https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore.js";

/* =========================
   STATE
========================= */

let selectedDate = "";
let slotsCache = [];

/* =========================
   AUTH CHECK
========================= */

window.addEventListener("load", () => {
  const user = window.getCurrentUser?.();
  if (!user) window.location.href = "login.html";
});

/* =========================
   DATE HANDLER
========================= */

document.getElementById("dateInput").addEventListener("change", async (e) => {
  selectedDate = e.target.value;
  await loadSlots(selectedDate);
});

/* =========================
   LOAD SLOTS
========================= */

async function loadSlots(date) {

  const q = query(collection(db, "slots"), where("date", "==", date));
  const snap = await getDocs(q);

  slotsCache = [];

  snap.forEach(d => {
    slotsCache.push({ id: d.id, ...d.data() });
  });

  renderSlots();
}

/* =========================
   RENDER
========================= */

function renderSlots() {

  const container = document.getElementById("slotsContainer");
  container.innerHTML = "";

  const available = slotsCache.filter(s => !s.booked);

  if (available.length === 0) {
    container.innerHTML = `
      <p>❌ لا يوجد مواعيد</p>
      <button onclick="createRequest()">طلب موعد</button>
    `;
    return;
  }

  available.forEach(slot => {

    const div = document.createElement("div");

    div.style.padding = "10px";
    div.style.margin = "8px 0";
    div.style.background = "#f1f5f9";
    div.style.borderRadius = "10px";
    div.style.cursor = "pointer";

    div.innerText = "🕒 " + slot.time;

    div.onclick = () => book(slot.id);

    container.appendChild(div);
  });
}

/* =========================
   BOOK SLOT
========================= */

window.book = async function (slotId) {

  const user = window.getCurrentUser?.();

  const name = document.getElementById("name").value;
  const phone = document.getElementById("phone").value;

  if (!name || !phone) return alert("املأ البيانات");

  const ref = doc(db, "slots", slotId);
  const snap = await getDoc(ref);

  if (!snap.exists()) return;

  const data = snap.data();

  if (data.booked) return alert("محجوز");

  await updateDoc(ref, {
    booked: true,
    status: "booked",
    patient: { uid: user.uid, name, phone },
    updatedAt: serverTimestamp()
  });

  alert("تم الحجز ✔️");

  loadSlots(selectedDate);
};

/* =========================
   REQUEST
========================= */

window.createRequest = async function () {

  const user = window.getCurrentUser?.();

  const name = document.getElementById("name").value;
  const phone = document.getElementById("phone").value;

  await addDoc(collection(db, "requests"), {
    uid: user.uid,
    name,
    phone,
    date: selectedDate,
    status: "pending",
    createdAt: serverTimestamp()
  });

  alert("تم إرسال الطلب ✔️");
};

</script>

</body>
</html>
