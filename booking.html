<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>حجز موعد | عيادتي</title>

<style>
body{font-family:Arial;background:#f5f5f5;padding:20px}
.box{max-width:500px;margin:auto;background:#fff;padding:25px;border-radius:12px}
input,select{width:100%;padding:12px;margin:8px 0;border:1px solid #ccc;border-radius:8px}
button{width:100%;padding:14px;background:#4caf50;color:#fff;border:none;border-radius:8px;font-size:16px}
</style>
</head>

<body>

<div class="box">

<h2>🗓️ احجز موعدك</h2>

<input id="name" placeholder="الاسم">
<input id="phone" placeholder="رقم الهاتف">

<select id="daySelect" onchange="loadTimes()">
<option>جاري تحميل الأيام...</option>
</select>

<select id="timeSelect">
<option>اختر الوقت</option>
</select>

<button onclick="book()">تأكيد الحجز</button>

</div>

<script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-app.js"></script>
<script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-firestore.js"></script>

<script>
const firebaseConfig = {
  apiKey: "AIzaSyA8FEgNeXAMZ1Sbg12zFCzwwxUD3sVl99o",
  authDomain: "mydoctor-clinic.firebaseapp.com",
  projectId: "mydoctor-clinic"
};

firebase.initializeApp(firebaseConfig);
const db = firebase.firestore();


/**********************
تحميل الأيام
**********************/
function loadDays(){

  let select = document.getElementById("daySelect");
  select.innerHTML = "";

  db.collection("slots")
    .where("booked","==",false)
    .get()
    .then(snap=>{

      let days = new Set();

      snap.forEach(doc=>{
        days.add(doc.data().date);
      });

      if(days.size === 0){
        select.innerHTML = "<option>لا يوجد مواعيد</option>";
        return;
      }

      select.innerHTML = "<option value=''>اختر اليوم</option>";

      days.forEach(d=>{
        select.innerHTML += `<option value="${d}">${d}</option>`;
      });

    });
}


/**********************
تحميل الأوقات
**********************/
function loadTimes(){

  let day = document.getElementById("daySelect").value;
  let select = document.getElementById("timeSelect");

  select.innerHTML = "";

  if(!day) return;

  db.collection("slots")
    .where("date","==",day)
    .where("booked","==",false)
    .orderBy("timestamp","asc")
    .get()
    .then(snap=>{

      if(snap.empty){
        select.innerHTML = "<option>لا يوجد أوقات</option>";
        return;
      }

      select.innerHTML = "<option value=''>اختر الوقت</option>";

      snap.forEach(doc=>{
        let s = doc.data();

        select.innerHTML += `
          <option value="${doc.id}">
            ${s.time}
          </option>
        `;
      });

    });

}


/**********************
الحجز
**********************/
function book(){

  let name = document.getElementById("name").value;
  let phone = document.getElementById("phone").value;
  let slotId = document.getElementById("timeSelect").value;

  if(!name || !phone || !slotId){
    alert("املأ البيانات");
    return;
  }

  let ref = db.collection("slots").doc(slotId);

  ref.get().then(doc=>{

    let s = doc.data();

    if(s.booked){
      alert("الموعد اتحجز ❌");
      loadDays();
      loadTimes();
      return;
    }

    ref.update({
      booked:true,
      status:"حجز",
      patient:{
        name:name,
        phone:phone
      }
    }).then(()=>{

      alert("تم الحجز بنجاح ✅");

      loadDays();
      document.getElementById("timeSelect").innerHTML = "";
      document.getElementById("name").value = "";
      document.getElementById("phone").value = "";

    });

  });

}


window.onload = loadDays;
</script>

</body>
</html>
