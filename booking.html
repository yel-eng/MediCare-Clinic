<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<title>نظام الحجز</title>

<style>
body{
  font-family: Arial;
  background:#1a237e;
  margin:0;
  padding:30px;
  display:flex;
  justify-content:center;
  margin-top:100px;
}

.box{
  width:100%;
  max-width:500px;
  background:#fff;
  padding:20px;
  border-radius:15px;
  box-shadow:0 5px 20px rgba(0,0,0,.9);
}

input{
  width:100%;
  padding:10px;
  margin:8px 0;
  border:1px solid #ddd;
  border-radius:8px;
}

button{
  width:100%;
  padding:12px;
  margin-top:10px;
  background:#1a237e;
  color:#fff;
  border:none;
  border-radius:8px;
  cursor:pointer;
}

.slot{
  padding:10px;
  margin:5px 0;
  background:#eee;
  border-radius:8px;
  cursor:pointer;
}

.selected{
  background:#1a237e;
  color:#fff;
}
</style>
</head>

<body>

<div class="box">

<h2>📅 احجز موعدك</h2>

<input id="name" placeholder="الاسم">
<input id="phone" placeholder="الهاتف">
<input type="date" id="dateInput">

<div id="slotsContainer"></div>

<button onclick="book()">تأكيد الحجز</button>

</div>

<!-- ================= POPUP ================= -->
<div id="popup" style="
  display:none;
  position:fixed;
  top:0; left:0;
  width:100%; height:100%;
  background:rgba(0,0,0,0.6);
  justify-content:center;
  align-items:center;
">

  <div style="
    background:#fff;
    width:400px;
    max-height:80vh;
    overflow:auto;
    padding:20px;
    border-radius:12px;
  ">

    <h3>اختار ميعاد للمريض</h3>

    <div id="popupSlots"></div>

    <button onclick="closePopup()">إغلاق</button>

  </div>
</div>

<script type="module">
import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-app.js";
import {
  getFirestore,
  collection,
  onSnapshot,
  doc,
  getDoc,
  updateDoc,
  addDoc,
  query,
  where,
  getDocs,
  serverTimestamp
} from "https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore.js";

import { getAuth } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-auth.js";

/* ================= FIREBASE ================= */
const firebaseConfig = {
  apiKey: "AIzaSyA8FEgNeXAMZ1Sbg12zFCzwwxUD3sVl99o",
  authDomain: "mydoctor-clinic.firebaseapp.com",
  projectId: "mydoctor-clinic",
};

const app = initializeApp(firebaseConfig);
const db = getFirestore(app);
const auth = getAuth(app);

window.db = db;

/* ================= STATE ================= */
const $ = (id) => document.getElementById(id);

let slotsCache = [];
let requestsCache = [];
let selectedRequest = null;
let selectedSlotId = null; // لتتبع الميعاد المختار يدوياً

const slotsRef = collection(db, "slots");
const requestsRef = collection(db, "requests");

/* ================= REALTIME LISTENERS ================= */
// Listener للمواعيد - مع الإصلاح: يعرض اليوم المختار فقط
onSnapshot(slotsRef, snap => {
  slotsCache = [];
  snap.forEach(d => slotsCache.push({ id: d.id, ...d.data() }));
  
  // ✅ الإصلاح: نعرض مواعيد اليوم المختار فقط (لو موجود)
  const selectedDate = document.getElementById("dateInput")?.value;
  if (selectedDate) {
    renderSlotsByDate(selectedDate);
  } else {
    document.getElementById("slotsContainer").innerHTML = "";
  }
});

// Listener للطلبات (لأدمن)
onSnapshot(requestsRef, snap => {
  requestsCache = [];
  snap.forEach(d => requestsCache.push({ id: d.id, ...d.data() }));
  renderRequests();
});

/* ================= 🎯 دالة العرض الديناميكي حسب اليوم (الأساسية) ================= */
window.renderSlotsByDate = (date) => {
  const container = document.getElementById("slotsContainer");
  container.innerHTML = "";
  selectedSlotId = null; // إعادة تعيين الاختيار عند تغيير اليوم

  if (!date) return;

  // فلترة من الكاش: مواعيد هذا التاريخ + غير محجوزة
  const available = slotsCache.filter(s => s.date === date && !s.booked);

  if (available.length > 0) {
    // ترتيب زمني دقيق
    available.sort((a, b) => a.time.localeCompare(b.time));
    
    available.forEach(slot => {
      const div = document.createElement("div");
      div.className = "slot";
      div.innerText = `🕒 ${slot.time}`;
      
      // عند الضغط على ميعاد: تحديده بصرياً وحفظ الـ ID
      div.onclick = () => {
        document.querySelectorAll(".slot").forEach(el => el.classList.remove("selected"));
        div.classList.add("selected");
        selectedSlotId = slot.id;
        console.log("✅ Slot selected:", slot.id);
      };
      container.appendChild(div);
    });
  } else {
    // حالة عدم وجود مواعيد متاحة
    const anySlots = slotsCache.some(s => s.date === date);
    if (!anySlots) {
      // مفيش جدول أصلاً في هذا اليوم → زر إرسال طلب
      container.innerHTML = `
        <p style="color:#666; margin:10px 0; text-align:center;">لا توجد مواعيد مضافة لهذا اليوم</p>
        <button onclick="window.sendBookingRequest('${date}')" 
          style="background:#ff9800; color:#fff; padding:10px; border:none; border-radius:8px; width:100%; cursor:pointer; margin-top:10px;">
          📝 إرسال طلب حجز
        </button>
      `;
    } else {
      // في جدول لكن كل المواعيد محجوزة
      container.innerHTML = `<p style="color:#d32f2f; margin:10px 0; text-align:center;">جميع مواعيد هذا اليوم محجوزة ❌</p>`;
    }
  }
};

/* ================= ربط حدث تغيير التاريخ تلقائياً ================= */
document.addEventListener("DOMContentLoaded", () => {
  const dateInput = document.getElementById("dateInput");
  if (dateInput) {
    dateInput.addEventListener("change", (e) => {
      const date = e.target.value;
      if (date) {
        renderSlotsByDate(date);
      } else {
        document.getElementById("slotsContainer").innerHTML = "";
        selectedSlotId = null;
      }
    });
  }
});

/* ================= ✅ دالة الحجز النهائية (تعتمد على الاختيار اليدوي) ================= */
window.book = async () => {
  // التحقق من اختيار ميعاد
  if (!selectedSlotId) {
    return alert("⚠️ اختر ميعاداً من القائمة أولاً");
  }
  
  const name = $("name").value.trim();
  const phone = $("phone").value.trim();
  const date = $("dateInput").value;
  
  if (!name || !phone || !date) {
    return alert("⚠️ اكمل البيانات: الاسم والهاتف");
  }

  try {
    // Double-Check: نتأكد إن الميعاد لسه متاح قبل الحجز
    const slotRef = doc(db, "slots", selectedSlotId);
    const slotSnap = await getDoc(slotRef);
    
    if (!slotSnap.exists() || slotSnap.data().booked) {
      alert("❌ هذا الميعاد تم حجزه للتو، اختر ميعاد آخر");
      renderSlotsByDate(date); // إعادة تحميل المواعيد
      return;
    }

    // تنفيذ الحجز
    await updateDoc(slotRef, {
      booked: true,
      status: "booked",
      patient: { name, phone },
      updatedAt: serverTimestamp()
    });

    // حفظ البيانات للصفحة التالية (لو محتاجة)
    localStorage.setItem("name", name);
    localStorage.setItem("phone", phone);
    localStorage.setItem("date", date);
    localStorage.setItem("time", slotSnap.data().time);

    alert("✅ تم الحجز بنجاح!");
    
    // إعادة تعيين الحقول
    selectedSlotId = null;
    $("name").value = "";
    $("phone").value = "";
    
    // إعادة عرض المواعيد لتحديث الواجهة
    renderSlotsByDate(date);
    
    // توجيه لصفحة التأكيد (اختياري - لو موجودة)
    // location.href = "confirm.html";

  } catch (err) {
    console.error("❌ Booking Error:", err);
    alert("❌ حدث خطأ أثناء الحجز. حاول مرة أخرى.");
  }
};

/* ================= 📝 دالة إرسال طلب (لأيام مفيش لها جدول) ================= */
window.sendBookingRequest = async (date) => {
  const name = $("name").value.trim();
  const phone = $("phone").value.trim();
  
  if (!name || !phone) {
    return alert("⚠️ اكتب الاسم والهاتف عشان نرسل طلبك");
  }

  try {
    await addDoc(requestsRef, {
      name,
      phone,
      date,
      status: "pending",
      source: "booking_page_no_slots",
      createdAt: serverTimestamp()
    });

    alert("✅ تم إرسال طلبك للأدمن، هنتواصل معاك لتأكيد الميعاد ✔️");
    
    $("name").value = "";
    $("phone").value = "";
    
  } catch (err) {
    console.error("❌ Request Error:", err);
    alert("❌ فشل إرسال الطلب، حاول مرة أخرى");
  }
};

/* ================= 🛠️ دوال الأدمن (لإدارة الطلبات) ================= */

// فتح نافذة اختيار ميعاد لطلب
window.openRequest = (id) => {
  selectedRequest = id;
  loadPopupSlots();
  document.getElementById("popup").style.display = "flex";
};

// تحميل المواعيد المتاحة في النافذة المنبثقة
async function loadPopupSlots(){
  const box = document.getElementById("popupSlots");
  box.innerHTML = "";

  slotsCache
    .filter(s => !s.booked)
    .forEach(s => {
      const div = document.createElement("div");
      div.style = `padding:10px; margin:5px 0; background:#eee; cursor:pointer; border-radius:8px`;
      div.innerText = `🕒 ${s.date} - ${s.time}`;
      div.onclick = () => assignToSlot(s.id);
      box.appendChild(div);
    });
}

// ربط طلب بميعاد محدد
window.assignToSlot = async (slotId) => {
  if (!selectedRequest) return;

  try {
    const reqRef = doc(db, "requests", selectedRequest);
    const reqSnap = await getDoc(reqRef);
    const req = reqSnap.data();

    await updateDoc(doc(db, "slots", slotId), {
      booked: true,
      status: "booked",
      patient: { name: req.name, phone: req.phone },
      updatedAt: serverTimestamp()
    });

    await updateDoc(reqRef, {
      status: "assigned",
      assignedAt: serverTimestamp()
    });

    closePopup();
    selectedRequest = null;
    alert("✅ تم الحجز بنجاح");
  } catch (err) {
    console.error("❌ Assign Error:", err);
    if (err.message?.includes("index")) {
      alert("⚠️ هذا الإجراء يحتاج فهرس جديد في فايربيس. راجع الكونسول.");
    } else {
      alert("❌ حدث خطأ أثناء الربط");
    }
  }
};

// إغلاق النافذة المنبثقة
window.closePopup = () => {
  document.getElementById("popup").style.display = "none";
};

/* ================= عرض الطلبات (لأدمن) ================= */
function renderRequests(){
  const box = document.getElementById("requestsBox");
  if (!box) return;
  
  box.innerHTML = "";
  requestsCache.forEach(r => {
    box.innerHTML += `
      <div style="padding:10px; border:1px solid #ddd; margin:5px; border-radius:8px; background:#fff;">
        👤 ${r.name} - 📞 ${r.phone} - 📅 ${r.date}
        <br>
        <button onclick="openRequest('${r.id}')" 
          style="margin-top:5px; background:#1a237e; color:#fff; border:none; padding:6px 12px; border-radius:6px; cursor:pointer;">
          تحديد ميعاد
        </button>
      </div>
    `;
  });
}

/* ================= تهيئة أولية وتسجيل في الكونسول ================= */
console.log("✅ Booking Page Loaded - Dynamic Date Filter Active");
console.log("📋 Functions exposed:", {
  book: typeof window.book,
  renderSlotsByDate: typeof window.renderSlotsByDate,
  sendBookingRequest: typeof window.sendBookingRequest,
  openRequest: typeof window.openRequest,
  assignToSlot: typeof window.assignToSlot,
  closePopup: typeof window.closePopup
});

</script>

</body>
</html>
