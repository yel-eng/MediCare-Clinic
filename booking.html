<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<title>نظام حجز احترافي</title>

<style>
body{
  font-family: 'Segoe UI', Tahoma, Arial, sans-serif;
  background: linear-gradient(135deg, #e9f0ff, #f5f7fb);
  margin: 0;
  padding: 30px;
  display: flex;
  justify-content: center;
  align-items: center;
  min-height: 100vh;
}

/* Card */
.box{
  width: 100%;
  max-width: 520px;
  background: #ffffff;
  padding: 30px;
  border-radius: 18px;
  box-shadow: 0 10px 30px rgba(0,0,0,0.08);
  border: 1px solid rgba(0,0,0,0.05);
  position: relative;
  overflow: hidden;
}

/* Title */
.box h2{
  margin-bottom: 20px;
  font-size: 24px;
  color: #1a237e;
  text-align: center;
}

/* Inputs */
input, select{
  width: 100%;
  padding: 12px 14px;
  margin: 10px 0;
  border-radius: 10px;
  border: 1px solid #dfe3e8;
  background: #fafbff;
  font-size: 14px;
  transition: 0.2s ease;
}

input:focus, select:focus{
  border-color: #3f51b5;
  outline: none;
  box-shadow: 0 0 0 3px rgba(63,81,181,0.15);
  background: #fff;
}

/* Button */
button{
  width: 100%;
  padding: 13px;
  margin-top: 10px;
  background: linear-gradient(135deg, #2e7d32, #1b5e20);
  color: white;
  border: none;
  border-radius: 12px;
  font-size: 15px;
  font-weight: bold;
  cursor: pointer;
  transition: 0.25s ease;
  box-shadow: 0 6px 15px rgba(46,125,50,0.25);
}

button:hover{
  transform: translateY(-2px);
  box-shadow: 0 10px 20px rgba(46,125,50,0.3);
}

button:active{
  transform: scale(0.98);
}

/* Message */
.msg{
  margin: 12px 0;
  padding: 10px 12px;
  border-radius: 10px;
  font-size: 14px;
  background: #fff3f3;
  border: 1px solid #ffcdd2;
  color: #c62828;
  text-align: center;
}

.ok{
  background: #e8f5e9 !important;
  border-color: #a5d6a7 !important;
  color: #2e7d32 !important;
}

/* Loading state */
.loading{
  opacity: 0.7;
  pointer-events: none;
  position: relative;
}

/* Loading animation */
.loading::after{
  content: "";
  position: absolute;
  right: 15px;
  top: 50%;
  width: 14px;
  height: 14px;
  border: 2px solid #fff;
  border-top: 2px solid transparent;
  border-radius: 50%;
  animation: spin 0.8s linear infinite;
  transform: translateY(-50%);
}

@keyframes spin{
  0% { transform: translateY(-50%) rotate(0deg); }
  100% { transform: translateY(-50%) rotate(360deg); }
}
</style>
</head>

<body>

<div class="box">

<h2>📅 احجز موعدك</h2>

<input id="name" placeholder="الاسم">
<input id="phone" placeholder="رقم الهاتف">

<input type="date" id="dateInput" onchange="checkDay()">

<select id="timeSelect" style="display:none;"></select>

<div id="msg" class="msg"></div>

<button id="btn" onclick="book()">تأكيد الحجز</button>

</div>

<script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-app.js"></script>
<script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-firestore.js"></script>

<script>

const firebaseConfig = {
  apiKey: "AIzaSyA8FEgNeXAMZ1Sbg12zFCzwwxUD3sVl99o",
  authDomain: "mydoctor-clinic.firebaseapp.com",
  projectId: "mydoctor-clinic"
};

firebase.initializeApp(firebaseConfig);
const db = firebase.firestore();

let selectedDate = "";
let availableSlots = [];

// ==========================
// check day + smart loading
// ==========================
async function checkDay(){

  selectedDate = dateInput.value;
  msg.innerHTML = "⏳ جاري تحميل المواعيد...";

  let snap = await db.collection("slots")
    .where("date","==",selectedDate)
    .get();

  availableSlots = [];

  snap.forEach(doc=>{
    let d = doc.data();
    if(!d.booked) availableSlots.push({id:doc.id, ...d});
  });

  if(availableSlots.length === 0){

    msg.innerHTML = "❌ لا يوجد مواعيد متاحة — سيتم تسجيل طلبك";

    timeSelect.style.display = "none";
    return;
  }

  msg.innerHTML = "";

  timeSelect.style.display = "block";
  timeSelect.innerHTML = `<option value="">اختر الوقت</option>`;

  availableSlots.sort((a,b)=>a.time.localeCompare(b.time));

  availableSlots.forEach(s=>{
    timeSelect.innerHTML += `<option value="${s.id}">${s.time}</option>`;
  });
}


// ==========================
// SMART fallback (nearest slot)
// ==========================
function findNearestSlot(){

  if(availableSlots.length === 0) return null;

  return availableSlots[0]; // أبسط intelligent fallback
}


// ==========================
// booking with transaction
// ==========================
async function book(){

  let name = document.getElementById("name").value.trim();
  let phone = document.getElementById("phone").value.trim();
  let slotId = document.getElementById("timeSelect").value;

  if(!name || !phone){
    msg.innerHTML = "⚠️ املأ البيانات";
    return;
  }

  btn.classList.add("loading");
  msg.innerHTML = "⏳ جاري تأكيد الحجز...";

  try{

    // ======================
    // CASE 1: no slots → queue system
    // ======================
    if(!slotId){

     await db.collection("slots").add({
  date: selectedDate,
  time: "REQUEST",
  booked: true,
  status: "pending",
  patient:{
    name,
    phone,
    notes:"تواصل مع العميل لتحديد ميعاد"
  },
  createdAt: firebase.firestore.Timestamp.now()
});4

      msg.innerHTML = "📩 تم تسجيل طلبك وسنتواصل معك";
      btn.classList.remove("loading");
      return;
    }

    // ======================
    // CASE 2: transaction booking (ANTI DOUBLE BOOKING)
    // ======================
    await db.runTransaction(async (transaction)=>{

      let ref = db.collection("slots").doc(slotId);
      let doc = await transaction.get(ref);

      if(!doc.exists) throw "Slot not found";

      let data = doc.data();

      if(data.booked){
        throw "هذا الموعد محجوز بالفعل";
      }

      transaction.update(ref,{
        booked:true,
        status:"confirmed",
        patient:{
          name,
          phone,
          notes:""
        }
      });

    });

    msg.innerHTML = "✅ تم الحجز بنجاح";
    msg.className = "msg ok";

    checkDay();

  }catch(err){

    console.error(err);
    msg.innerHTML = "❌ حدث خطأ: " + err;

  }finally{
    btn.classList.remove("loading");
  }

}

</script>

</body>
</html>
