<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<title>نظام حجز احترافي</title>

<style>

body{
  font-family:'Segoe UI',Tahoma,Arial,sans-serif;
  background:linear-gradient(135deg,#e9f0ff,#f5f7fb);
  margin:0;
  padding:30px;
  display:flex;
  justify-content:center;
  align-items:center;
  min-height:100vh;
}

.box{
  width:100%;
  max-width:520px;
  background:#fff;
  padding:30px;
  border-radius:18px;
  box-shadow:0 10px 30px rgba(0,0,0,.08);
}

.box h2{
  text-align:center;
  color:#1a237e;
  margin-bottom:20px;
}

input{
  width:100%;
  padding:12px;
  margin:10px 0;
  border-radius:10px;
  border:1px solid #ddd;
  box-sizing:border-box;
}

button{
  width:100%;
  padding:13px;
  margin-top:10px;
  border:none;
  border-radius:10px;
  background:#1b5e20;
  color:#fff;
  font-size:15px;
  cursor:pointer;
}

button:hover{
  opacity:.95;
}

.slot{
  padding:12px;
  margin:8px 0;
  background:#f1f5f9;
  border-radius:10px;
  cursor:pointer;
  transition:.2s;
}

.slot:hover{
  background:#dbeafe;
}

.selected{
  background:#1d4ed8 !important;
  color:#fff;
}

.msg{
  margin-top:15px;
  text-align:center;
}

</style>
</head>

<body>

<div class="box">

<h2>📅 احجز موعدك</h2>

<input id="name" placeholder="الاسم">

<input id="phone" placeholder="رقم الهاتف">

<input type="date" id="dateInput">

<div id="slotsContainer"></div>

<div class="msg" id="msg"></div>

<button onclick="book()">
تأكيد الحجز
</button>

</div>

<script type="module">

import { db } from "./firebase.js";

import {
  collection,
  query,
  where,
  getDocs,
  doc,
  getDoc,
  updateDoc,
  addDoc,
  serverTimestamp
} from "https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore.js";

/* =========================
   STATE
========================= */

let selectedDate = "";
let selectedSlotId = null;
let slotsCache = [];

/* =========================
   DATE CHANGE
========================= */

document
.getElementById("dateInput")
.addEventListener("change", async (e) => {

  selectedDate = e.target.value;

  selectedSlotId = null;

  await loadSlots(selectedDate);
});

/* =========================
   LOAD SLOTS
========================= */

async function loadSlots(date){

  const q = query(
    collection(db,"slots"),
    where("date","==",date)
  );

  const snap = await getDocs(q);

  slotsCache = [];

  snap.forEach(d => {
    slotsCache.push({
      id:d.id,
      ...d.data()
    });
  });

  renderSlots();
}

/* =========================
   RENDER SLOTS
========================= */

function renderSlots(){

  const container =
    document.getElementById("slotsContainer");

  container.innerHTML = "";

  const availableSlots = slotsCache
    .filter(slot => slot.booked !== true)
    .sort((a,b)=>a.time.localeCompare(b.time));

  /* NO SLOTS */

  if(availableSlots.length === 0){

    container.innerHTML = `
      <div class="msg">
        ❌ لا توجد مواعيد متاحة لهذا اليوم
      </div>

      <button onclick="createRequest()">
        إرسال طلب موعد
      </button>
    `;

    return;
  }

  /* AVAILABLE SLOTS */

  availableSlots.forEach(slot => {

    const div = document.createElement("div");

    div.className = "slot";

    div.innerHTML = `🕒 ${slot.time}`;

    div.onclick = () => {

      selectedSlotId = slot.id;

      document
        .querySelectorAll(".slot")
        .forEach(el => el.classList.remove("selected"));

      div.classList.add("selected");
    };

    container.appendChild(div);
  });
}

/* =========================
   BOOK SLOT
========================= */

window.book = async function(){

  const name =
    document.getElementById("name").value.trim();

  const phone =
    document.getElementById("phone").value.trim();

  if(!name || !phone || !selectedDate){

    alert("من فضلك أكمل البيانات");

    return;
  }

  /* لو مفيش slot مختار */
  if(!selectedSlotId){

    alert("اختر موعد أولاً");

    return;
  }

  const ref = doc(db,"slots",selectedSlotId);

  const snap = await getDoc(ref);

  if(!snap.exists()){

    alert("الموعد غير موجود");

    return;
  }

  const data = snap.data();

  /* DOUBLE BOOKING PROTECTION */

  if(data.booked === true){

    alert("هذا الموعد تم حجزه بالفعل");

    await loadSlots(selectedDate);

    return;
  }

  await updateDoc(ref,{

    booked:true,

    status:"booked",

    patient:{
      name,
      phone
    },

    updatedAt:serverTimestamp()
  });

  alert("تم الحجز بنجاح ✔️");

  selectedSlotId = null;

  await loadSlots(selectedDate);
};

/* =========================
   REQUEST FLOW
========================= */

window.createRequest = async function(){

  const name =
    document.getElementById("name").value.trim();

  const phone =
    document.getElementById("phone").value.trim();

  if(!name || !phone || !selectedDate){

    alert("من فضلك أكمل البيانات");

    return;
  }

  await addDoc(collection(db,"requests"),{

    name,
    phone,
    date:selectedDate,

    status:"pending",

    createdAt:serverTimestamp()
  });

  alert("تم إرسال طلب الموعد ✔️");
};

</script>

</body>
</html>
