<!DOCTYPE html>
<html lang="ar">
<head>
<meta charset="UTF-8">
<title>Booking</title>
</head>

<body>

<h2>حجز موعد</h2>

<input id="name" placeholder="الاسم">
<input id="phone" placeholder="التليفون">

<select id="slots"></select>

<button onclick="book()">احجز</button>

<script src="https://www.gstatic.com/firebasejs/9.22.2/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/9.22.2/firebase-firestore-compat.js"></script>

<script>
const firebaseConfig = {
  apiKey: "AIzaSy...",
  authDomain: "mydoctor-clinic.firebaseapp.com",
  projectId: "mydoctor-clinic"
};

firebase.initializeApp(firebaseConfig);
const db = firebase.firestore();

/******** LOAD AVAILABLE ********/
function loadSlots(){
  let select = document.getElementById("slots");
  select.innerHTML="";

  db.collection("slots")
    .where("booked","==",false)
    .get()
    .then(snap=>{
      snap.forEach(doc=>{
        let s = doc.data();

        select.innerHTML += `
          <option value="${doc.id}">
            ${s.date} - ${s.time}
          </option>
        `;
      });
    });
}

/******** BOOK ********/
function book(){
  let name = document.getElementById("name").value;
  let phone = document.getElementById("phone").value;
  let id = document.getElementById("slots").value;

  db.collection("slots").doc(id).get().then(doc=>{

    if(doc.data().booked){
      alert("اتحجز ❌");
      loadSlots();
      return;
    }

    doc.ref.update({
      booked:true,
      patient:{name,phone}
    }).then(()=>{
      alert("تم الحجز ✅");
      loadSlots();
    });

  });
}

window.onload = loadSlots;
</script>

</body>
</html>
