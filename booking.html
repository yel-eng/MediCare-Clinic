<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<title>حجز موعد</title>

<style>
body{
  font-family:Arial;
  background:#f5f5f5;
  padding:20px;
}

.box{
  max-width:500px;
  margin:auto;
  background:white;
  padding:25px;
  border-radius:15px;
}

select,input{
  width:100%;
  padding:10px;
  margin:8px 0;
}

button{
  width:100%;
  padding:12px;
  background:#2e7d32;
  color:white;
  border:none;
  border-radius:8px;
}
</style>

</head>

<body>

<div class="box">

<h2>📅 احجز موعدك</h2>

<input id="name" placeholder="الاسم">
<input id="phone" placeholder="رقم الهاتف">

<!-- الأيام -->
<select id="daySelect" onchange="loadTimes()">
  <option value="">اختر اليوم</option>
</select>

<!-- الأوقات -->
<select id="timeSelect">
  <option value="">اختر الوقت</option>
</select>

<button onclick="book()">تأكيد الحجز</button>

</div>

<script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-app.js"></script>
<script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-firestore.js"></script>

<script>

// Firebase
const firebaseConfig = {
  apiKey: "AIzaSyA8FEgNeXAMZ1Sbg12zFCzwwxUD3sVl99o",
  authDomain: "mydoctor-clinic.firebaseapp.com",
  projectId: "mydoctor-clinic"
};

firebase.initializeApp(firebaseConfig);
const db = firebase.firestore();


// ===============================
// تحميل الأيام (مظبوط)
// ===============================
function loadDays(){

  db.collection("slots")
    .orderBy("date")
    .get()
    .then(snap=>{

      let days = new Set();

      snap.forEach(doc=>{
        let d = doc.data();
        if(!d.booked){
          days.add(d.date);
        }
      });

      let select = document.getElementById("daySelect");
      select.innerHTML = `<option value="">اختر اليوم</option>`;

      // تحويل Set لـ Array وترتيب
      [...days].sort().forEach(day=>{
        select.innerHTML += `<option value="${day}">${day}</option>`;
      });

    });

}


// ===============================
// تحميل الأوقات حسب اليوم
// ===============================
function loadTimes(){

  let day = document.getElementById("daySelect").value;

  let select = document.getElementById("timeSelect");
  select.innerHTML = `<option>جاري التحميل...</option>`;

  db.collection("slots")
    .where("date","==",day)
    .where("booked","==",false)
    .orderBy("time")
    .get()
    .then(snap=>{

      select.innerHTML = `<option value="">اختر الوقت</option>`;

      snap.forEach(doc=>{
        let s = doc.data();

        select.innerHTML += `
          <option value="${doc.id}">
            ${s.time}
          </option>
        `;
      });

    });

}


// ===============================
// الحجز
// ===============================
function book(){

  let name = document.getElementById("name").value;
  let phone = document.getElementById("phone").value;
  let slotId = document.getElementById("timeSelect").value;

  if(!name || !phone || !slotId){
    alert("املأ البيانات");
    return;
  }

  db.collection("slots").doc(slotId).get().then(doc=>{

    let s = doc.data();

    if(s.booked){
      alert("الموعد اتحجز ❌");
      return;
    }

    doc.ref.update({
      booked:true,
      patient:{name,phone}
    }).then(()=>{

      alert("تم الحجز ✅");

      loadDays();
      loadTimes();

    });

  });

}


// ===============================
window.onload = loadDays;
// ===============================

</script>

</body>
</html>
