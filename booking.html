<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<title>نظام حجز احترافي</title>

<style>
body{
  font-family: 'Segoe UI', Tahoma, Arial, sans-serif;
  background: linear-gradient(135deg, #e9f0ff, #f5f7fb);
  margin: 0;
  padding: 30px;
  display: flex;
  justify-content: center;
  align-items: center;
  min-height: 100vh;
}

/* Card */
.box{
  width: 100%;
  max-width: 520px;
  background: #ffffff;
  padding: 30px;
  border-radius: 18px;
  box-shadow: 0 10px 30px rgba(0,0,0,0.08);
  border: 1px solid rgba(0,0,0,0.05);
  position: relative;
  overflow: hidden;
}

/* Title */
.box h2{
  margin-bottom: 20px;
  font-size: 24px;
  color: #1a237e;
  text-align: center;
}

/* Inputs */
input, select{
  width: 100%;
  padding: 12px 14px;
  margin: 10px 0;
  border-radius: 10px;
  border: 1px solid #dfe3e8;
  background: #fafbff;
  font-size: 14px;
  transition: 0.2s ease;
}

input:focus, select:focus{
  border-color: #3f51b5;
  outline: none;
  box-shadow: 0 0 0 3px rgba(63,81,181,0.15);
  background: #fff;
}

/* Button */
button{
  width: 100%;
  padding: 13px;
  margin-top: 10px;
  background: linear-gradient(135deg, #2e7d32, #1b5e20);
  color: white;
  border: none;
  border-radius: 12px;
  font-size: 15px;
  font-weight: bold;
  cursor: pointer;
  transition: 0.25s ease;
  box-shadow: 0 6px 15px rgba(46,125,50,0.25);
}

button:hover{
  transform: translateY(-2px);
  box-shadow: 0 10px 20px rgba(46,125,50,0.3);
}

button:active{
  transform: scale(0.98);
}

/* Message */
.msg{
  margin: 12px 0;
  padding: 10px 12px;
  border-radius: 10px;
  font-size: 14px;
  background: #fff3f3;
  border: 1px solid #ffcdd2;
  color: #c62828;
  text-align: center;
}

.ok{
  background: #e8f5e9 !important;
  border-color: #a5d6a7 !important;
  color: #2e7d32 !important;
}

/* Loading state */
.loading{
  opacity: 0.7;
  pointer-events: none;
  position: relative;
}

/* Loading animation */
.loading::after{
  content: "";
  position: absolute;
  right: 15px;
  top: 50%;
  width: 14px;
  height: 14px;
  border: 2px solid #fff;
  border-top: 2px solid transparent;
  border-radius: 50%;
  animation: spin 0.8s linear infinite;
  transform: translateY(-50%);
}

@keyframes spin{
  0% { transform: translateY(-50%) rotate(0deg); }
  100% { transform: translateY(-50%) rotate(360deg); }
}
</style>
</head>

<body>

<div class="box">

<h2>📅 احجز موعدك</h2>

<input id="name" placeholder="الاسم">
<input id="phone" placeholder="رقم الهاتف">

<input type="date" id="dateInput" onchange="checkDay()">

<select id="timeSelect" style="display:none;"></select>

<div id="msg" class="msg"></div>

<button id="btn" onclick="book()">تأكيد الحجز</button>

</div>



<script type="module">
// auth.js (AUTH CORE SYSTEM)

import { auth, db } from "./firebase.js";

import {
  signInWithEmailAndPassword,
  signOut,
  onAuthStateChanged
} from "https://www.gstatic.com/firebasejs/10.12.2/firebase-auth.js";

import {
  doc,
  getDoc
} from "https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore.js";

/* =========================
   GLOBAL STATE (NON-REACTIVE BUT SAFE)
========================= */

let currentUser = null;

/* =========================
   GET CURRENT USER (SAFE ACCESS)
========================= */

function getCurrentUser() {
  return currentUser;
}

/* =========================
   LOGIN
========================= */

window.login = async function () {

  const email = document.getElementById("email").value.trim();
  const password = document.getElementById("password").value.trim();

  try {

    const cred = await signInWithEmailAndPassword(auth, email, password);

    const uid = cred.user.uid;

    const userSnap = await getDoc(doc(db, "users", uid));

    const role = userSnap.exists() ? (userSnap.data().role || "user") : "user";

    currentUser = {
      uid,
      email: cred.user.email,
      role
    };

    console.log("Logged in:", currentUser);

    window.location.href = "booking.html";

  } catch (e) {
    alert("Login failed: " + e.message);
  }
};

/* =========================
   LOGOUT
========================= */

window.logout = async function () {
  await signOut(auth);
  currentUser = null;
  window.location.href = "login.html";
};

/* =========================
   AUTH STATE LISTENER (REAL SOURCE OF TRUTH)
========================= */

onAuthStateChanged(auth, async (user) => {

  if (!user) {
    currentUser = null;
    return;
  }

  const userSnap = await getDoc(doc(db, "users", user.uid));

  const role = userSnap.exists() ? (userSnap.data().role || "user") : "user";

  currentUser = {
    uid: user.uid,
    email: user.email,
    role
  };

  console.log("Auth Updated:", currentUser);
});

/* =========================
   GUARDS
========================= */

function requireAuth() {
  if (!currentUser) {
    window.location.href = "login.html";
  }
}

function requireAdmin() {
  if (!currentUser || currentUser.role !== "admin") {
    window.location.href = "booking.html";
  }
}

/* =========================
   GLOBAL EXPORT (IMPORTANT)
========================= */

window.getCurrentUser = getCurrentUser;
window.requireAuth = requireAuth;
window.requireAdmin = requireAdmin;
</script>

</body>
</html>
