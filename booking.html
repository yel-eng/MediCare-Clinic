<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<title>نظام الحجز</title>

<style>
body{
  font-family: Arial;
  background:#1a237e;
  margin:0;
  padding:30px;
  display:flex;
  justify-content:center;
  margin-top:100px;
}

.box{
  width:100%;
  max-width:500px;
  background:#fff;
  padding:20px;
  border-radius:15px;
  box-shadow:0 5px 20px rgba(0,0,0,.9);
}

input{
  width:100%;
  padding:10px;
  margin:8px 0;
  border:1px solid #ddd;
  border-radius:8px;
}

button{
  width:100%;
  padding:12px;
  margin-top:10px;
  background:#1a237e;
  color:#fff;
  border:none;
  border-radius:8px;
  cursor:pointer;
}

.slot{
  padding:10px;
  margin:5px 0;
  background:#eee;
  border-radius:8px;
  cursor:pointer;
}

.selected{
  background:#1a237e;
  color:#fff;
}
</style>
</head>

<body>

<div class="box">

<h2>📅 احجز موعدك</h2>

<input id="name" placeholder="الاسم">
<input id="phone" placeholder="الهاتف">
<input type="date" id="dateInput">

<div id="slotsContainer"></div>

<button onclick="book()">تأكيد الحجز</button>

</div>

<!-- ================= POPUP ================= -->
<div id="popup" style="
  display:none;
  position:fixed;
  top:0; left:0;
  width:100%; height:100%;
  background:rgba(0,0,0,0.6);
  justify-content:center;
  align-items:center;
">

  <div style="
    background:#fff;
    width:400px;
    max-height:80vh;
    overflow:auto;
    padding:20px;
    border-radius:12px;
  ">

    <h3>اختار ميعاد للمريض</h3>

    <div id="popupSlots"></div>

    <button onclick="closePopup()">إغلاق</button>

  </div>
</div>

<script type="module">
import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-app.js";
import {
  getFirestore,
  collection,
  onSnapshot,
  doc,
  getDoc,
  updateDoc,
  addDoc,
  query,
  where,
  getDocs,
  serverTimestamp
} from "https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore.js";

import { getAuth } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-auth.js";

/* ================= FIREBASE ================= */
const firebaseConfig = {
  apiKey: "AIzaSyA8FEgNeXAMZ1Sbg12zFCzwwxUD3sVl99o",
  authDomain: "mydoctor-clinic.firebaseapp.com",
  projectId: "mydoctor-clinic",
};

const app = initializeApp(firebaseConfig);
const db = getFirestore(app);
const auth = getAuth(app);

window.db = db;

/* ================= STATE ================= */
const $ = (id) => document.getElementById(id);

let slotsCache = [];
let requestsCache = [];
let selectedRequest = null;

const slotsRef = collection(db, "slots");
const requestsRef = collection(db, "requests");

/* ================= REALTIME ================= */
onSnapshot(slotsRef, snap => {
  slotsCache = [];
  snap.forEach(d => slotsCache.push({ id: d.id, ...d.data() }));
  renderSlots();
});

onSnapshot(requestsRef, snap => {
  requestsCache = [];
  snap.forEach(d => requestsCache.push({ id: d.id, ...d.data() }));
  renderRequests();
});

/* ================= BOOK ================= */
/* ================= BOOK (الإصدار المُصلح) ================= */
window.book = async () => {

  const name = $("name").value.trim();
  const phone = $("phone").value.trim();
  const date = $("dateInput").value;

  if (!name || !phone || !date) {
    alert("⚠️ اكمل البيانات");
    return;
  }

  try {
    // 1. نجرب نجيب المواعيد المتاحة في هذا التاريخ فقط
    const q = query(
      slotsRef, 
      where("date", "==", date),
      where("booked", "==", false)  // فلتر من فايربيس مباشرة
    );
    
    const snap = await getDocs(q);
    let found = null;

    if (!snap.empty) {
      // نأخذ أول ميعاد متاح
      const firstDoc = snap.docs[0];
      found = { id: firstDoc.id, ...firstDoc.data() };
    }

    if (found) {
      // 2. لو في ميعاد متاح، نحجزه
      await updateDoc(doc(db, "slots", found.id), {
        booked: true,
        status: "booked",
        patient: { name, phone },
        updatedAt: serverTimestamp()
      });
      alert("✅ تم الحجز في ميعاد: " + found.time);
      return;
    }

    // 3. لو مفيش مواعيد، ننشئ طلب جديد بدلاً من إنشاء ميعاد عشوائي
    await addDoc(requestsRef, {
      name,
      phone,
      date,
      status: "pending",
      createdAt: serverTimestamp(),
      source: "booking_page"
    });

    alert("📝 مفيش مواعيد متاحة في هذا اليوم، تم إرسال طلبك للمراجعة ✔️");

  } catch (err) {
    console.error("❌ Booking Error:", err);
    
    // لو الخطأ بسبب Index، نوجه المستخدم
    if (err.message?.includes("index")) {
      alert("⚠️ النظام يحتاج فهرس جديد. يرجى التواصل مع الدعم الفني.");
    } else {
      alert("❌ حدث خطأ أثناء الحجز. حاول مرة أخرى.");
    }
  }
};
/* ================= OPEN REQUEST ================= */
window.openRequest = (id) => {

  selectedRequest = id;

  loadPopupSlots();

  document.getElementById("popup").style.display = "flex";
};

/* ================= LOAD POPUP ================= */
async function loadPopupSlots(){

  const box = document.getElementById("popupSlots");
  box.innerHTML = "";

  slotsCache
    .filter(s => !s.booked)
    .forEach(s => {

      const div = document.createElement("div");

      div.style = `
        padding:10px;
        margin:5px 0;
        background:#eee;
        cursor:pointer;
        border-radius:8px;
      `;

      div.innerText = `🕒 ${s.date} - ${s.time}`;

      div.onclick = () => assignToSlot(s.id);

      box.appendChild(div);
    });
}

/* ================= ASSIGN SLOT ================= */
window.assignToSlot = async (slotId) => {

  if (!selectedRequest) return;

  const reqRef = doc(db,"requests",selectedRequest);
  const reqSnap = await getDoc(reqRef);

  const req = reqSnap.data();

  await updateDoc(doc(db,"slots",slotId), {
    booked:true,
    status:"booked",
    patient:{
      name:req.name,
      phone:req.phone
    }
  });

  await updateDoc(reqRef, {
    status:"assigned"
  });

  closePopup();

  selectedRequest = null;

  alert("تم الحجز ✔️");
};

/* ================= CLOSE POPUP ================= */
window.closePopup = () => {
  document.getElementById("popup").style.display = "none";
};

/* ================= RENDER SLOTS ================= */
function renderSlots(){

  const grid = document.getElementById("slotsContainer");
  grid.innerHTML = "";

  let days = {};

  slotsCache.forEach(s => {
    if (!days[s.date]) days[s.date] = [];
    days[s.date].push(s);
  });

  Object.keys(days).forEach(date => {

    const col = document.createElement("div");

    col.innerHTML = `
      <h3>${date}</h3>

      ${days[date].map(s => `
        <div style="padding:8px;border:1px solid #ccc;margin:5px;cursor:pointer">
          🕒 ${s.time} - ${s.status}

          <button onclick="event.stopPropagation(); assignToSlot('${s.id}')">
            حجز
          </button>
        </div>
      `).join("")}
    `;

    grid.appendChild(col);
  });
}

/* ================= RENDER REQUESTS ================= */
function renderRequests(){

  const box = document.getElementById("requestsBox");
  if (!box) return;

  box.innerHTML = "";

  requestsCache.forEach(r => {

    box.innerHTML += `
      <div style="padding:10px;border:1px solid #ddd;margin:5px">
        👤 ${r.name} - 📞 ${r.phone}
        <button onclick="openRequest('${r.id}')">تحديد ميعاد</button>
      </div>
    `;
  });
}

</script>

</body>
</html>
