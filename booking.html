<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<title>نظام الحجز</title>

<style>
body{
  font-family: Arial;
  background:#1a237e;
  margin:0;
  padding:30px;
  display:flex;
  justify-content:center;
   margin-top:100px;
}

.box{
  width:100%;
  max-width:500px;
  background:#fff;
  padding:20px;
  border-radius:15px;
  box-shadow:0 5px 20px rgba(0,0,0,.9);
}

input{
  width:100%;
  padding:10px;
  margin:8px 0;
  border:1px solid #ddd;
  border-radius:8px;
}

button{
  width:100%;
  padding:12px;
  margin-top:10px;
  background:#1a237e;
  color:#fff;
  border:none;
  border-radius:8px;
  cursor:pointer;
}

.slot{
  padding:10px;
  margin:5px 0;
  background:#eee;
  border-radius:8px;
  cursor:pointer;
}

.selected{
  background:#1a237e;
  color:#fff;
}
</style>
</head>

<body>

<div class="box">

<h2>📅 احجز موعدك</h2>

<input id="name" placeholder="الاسم">
<input id="phone" placeholder="الهاتف">
<input type="date" id="dateInput">

<div id="slotsContainer"></div>

<button onclick="book()">تأكيد الحجز</button>

</div>

<script type="module">
import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-app.js";
import {
  getFirestore,
  collection,
  onSnapshot,
  doc,
  getDoc,
  updateDoc,
  addDoc,
  deleteDoc,
  query,
  where,
  getDocs,
  writeBatch,
  serverTimestamp
} from "https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore.js";

import { getAuth, signOut } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-auth.js";

/* ================= FIREBASE ================= */
const firebaseConfig = {
  apiKey: "AIzaSyA8FEgNeXAMZ1Sbg12zFCzwwxUD3sVl99o",
  authDomain: "mydoctor-clinic.firebaseapp.com",
  projectId: "mydoctor-clinic",
  storageBucket: "mydoctor-clinic.firebasestorage.app",
  messagingSenderId: "996532645974",
  appId: "1:996532645974:web:bfc3e6a61bdc7f04a24bf7"
};

const app = initializeApp(firebaseConfig);
const db = getFirestore(app);
const auth = getAuth(app);

window.db = db;

/* ================= STATE ================= */
const $ = (id) => document.getElementById(id);

let cache = [];
let activeId = null;

const slotsRef = collection(db, "slots");

/* ================= LOGOUT ================= */
window.logout = () => {
  signOut(auth).then(() => location.href = "login.html");
};

/* ================= REALTIME ================= */
onSnapshot(slotsRef, (snap) => {

  cache = [];

  snap.forEach(d => {
    cache.push({
      id: d.id,
      ...d.data()
    });
  });

  renderSlots();
});

/* ================= SELECT ================= */
window.selectSlot = async (id) => {

  activeId = id;

  const snap = await getDoc(doc(db, "slots", id));
  if (!snap.exists()) return;

  const d = snap.data();

  $("pName").value = d.patient?.name || "";
  $("pPhone").value = d.patient?.phone || "";
  $("pNotes").value = d.patient?.notes || "";
  $("pPaid").value = d.paid || 0;
  $("pStatus").value = d.status || "حجز";

  $("targetTime").innerText = `${d.date} - ${d.time}`;
};

/* ================= UPDATE ================= */
window.updateSlot = async () => {

  if (!activeId) return alert("اختاري ميعاد أولاً");

  await updateDoc(doc(db, "slots", activeId), {
    booked: $("pName").value.trim() !== "",
    status: $("pStatus").value,
    paid: Number($("pPaid").value || 0),
    patient: {
      name: $("pName").value,
      phone: $("pPhone").value,
      notes: $("pNotes").value
    },
    updatedAt: serverTimestamp()
  });

  activeId = null;
  alert("تم الحفظ ✔️");
};

/* ================= CREATE SLOTS ================= */
window.setAvailability = async () => {

  const date = $("slotDate").value;
  const start = $("startTime").value;
  const end = $("endTime").value;
  const duration = Number($("slotDuration").value);

  let t = new Date(`${date}T${start}`);
  const endT = new Date(`${date}T${end}`);

  while (t < endT) {

    await addDoc(slotsRef, {
      date,
      time: t.toTimeString().slice(0,5),
      booked: false,
      status: "حجز",
      patient: {},
      createdAt: serverTimestamp()
    });

    t.setMinutes(t.getMinutes() + duration);
  }

  alert("تم إنشاء المواعيد ✔️");
};

/* ================= DELETE DAY ================= */
window.deleteDay = async (date) => {

  const q = query(slotsRef, where("date", "==", date));
  const snap = await getDocs(q);

  const batch = writeBatch(db);
  snap.forEach(d => batch.delete(d.ref));
  await batch.commit();

  alert("تم الحذف ✔️");
};

/* ================= ✏️ EDIT SLOT (NEW) ================= */
window.editSlot = async (id) => {

  const ref = doc(db, "slots", id);
  const snap = await getDoc(ref);

  if (!snap.exists()) return;

  const d = snap.data();

  const newTime = prompt("الوقت:", d.time);
  const newStatus = prompt("الحالة (حجز / كشف / ملغي):", d.status);
  const newName = prompt("اسم المريض:", d.patient?.name || "");
  const newPhone = prompt("الهاتف:", d.patient?.phone || "");

  await updateDoc(ref, {
    time: newTime || d.time,
    status: newStatus || d.status,
    patient: {
      name: newName,
      phone: newPhone
    }
  });

  alert("تم التعديل ✔️");
};

/* ================= RENDER ================= */
function renderSlots() {

  const grid = $("daysGrid");
  const totalBox = $("globalTotal");

  let days = {};
  let total = 0;

  cache.forEach(d => {
    if (!days[d.date]) days[d.date] = [];
    days[d.date].push(d);
  });

  grid.innerHTML = "";

  Object.keys(days).sort().forEach(date => {

    let dayTotal = 0;

    const col = document.createElement("div");
    col.className = "day-col";

    col.innerHTML = `
      <div class="day-head">
        ${date}
        <span class="del-btn" onclick="deleteDay('${date}')">×</span>
      </div>

      <div class="day-money">💰 ${dayTotal} جنيه</div>

      ${days[date]
        .sort((a,b)=>a.time.localeCompare(b.time))
        .map(x => `
          <div class="slot-item ${x.booked ? "booked" : ""}"
            onclick="selectSlot('${x.id}')">

            <b>${x.time}</b> - ${x.patient?.name || "بدون اسم"} (${x.status})

            <button onclick="event.stopPropagation(); editSlot('${x.id}')"
              style="float:left;background:#fff;border:none;padding:4px;border-radius:6px;cursor:pointer;">
              ✏️
            </button>

          </div>
        `).join("")}
    `;

    grid.appendChild(col);
  });

  totalBox.innerText = "💰 إجمالي العيادة: " + total + " جنيه";
}
</script>

</body>
</html>
