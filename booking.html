<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>حجز موعد | عيادتي</title>
    <link rel="stylesheet" href="style.css">
    <style>
        .form-group { margin-bottom: 15px; text-align: right; }
        .form-group label { display: block; margin-bottom: 5px; font-weight: bold; }
        .form-group input, .form-group select { width: 100%; padding: 12px; border: 1px solid #ddd; border-radius: 8px; box-sizing: border-box; }
        .btn-book { width: 100%; padding: 15px; background: #4caf50; color: white; border: none; border-radius: 8px; font-size: 18px; cursor: pointer; margin-top: 10px; }
    </style>
</head>
<body>

<header class="header" style="background: #1a237e; color: white; padding: 20px; text-align: center;">
    <div class="logo">🏥 عيادة دكتور العائلة</div>
</header>

<div class="section" style="padding: 20px;">
    <div class="box" style="max-width: 500px; margin: 0 auto; background: white; padding: 30px; border-radius: 15px; box-shadow: 0 5px 15px rgba(0,0,0,0.1);">
        <h2 style="text-align: center;">🗓️ احجز موعدك الآن</h2>
        
        <div class="form-group">
            <label>الاسم بالكامل:</label>
            <input type="text" id="name" placeholder="أدخل اسمك الثلاثي">
        </div>

        <div class="form-group">
            <label>رقم الهاتف:</label>
            <input type="tel" id="phone" placeholder="01xxxxxxxxx">
        </div>

        <div class="form-group">
            <label>اختر اليوم:</label>
            <select id="daySelect" onchange="updateAvailableTimes()">
                <option value="">جاري تحميل الأيام المتاحة...</option>
            </select>
        </div>

        <div class="form-group" id="timeSlotGroup" style="display: none;">
            <label>اختر الوقت:</label>
            <select id="slotsSelect">
                <option value="">اختر الوقت...</option>
            </select>
        </div>

        <button class="btn-book" onclick="book()">تأكيد الحجز المسبق ⚡</button>
    </div>
</div>

<script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-app.js"></script>
<script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-firestore.js"></script>
<script src="script.js"></script>

</body>
</html>
