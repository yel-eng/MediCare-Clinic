<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<title>نظام حجز احترافي</title>

<style>
body{
  font-family: 'Segoe UI', Tahoma, Arial, sans-serif;
  background: linear-gradient(135deg, #e9f0ff, #f5f7fb);
  margin: 0;
  padding: 30px;
  display: flex;
  justify-content: center;
  align-items: center;
  min-height: 100vh;
}

/* Card */
.box{
  width: 100%;
  max-width: 520px;
  background: #ffffff;
  padding: 30px;
  border-radius: 18px;
  box-shadow: 0 10px 30px rgba(0,0,0,0.08);
  border: 1px solid rgba(0,0,0,0.05);
  position: relative;
  overflow: hidden;
}

/* Title */
.box h2{
  margin-bottom: 20px;
  font-size: 24px;
  color: #1a237e;
  text-align: center;
}

/* Inputs */
input, select{
  width: 100%;
  padding: 12px 14px;
  margin: 10px 0;
  border-radius: 10px;
  border: 1px solid #dfe3e8;
  background: #fafbff;
  font-size: 14px;
  transition: 0.2s ease;
}

input:focus, select:focus{
  border-color: #3f51b5;
  outline: none;
  box-shadow: 0 0 0 3px rgba(63,81,181,0.15);
  background: #fff;
}

/* Button */
button{
  width: 100%;
  padding: 13px;
  margin-top: 10px;
  background: linear-gradient(135deg, #2e7d32, #1b5e20);
  color: white;
  border: none;
  border-radius: 12px;
  font-size: 15px;
  font-weight: bold;
  cursor: pointer;
  transition: 0.25s ease;
  box-shadow: 0 6px 15px rgba(46,125,50,0.25);
}

button:hover{
  transform: translateY(-2px);
  box-shadow: 0 10px 20px rgba(46,125,50,0.3);
}

button:active{
  transform: scale(0.98);
}

/* Message */
.msg{
  margin: 12px 0;
  padding: 10px 12px;
  border-radius: 10px;
  font-size: 14px;
  background: #fff3f3;
  border: 1px solid #ffcdd2;
  color: #c62828;
  text-align: center;
}

.ok{
  background: #e8f5e9 !important;
  border-color: #a5d6a7 !important;
  color: #2e7d32 !important;
}

/* Loading state */
.loading{
  opacity: 0.7;
  pointer-events: none;
  position: relative;
}

/* Loading animation */
.loading::after{
  content: "";
  position: absolute;
  right: 15px;
  top: 50%;
  width: 14px;
  height: 14px;
  border: 2px solid #fff;
  border-top: 2px solid transparent;
  border-radius: 50%;
  animation: spin 0.8s linear infinite;
  transform: translateY(-50%);
}

@keyframes spin{
  0% { transform: translateY(-50%) rotate(0deg); }
  100% { transform: translateY(-50%) rotate(360deg); }
}
</style>
</head>

<body>

<div class="box">

<h2>📅 احجز موعدك</h2>

<input id="name" placeholder="الاسم">
<input id="phone" placeholder="رقم الهاتف">

<input type="date" id="dateInput" onchange="checkDay()">

<select id="timeSelect" style="display:none;"></select>

<div id="msg" class="msg"></div>

<button id="btn" onclick="book()">تأكيد الحجز</button>

</div>

<script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-app.js"></script>
<script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-firestore.js"></script>

<script type="module">
import { db } from "./firebase.js";

import {
  collection,
  query,
  where,
  getDocs,
  doc,
  getDoc,
  updateDoc,
  addDoc,
  serverTimestamp
} from "https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore.js";

/* =========================
   STATE
========================= */

let selectedDate = "";
let slotsCache = [];

/* =========================
   AUTH CHECK (REQUIRED)
========================= */

window.addEventListener("load", () => {
  const user = window.getCurrentUser?.();

  if (!user) {
    window.location.href = "login.html";
  }
});

/* =========================
   LOAD SLOTS BY DATE
========================= */

window.loadSlots = async function (date) {

  selectedDate = date;

  const q = query(
    collection(db, "slots"),
    where("date", "==", date)
  );

  const snap = await getDocs(q);

  slotsCache = [];

  snap.forEach(d => {
    slotsCache.push({ id: d.id, ...d.data() });
  });

  renderSlots();
};

/* =========================
   BOOK SLOT (USER FLOW)
========================= */

window.bookSlot = async function (slotId) {

  const user = window.getCurrentUser?.();

  if (!user) {
    alert("Login required");
    return;
  }

  const ref = doc(db, "slots", slotId);
  const snap = await getDoc(ref);

  if (!snap.exists()) {
    alert("Slot not found");
    return;
  }

  const data = snap.data();

  /* ❌ double booking protection */
  if (data.booked === true) {
    alert("This slot is already booked");
    return;
  }

  await updateDoc(ref, {
    booked: true,
    status: "booked",
    patient: {
      uid: user.uid,
      name: user.email
    },
    updatedAt: serverTimestamp()
  });

  alert("Booking confirmed ✔️");

  loadSlots(selectedDate);
};

/* =========================
   REQUEST FLOW (NO SLOTS CASE)
========================= */

window.createRequest = async function () {

  const user = window.getCurrentUser?.();

  if (!user || !selectedDate) {
    alert("Missing data");
    return;
  }

  await addDoc(collection(db, "requests"), {
    uid: user.uid,
    name: user.email,
    date: selectedDate,
    status: "pending",
    createdAt: serverTimestamp()
  });

  alert("Request sent ✔️");
};

/* =========================
   RENDER UI
========================= */

function renderSlots() {

  const container = document.getElementById("slotsContainer");

  container.innerHTML = "";

  /* NO SLOTS CASE */
  if (slotsCache.length === 0) {

    container.innerHTML = `
      <div style="text-align:center; padding:20px;">
        <p>❌ No available slots for this day</p>

        <button onclick="createRequest()"
          style="
            padding:10px 20px;
            background:#1d4ed8;
            color:white;
            border:none;
            border-radius:8px;
            cursor:pointer;
          ">
          Request Appointment
        </button>
      </div>
    `;

    return;
  }

  /* AVAILABLE SLOTS */
  const availableSlots = slotsCache
    .filter(slot => slot.booked !== true)
    .sort((a, b) => a.time.localeCompare(b.time));

  availableSlots.forEach(slot => {

    container.innerHTML += `
      <div onclick="bookSlot('${slot.id}')"
        style="
          padding:12px;
          margin:8px 0;
          background:#f1f5f9;
          border-radius:10px;
          cursor:pointer;
        ">
        🕒 ${slot.time}
      </div>
    `;
  });

  /* IF ALL SLOTS BOOKED */
  if (availableSlots.length === 0) {

    container.innerHTML += `
      <div style="text-align:center; margin-top:20px;">
        <p>⚠️ All slots are booked</p>

        <button onclick="createRequest()"
          style="
            padding:10px 20px;
            background:#dc2626;
            color:white;
            border:none;
            border-radius:8px;
            cursor:pointer;
          ">
          Send Request
        </button>
      </div>
    `;
  }
}

/* =========================
   HELPERS
========================= */

window.getSelectedDate = function () {
  return selectedDate;
};>
</script>

</body>
</html>
