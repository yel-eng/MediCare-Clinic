<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<title>حجز موعد</title>

<style>
body{
  font-family:Arial;
  background:#f5f5f5;
  padding:20px;
}

.box{
  max-width:500px;
  margin:auto;
  background:white;
  padding:25px;
  border-radius:15px;
}

input,select{
  width:100%;
  padding:10px;
  margin:8px 0;
}

button{
  width:100%;
  padding:12px;
  background:#2e7d32;
  color:white;
  border:none;
  border-radius:8px;
}

.msg{
  margin:10px 0;
  color:#c62828;
  font-weight:bold;
}
</style>

</head>

<body>

<div class="box">

<h2>📅 احجز موعدك</h2>

<input id="name" placeholder="الاسم">
<input id="phone" placeholder="رقم الهاتف">

<!-- اختيار اليوم -->
<input type="date" id="dateInput" onchange="checkDay()">

<!-- الأوقات -->
<select id="timeSelect" style="display:none;"></select>

<div id="msg" class="msg"></div>

<button onclick="book()">تأكيد الحجز</button>

</div>

<script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-app.js"></script>
<script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-firestore.js"></script>

<script>

// Firebase
const firebaseConfig = {
  apiKey: "AIzaSyA8FEgNeXAMZ1Sbg12zFCzwwxUD3sVl99o",
  authDomain: "mydoctor-clinic.firebaseapp.com",
  projectId: "mydoctor-clinic"
};

firebase.initializeApp(firebaseConfig);
const db = firebase.firestore();

let selectedSlotId = null;
let noSlotsMode = false;


// ==========================
// عند اختيار يوم
// ==========================
function checkDay(){

  let date = document.getElementById("dateInput").value;

  let select = document.getElementById("timeSelect");
  let msg = document.getElementById("msg");

  select.style.display = "none";
  msg.innerHTML = "جاري التحميل...";

  db.collection("slots")
    .where("date","==",date)
    .get()
    .then(snap=>{

      // لو مفيش مواعيد أصلا
      if(snap.empty){
        noSlotsMode = true;
        selectedSlotId = null;

        msg.innerHTML = "📞 سنتواصل معك لتحديد ميعاد";
        return;
      }

      // فلترة المواعيد الفاضية
      let available = [];

      snap.forEach(doc=>{
        let s = doc.data();
        if(!s.booked){
          available.push({id:doc.id, ...s});
        }
      });

      // لو اليوم كله محجوز
      if(available.length === 0){
        noSlotsMode = true;
        selectedSlotId = null;

        msg.innerHTML = "❌ اليوم ممتلئ - سنتواصل معك";
        return;
      }

      // في مواعيد متاحة
      noSlotsMode = false;
      msg.innerHTML = "";

      select.innerHTML = `<option value="">اختر الوقت</option>`;

      available.sort((a,b)=> a.time.localeCompare(b.time));

      available.forEach(s=>{
        select.innerHTML += `
          <option value="${s.id}">
            ${s.time}
          </option>
        `;
      });

      select.style.display = "block";

    });

}


// ==========================
// الحجز
// ==========================
function book(){

  let name = document.getElementById("name").value;
  let phone = document.getElementById("phone").value;
  let date = document.getElementById("dateInput").value;

  if(!name || !phone || !date){
    alert("املأ البيانات");
    return;
  }

  // ======================
  // لو مفيش مواعيد
  // ======================
  if(noSlotsMode){

    db.collection("slots").add({
      date: date,
      time: "غير محدد",
      booked: true,
      status: "حجز",
      paid: 0,
      patient:{
        name,
        phone,
        notes: "تواصل مع العميل لتحديد ميعاد"
      },
      timestamp: firebase.firestore.Timestamp.now()
    }).then(()=>{

      alert("تم تسجيل طلبك ✅ سنتواصل معك");

    });

    return;
  }

  // ======================
  // حجز عادي
  // ======================
  let slotId = document.getElementById("timeSelect").value;

  if(!slotId){
    alert("اختار وقت");
    return;
  }

  db.collection("slots").doc(slotId).get().then(doc=>{

    let s = doc.data();

    if(s.booked){
      alert("الموعد اتحجز ❌");
      return;
    }

    doc.ref.update({
      booked:true,
      patient:{
        name,
        phone,
        notes:""
      }
    }).then(()=>{

      alert("تم الحجز ✅");
      checkDay();

    });

  });

}

</script>

</body>
</html>
