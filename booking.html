<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<title>نظام الحجز</title>

<style>
body{
  font-family: Arial;
  background:#1a237e;
  margin:0;
  padding:30px;
  display:flex;
  justify-content:center;
   margin-top:100px;
}

.box{
  width:100%;
  max-width:500px;
  background:#fff;
  padding:20px;
  border-radius:15px;
  box-shadow:0 5px 20px rgba(0,0,0,.9);
}

input{
  width:100%;
  padding:10px;
  margin:8px 0;
  border:1px solid #ddd;
  border-radius:8px;
}

button{
  width:100%;
  padding:12px;
  margin-top:10px;
  background:#1a237e;
  color:#fff;
  border:none;
  border-radius:8px;
  cursor:pointer;
}

.slot{
  padding:10px;
  margin:5px 0;
  background:#eee;
  border-radius:8px;
  cursor:pointer;
}

.selected{
  background:#1a237e;
  color:#fff;
}
</style>
</head>

<body>

<div class="box">

<h2>📅 احجز موعدك</h2>

<input id="name" placeholder="الاسم">
<input id="phone" placeholder="الهاتف">
<input type="date" id="dateInput">

<div id="slotsContainer"></div>

<button onclick="book()">تأكيد الحجز</button>

</div>

<script type="module">
import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-app.js";
import {
  getFirestore,
  collection,
  onSnapshot,
  doc,
  getDoc,
  updateDoc,
  addDoc,
  query,
  where,
  getDocs,
  serverTimestamp
} from "https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore.js";

import { getAuth, signOut } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-auth.js";

/* ================= FIREBASE ================= */
const firebaseConfig = {
  apiKey: "AIzaSyA8FEgNeXAMZ1Sbg12zFCzwwxUD3sVl99o",
  authDomain: "mydoctor-clinic.firebaseapp.com",
  projectId: "mydoctor-clinic",
};

const app = initializeApp(firebaseConfig);
const db = getFirestore(app);
const auth = getAuth(app);

window.db = db;

/* ================= STATE ================= */
const $ = (id) => document.getElementById(id);

let slotsCache = [];
let requestsCache = [];
let selectedRequest = null;

/* ================= COLLECTIONS ================= */
const slotsRef = collection(db, "slots");
const requestsRef = collection(db, "requests");

/* ================= REALTIME ================= */
onSnapshot(slotsRef, snap => {
  slotsCache = [];
  snap.forEach(d => slotsCache.push({ id: d.id, ...d.data() }));
  renderSlots();
});

onSnapshot(requestsRef, snap => {
  requestsCache = [];
  snap.forEach(d => requestsCache.push({ id: d.id, ...d.data() }));
  renderRequests();
});

/* ================= LOGOUT ================= */
window.logout = () => signOut(auth).then(()=>location.href="login.html");

/* ================= EDIT SLOT ================= */
window.editSlot = async (id) => {

  const ref = doc(db, "slots", id);
  const snap = await getDoc(ref);
  if (!snap.exists()) return;

  const d = snap.data();

  const time = prompt("الوقت:", d.time);
  const status = prompt("الحالة:", d.status);

  await updateDoc(ref, {
    time: time || d.time,
    status: status || d.status
  });

  alert("تم تعديل الميعاد ✔️");
};

/* ================= OPEN REQUEST ================= */
window.openRequest = (id) => {
  selectedRequest = id;
  alert("اختار ميعاد للمريض الآن");
};

/* ================= ASSIGN REQUEST ================= */
window.assignToSlot = async (slotId) => {

  if (!selectedRequest) {
    alert("اختار Request الأول");
    return;
  }

  const reqRef = doc(db, "requests", selectedRequest);
  const reqSnap = await getDoc(reqRef);

  if (!reqSnap.exists()) return;

  const req = reqSnap.data();

  await updateDoc(doc(db,"slots",slotId), {
    booked: true,
    status: "booked",
    patient: {
      name: req.name,
      phone: req.phone
    }
  });

  await updateDoc(reqRef, {
    status: "assigned"
  });

  selectedRequest = null;
  alert("تم الحجز ✔️");
};

/* ================= ADD SLOT ================= */
window.addSlot = async (date) => {

  const time = prompt("اكتب الوقت الجديد");

  if (!time) return;

  await addDoc(slotsRef, {
    date,
    time,
    booked: false,
    status: "available",
    patient: null,
    createdAt: serverTimestamp()
  });

  alert("تم إضافة ميعاد ✔️");
};

/* ================= AUTO CREATE DAY ================= */
async function getOrCreateDay(date){

  const q = query(slotsRef, where("date","==",date));
  const snap = await getDocs(q);

  if (snap.empty) {

    await addDoc(slotsRef, {
      date,
      time: "05:00 PM",
      booked: false,
      status: "available",
      patient: null,
      createdAt: serverTimestamp()
    });
  }
}

/* ================= RENDER SLOTS ================= */
function renderSlots(){

  const grid = document.getElementById("daysGrid");
  grid.innerHTML = "";

  let days = {};

  slotsCache.forEach(s => {
    if (!days[s.date]) days[s.date] = [];
    days[s.date].push(s);
  });

  Object.keys(days).forEach(date => {

    const col = document.createElement("div");
    col.innerHTML = `
      <h3>${date}</h3>
      <button onclick="addSlot('${date}')">+ ميعاد</button>

      ${days[date].map(s => `
        <div style="padding:8px;border:1px solid #ccc;margin:5px;cursor:pointer"
          onclick="editSlot('${s.id}')">

          🕒 ${s.time} - ${s.status}

          <button onclick="event.stopPropagation(); assignToSlot('${s.id}')">
            حجز
          </button>

        </div>
      `).join("")}
    `;

    grid.appendChild(col);
  });
}

/* ================= RENDER REQUESTS ================= */
function renderRequests(){

  const box = document.getElementById("requestsBox");
  if (!box) return;

  box.innerHTML = "";

  requestsCache.forEach(r => {

    box.innerHTML += `
      <div style="padding:10px;border:1px solid #ddd;margin:5px">
        👤 ${r.name} - 📞 ${r.phone}
        <button onclick="openRequest('${r.id}')">تحديد ميعاد</button>
      </div>
    `;
  });
}

</script>

</body>
</html>
