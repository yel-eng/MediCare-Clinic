<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<title>نظام الحجز</title>

<style>
body{
  font-family: Arial;
  background:#1a237e;
  margin:0;
  padding:30px;
  display:flex;
  justify-content:center;
   margin-top:100px;
}

.box{
  width:100%;
  max-width:500px;
  background:#fff;
  padding:20px;
  border-radius:15px;
  box-shadow:0 5px 20px rgba(0,0,0,.9);
}

input{
  width:100%;
  padding:10px;
  margin:8px 0;
  border:1px solid #ddd;
  border-radius:8px;
}

button{
  width:100%;
  padding:12px;
  margin-top:10px;
  background:#1a237e;
  color:#fff;
  border:none;
  border-radius:8px;
  cursor:pointer;
}

.slot{
  padding:10px;
  margin:5px 0;
  background:#eee;
  border-radius:8px;
  cursor:pointer;
}

.selected{
  background:#1a237e;
  color:#fff;
}
</style>
</head>

<body>

<div class="box">

<h2>📅 احجز موعدك</h2>

<input id="name" placeholder="الاسم">
<input id="phone" placeholder="الهاتف">
<input type="date" id="dateInput">

<div id="slotsContainer"></div>

<button onclick="book()">تأكيد الحجز</button>

</div>

<script type="module">

import { db } from "./firebase.js";

import {
  collection,
  query,
  where,
  getDocs,
  doc,
  getDoc,
  updateDoc,
  addDoc,
  serverTimestamp
} from "https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore.js";

/* =========================
   STATE
========================= */

let selectedDate = "";
let selectedSlotId = null;
let slotsCache = [];

/* =========================
   DATE CHANGE
========================= */

document.getElementById("dateInput").addEventListener("change", async (e)=>{

  selectedDate = e.target.value;
  selectedSlotId = null; // FIX: reset selection

  if(!selectedDate) return;

  await loadSlots(selectedDate);
});

/* =========================
   LOAD SLOTS
========================= */

async function loadSlots(date){

  const q = query(collection(db,"slots"), where("date","==",date));
  const snap = await getDocs(q);

  slotsCache = [];

  snap.forEach(d=>{
    slotsCache.push({id:d.id, ...d.data()});
  });

  renderSlots();
}

/* =========================
   RENDER
========================= */

function renderSlots(){

  const container = document.getElementById("slotsContainer");
  container.innerHTML = "";

  const available = slotsCache.filter(s => !s.booked);
  const totalSlots = slotsCache.length;

  /* =========================
     CASE 1: NO SLOTS AT ALL
  ========================= */

  if(totalSlots === 0){

    container.innerHTML = `
      <p>❌ لا يوجد مواعيد لهذا اليوم</p>

      <button onclick="createRequest()">
        طلب موعد
      </button>
    `;
    return;
  }

  /* =========================
     CASE 2: ALL BOOKED
  ========================= */

  if(available.length === 0){

    container.innerHTML = `
      <p>⚠️ كل المواعيد محجوزة</p>

      <button onclick="createRequest()">
        طلب موعد
      </button>
    `;
    return;
  }

  /* =========================
     CASE 3: AVAILABLE SLOTS
  ========================= */

  available.forEach(slot=>{

    const div = document.createElement("div");
    div.className = "slot";
    div.innerText = "🕒 " + slot.time;

    div.onclick = ()=>{

      selectedSlotId = slot.id;

      document.querySelectorAll(".slot")
        .forEach(el=>el.classList.remove("selected"));

      div.classList.add("selected");
    };

    container.appendChild(div);
  });
}
/* =========================
   BOOK SLOT
========================= */

window.book = async function(){

  const name = document.getElementById("name").value.trim();
  const phone = document.getElementById("phone").value.trim();

  if(!name || !phone){
    alert("أكمل البيانات");
    return;
  }

  if(!selectedDate){
    alert("اختر التاريخ");
    return;
  }

  if(!selectedSlotId){
    alert("اختر موعد");
    return;
  }

  const ref = doc(db,"slots",selectedSlotId);
  const snap = await getDoc(ref);

  if(!snap.exists()){
    alert("الموعد غير موجود");
    return;
  }

  const data = snap.data();

  if(data.booked === true){
    alert("محجوز بالفعل");
    return;
  }

  await updateDoc(ref,{
    booked:true,
    status:"booked",
    patient:{name,phone},
    updatedAt:serverTimestamp()
  });

  alert("تم الحجز ✔️");

  selectedSlotId = null; // FIX: prevent reuse
  await loadSlots(selectedDate);
};

/* =========================
   REQUEST
========================= */

window.createRequest = async function(){

  const name = document.getElementById("name").value.trim();
  const phone = document.getElementById("phone").value.trim();

  if(!name || !phone || !selectedDate){
    alert("أكمل البيانات");
    return;
  }

  await addDoc(collection(db,"slots"),{

    date: selectedDate,

    time: "طلب جديد",

    booked: false,

    status: "pending",

    paid: 0,

    patient:{
      name,
      phone,
      notes:""
    },

    createdAt: serverTimestamp()
  });

  alert("تم إرسال الطلب ✔️");
};

</script>

</body>
</html>
